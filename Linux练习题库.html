<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Linux 系统及应用 · 练习题库</title>
<style>
:root{
  --bg:#f4f3ee;--surface:#fff;--surface2:#faf9f5;--ink:#1c1f1d;--muted:#667069;--line:#e2e0d6;
  --accent:#0b7a5b;--accent-ink:#fff;--accent-soft:#e0f2ea;--accent-line:#a9d9c4;
  --bad:#c2362b;--bad-soft:#fbe9e6;--bad-line:#efb6ae;--warn:#a85a07;--warn-soft:#fdf0dc;
  --code-bg:#12171a;--code-ink:#d7efe2;--shadow:0 1px 2px rgba(20,30,25,.06),0 6px 18px rgba(20,30,25,.05);
  --r:14px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --hf:#a86b00;--hc:#1d6fc2;--hj:#7b46b8;--hs:#0b7a5b;--hp:#c2362b;
  --tk-c:#6b8a7a;--tk-s:#f0c674;--tk-k:#6cc7e6;--tk-p:#c9a0f0;--tk-n:#f09a6a;
}
:root[data-theme=dark]{
  --bg:#0f1311;--surface:#171c19;--surface2:#1c221e;--ink:#e7ece8;--muted:#97a29a;--line:#2a322d;
  --accent:#3fd99a;--accent-ink:#06261a;--accent-soft:#163226;--accent-line:#265a42;
  --bad:#ff8272;--bad-soft:#341c19;--bad-line:#6a2f29;--warn:#f0b35c;--warn-soft:#32260f;
  --code-bg:#0a0d0c;--code-ink:#d7efe2;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --hf:#f0c674;--hc:#7db8ff;--hj:#c7a2ff;--hs:#3fd99a;--hp:#ff8272;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0f1311;--surface:#171c19;--surface2:#1c221e;--ink:#e7ece8;--muted:#97a29a;--line:#2a322d;
    --accent:#3fd99a;--accent-ink:#06261a;--accent-soft:#163226;--accent-line:#265a42;
    --bad:#ff8272;--bad-soft:#341c19;--bad-line:#6a2f29;--warn:#f0b35c;--warn-soft:#32260f;
    --code-bg:#0a0d0c;--code-ink:#d7efe2;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --hf:#f0c674;--hc:#7db8ff;--hj:#c7a2ff;--hs:#3fd99a;--hp:#ff8272;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;color:var(--accent)}
.brand .cur{display:inline-block;width:8px;height:16px;background:var(--accent);animation:blink 1.1s steps(2,start) infinite;border-radius:1px}
@keyframes blink{to{visibility:hidden}}
.tabs{display:flex;gap:2px;margin-left:8px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 12px;border-radius:9px;color:var(--muted);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px;position:relative}
.tab:hover{background:var(--surface);color:var(--ink)}
.tab.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.tab .n{font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:17px;min-width:17px;text-align:center}
.tab svg,.bn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface);color:var(--ink)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn{display:none}
main{padding:22px 0 90px}
h1{font-size:24px;line-height:1.3;letter-spacing:-.2px}
h2{font-size:17px;line-height:1.4}
h3{font-size:15px}
.sub{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:18px}.mt2{margin-top:28px}.mb{margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px}
.sec h2{display:flex;align-items:center;gap:8px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:var(--bad-line)}
.btn.bad:hover{background:var(--bad-soft)}
.btn.lg{padding:12px 22px;font-size:15.5px;border-radius:12px}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--muted);transition:.12s}
.chip:hover{border-color:var(--accent-line)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.t-f{--h:var(--hf)}.tag.t-c{--h:var(--hc)}.tag.t-j{--h:var(--hj)}.tag.t-s{--h:var(--hs)}.tag.t-p{--h:var(--hp)}
.tag[class*=" t-"]{color:var(--h);background:color-mix(in srgb,var(--h) 12%,transparent);border-color:color-mix(in srgb,var(--h) 32%,transparent)}
.tag.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tag.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.tag.ok{color:var(--accent);background:var(--accent-soft);border-color:transparent}
/* hero */
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--accent-line);border-radius:18px;padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero .big{font-size:22px;font-weight:700;letter-spacing:-.2px}
.hero .mix{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mix span{font-size:13px;padding:3px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.mix b{color:var(--accent);margin-left:3px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--warn-soft);border:1px solid transparent;color:var(--warn);font-size:14px;margin-bottom:14px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner .sp{min-width:10px}
/* suggestion cards */
.sug{display:flex;flex-direction:column;gap:6px;padding:16px;text-align:left;transition:.15s}
.sug:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.sug .num{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sug .lab{font-weight:600}
.sug .d{font-size:12.5px;color:var(--muted)}
.sug.zero{opacity:.55}
/* progress */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar>i.bad{background:var(--bad)}.bar>i.warn{background:#d98a1f}
.bar.two>i.back{position:absolute;left:0;top:0;background:var(--accent-line)}
.ch{padding:16px;display:flex;flex-direction:column;gap:9px;text-align:left}
.ch:hover{border-color:var(--accent-line)}
.ch .h{display:flex;align-items:baseline;gap:8px}
.ch .h b{font-family:var(--mono);color:var(--accent);font-size:15px}
.ch .h span{font-weight:600}
.ch .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.act{display:flex;align-items:flex-end;gap:5px;height:84px}
.act div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.act i{display:block;width:100%;max-width:26px;background:var(--accent-line);border-radius:5px 5px 2px 2px;min-height:3px;position:relative}
.act i b{position:absolute;left:0;bottom:0;width:100%;background:var(--accent);border-radius:5px 5px 2px 2px}
.act small{font-size:10.5px;color:var(--muted)}
/* forms */
.field{margin-bottom:20px}
.field>label,.field>.lb{display:block;font-weight:600;margin-bottom:8px;font-size:14px}
.field .hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
select,.inp{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
select:focus,.inp:focus,textarea:focus{outline:2px solid var(--accent-line);border-color:var(--accent)}
details.tp>summary{cursor:pointer;color:var(--accent);font-size:13.5px;padding:4px 0}
details.tp .tg{margin:8px 0 4px}
details.tp .tg b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:14px}
.switch i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on i{background:var(--accent)}.switch.on i::after{left:19px}
.count{font-size:13.5px;color:var(--muted)}
.count b{color:var(--accent);font-size:17px}
/* runner */
.run-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.run-head .ttl{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-head .bar{flex:1;min-width:60px}
.timer{font-family:var(--mono);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{color:var(--bad);font-weight:700}
.qcard{padding:24px;position:relative}.qcard .qmeta{padding-right:42px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.qno{font-family:var(--mono);color:var(--muted);font-size:13px}
.star{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.star:hover{background:var(--surface2)}
.star svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.star.on{color:#e0a100}.star.on svg{fill:currentColor}
.qtext{font-size:17px;line-height:1.85;margin-bottom:18px;white-space:pre-wrap;word-break:break-word}
.qtext .pts{font-size:12.5px;color:var(--muted);margin-left:6px}
.blank{field-sizing:content;min-width:7em;display:inline-block;width:9.5em;max-width:100%;margin:0 4px;padding:2px 8px;border:none;border-bottom:2px solid var(--muted);background:var(--surface2);border-radius:6px 6px 0 0;font-family:var(--mono);font-size:15px;text-align:center;vertical-align:baseline}
.blank:focus{outline:none;border-bottom-color:var(--accent);background:var(--accent-soft)}
.blank.ok{border-bottom-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.blank.bad{border-bottom-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:.12s;width:100%;font-size:15.5px;line-height:1.55}
.opt:hover{border-color:var(--accent-line);background:var(--surface2)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted)}
.opt .t{flex:1;padding-top:1px;word-break:break-word}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.lock{pointer-events:none}
.jrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jbtn{padding:18px 10px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:.12s}
.jbtn:hover{border-color:var(--accent-line);background:var(--surface2)}
.jbtn b{font-size:26px;line-height:1}
.jbtn.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.jbtn.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.jbtn.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.jbtn.lock{pointer-events:none}
textarea.ans{width:100%;min-height:150px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);resize:vertical;line-height:1.6}
textarea.ans.code{font-family:var(--mono);font-size:13.5px;min-height:200px;tab-size:4}
.qact{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;border:1px solid var(--accent-line);background:var(--accent-soft)}
.fb.bad{border-color:var(--bad-line);background:var(--bad-soft)}
.fb.neu{border-color:var(--line);background:var(--surface2)}
.fb .v{font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fb.ok .v{color:var(--accent)}.fb.bad .v{color:var(--bad)}
.fb .ans{margin-top:6px}
.fb .ans code,.ans code{font-family:var(--mono);background:var(--surface);border:1px solid var(--line);padding:1px 7px;border-radius:6px;font-size:13.5px;color:var(--ink)}
.fb .exp{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink);opacity:.92}
.fb .exp b{color:var(--muted);font-weight:600;margin-right:4px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.6;margin-top:6px;tab-size:4;white-space:pre}
pre.txt{white-space:pre-wrap;word-break:break-word;font-family:var(--sans);font-size:14.5px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px}
.tk-c{color:var(--tk-c);font-style:italic}.tk-s{color:var(--tk-s)}.tk-k{color:var(--tk-k);font-weight:600}.tk-p{color:var(--tk-p)}.tk-n{color:var(--tk-n)}
.rate{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.rate .lb{font-size:13px;color:var(--muted);margin-right:4px}
.rate .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rate .btn.on.r0{background:var(--bad);border-color:var(--bad);color:#fff}
.run-foot{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
.navg{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:12px}
.navg button{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-family:var(--mono);color:var(--muted)}
.navg button.ans{background:var(--surface2);color:var(--ink);border-color:var(--muted)}
.navg button.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.navg button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.navg button.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
/* result */
.score{font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.score small{font-size:22px;font-weight:600;color:var(--muted);letter-spacing:0}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-weight:800;font-size:26px;line-height:1.1}
.ring small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.t th{font-size:12.5px;color:var(--muted);font-weight:600}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
/* list items */
.qi{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.qi+.qi{margin-top:10px}
.qi>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.qi>summary::-webkit-details-marker{display:none}
.qi>summary:hover{background:var(--surface2)}
.qi .st{flex:1;min-width:0}
.qi .st .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.qi[open] .st .tx{-webkit-line-clamp:unset;display:block}
.qi .st .tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.qi .bd{padding:2px 14px 14px;border-top:1px dashed var(--line)}
.qi .bd .opts-s{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:4px;font-size:14px}
.qi .bd .opts-s li.ok{color:var(--accent);font-weight:600}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:5px 14px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search{position:relative;flex:1;min-width:180px}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(10,15,12,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:18px;max-width:480px;width:100%;max-height:88vh;overflow:auto;padding:22px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
#printArea{display:none}
.hide{display:none!important}
@media (max-width:760px){
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .tabs{display:none}
  .bn{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:3px 0;position:relative}
  .bn button.on{color:var(--accent);font-weight:600}
  .bn .n{position:absolute;top:-2px;left:56%;font-size:10px;background:var(--bad);color:#fff;border-radius:99px;padding:0 5px;line-height:15px}
  h1{font-size:21px}
  .qcard{padding:18px 16px}.qtext{font-size:16px}
  .hero{padding:18px}.score{font-size:52px}
  .toast{bottom:90px}
  .brand .tx{display:none}
}
@media (max-width:480px){.g2{grid-template-columns:1fr}.g3,.g4{grid-template-columns:1fr 1fr}}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;background:#fff;padding:0;font-size:12pt}
  #printArea h1{font-size:18pt;margin-bottom:6pt}
  #printArea .pq{break-inside:avoid;border-bottom:1px solid #bbb;padding:8pt 0}
  #printArea .pq pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:10pt;background:#f3f3f3;color:#000;padding:6pt;border-radius:4pt}
  #printArea .pa{margin-top:4pt;color:#0a5a3f}
  #printArea .pe{margin-top:3pt;color:#444;font-size:10.5pt}
}

<script>
const QB = {"ch":{"1":"Linux系统概述与基本命令","2":"Linux系统使用（用户/vi/正则）","3":"Shell 与 Shell 编程","4":"Linux 文件系统","5":"Linux 进程管理","6":"进程间通信（信号/管道/IPC）","7":"线程编程（pthread）"},"q":[{"id":"68ccfd8","t":"f","ch":1,"tp":"发展历史与特点","q":"Linux内核最初由芬兰大学生______于1991年开发。","a":[["Linus Torvalds","Linus","林纳斯"]],"e":"1991年，Linus Torvalds 在赫尔辛基大学读书时发布了 Linux 内核第一个版本。"},{"id":"487724e5","t":"f","ch":1,"tp":"发展历史与特点","q":"UNIX 操作系统最早于1969年诞生在______实验室，主要设计者是 Ken Thompson 和 Dennis Ritchie。","a":[["贝尔","Bell","AT&T贝尔","贝尔实验室"]],"e":"UNIX 诞生于 AT&T 的贝尔实验室，1973年用 C 语言重写。"},{"id":"29d7f91a","t":"f","ch":1,"tp":"发展历史与特点","q":"GNU 计划由______于1983年发起，目标是创建自由的类 UNIX 系统。","a":[["Richard Stallman","Stallman","理查德·斯托曼","斯托曼"]],"e":"GNU 的意思是 \"GNU's Not Unix\"，由 Stallman 发起，后创办 FSF。"},{"id":"a150a8ba","t":"f","ch":1,"tp":"发展历史与特点","q":"Linux 内核标志（吉祥物）是一只______。","a":[["企鹅","Tux"]],"e":"吉祥物名为 Tux，是一只企鹅。"},{"id":"7df192f","t":"f","ch":1,"tp":"发展历史与特点","q":"Linux 遵循的、保证不同 UNIX 系统间应用程序可移植的接口标准是______。","a":[["POSIX"]],"e":"POSIX（可移植操作系统接口）是 IEEE 制定的标准，Linux 基本遵循该标准。"},{"id":"cc1a5e9","t":"f","ch":1,"tp":"内核版本与发行版","q":"使用______命令可以查看当前系统的内核版本。","a":[["uname -r","uname"]],"e":"uname -r 显示内核版本号，uname -a 显示全部系统信息。"},{"id":"cd1ddb9c","t":"f","ch":1,"tp":"内核版本与发行版","q":"Red Hat 系发行版使用的软件包格式是______，Debian 系使用的是 deb。","a":[["rpm","RPM"]],"e":"Red Hat、CentOS、Fedora 使用 RPM 包；Debian、Ubuntu 使用 DEB 包。"},{"id":"42f21b0b","t":"c","ch":1,"tp":"内核版本与发行版","q":"Linux 内核版本 2.6.32 中，其中的\"2\"表示（  ）。","a":0,"o":["主版本号","次版本号","修订号","发行日期"],"e":"版本号格式为 主版本号.次版本号.修订号，所以 2 是主版本号。"},{"id":"408645da","t":"c","ch":1,"tp":"内核版本与发行版","q":"下列不属于 Linux 发行版的是（  ）。","a":3,"o":["Ubuntu","CentOS","Debian","Solaris"],"e":"Solaris 是 Sun（Oracle）公司的 UNIX 系统，不是 Linux 发行版。"},{"id":"e48644a6","t":"c","ch":1,"tp":"内核版本与发行版","q":"下列软件包管理命令中，用于 Ubuntu/Debian 系统安装软件的是（  ）。","a":2,"o":["yum install","rpm -ivh","apt install","pacman -S"],"e":"apt（apt-get）是 Debian 系的包管理器；yum/dnf/rpm 用于 Red Hat 系。"},{"id":"1d73910c","t":"c","ch":1,"tp":"内核版本与发行版","q":"要查看当前系统运行的 Linux 内核版本号，应使用命令（  ）。","a":0,"o":["uname -r","who -r","ver","cat /bin/version"],"e":"uname -r 输出内核发行版本号。"},{"id":"76e7fbc4","t":"j","ch":1,"tp":"内核版本与发行版","q":"Linux 内核由 Linus Torvalds 开发，因此整个 Linux 发行版都是他一个人完成的。","a":false,"e":"Linux 发行版 = 内核 + GNU 工具 + 应用软件，由众多开发者和公司共同构成。"},{"id":"cc978025","t":"j","ch":1,"tp":"内核版本与发行版","q":"Linux 是 UNIX 的一个克隆（类 UNIX）系统，但不含 UNIX 源代码。","a":true,"e":"Linux 是独立重写的类 UNIX 系统，遵循 POSIX 标准，不包含 UNIX 源码。"},{"id":"fab309ed","t":"j","ch":1,"tp":"内核版本与发行版","q":"Linux 只能运行在 x86 架构的 PC 上。","a":false,"e":"Linux 可移植性强，支持 x86、ARM、MIPS、PowerPC、RISC-V 等多种架构。"},{"id":"27a56c5f","t":"j","ch":1,"tp":"内核版本与发行版","q":"Linux 属于单用户单任务操作系统。","a":false,"e":"Linux 是多用户多任务操作系统。"},{"id":"e796fcf9","t":"j","ch":1,"tp":"内核版本与发行版","q":"CentOS 与 Ubuntu 都使用 rpm 软件包格式。","a":false,"e":"Ubuntu 使用 deb 格式。"},{"id":"1cb1c6c3","t":"j","ch":1,"tp":"内核版本与发行版","q":"Linux 是 Windows 的一个版本。","a":false,"e":"两者是不同的操作系统。"},{"id":"79e50e79","t":"s","ch":1,"tp":"内核版本与发行版","q":"简述 Linux 操作系统的主要特点。（10分）","a":"1. 开源免费：源代码开放，遵循 GPL，可自由使用、修改、传播。\n2. 多用户、多任务：支持多个用户同时登录，多个任务并发执行（分时、抢占式）。\n3. 良好的可移植性：内核大部分用 C 语言编写，可运行于多种硬件平台。\n4. 丰富的网络功能：内置完整的 TCP/IP 协议栈，适合作服务器。\n5. 稳定可靠、安全性好：有完善的用户/权限管理机制，系统稳定。\n6. 遵循 POSIX 标准，与 UNIX 兼容良好；支持丰富的文件系统与设备。\n7. 良好的用户界面：既有命令行 Shell，也有图形界面（X Window/GNOME/KDE）。"},{"id":"1144f811","t":"s","ch":1,"tp":"内核版本与发行版","q":"简述 Linux 内核版本号的组成及含义，并说明什么是\"发行版\"。（10分）","a":"1. 内核版本号形如 主版本号.次版本号.修订号（如 2.6.32）：\n   - 主版本号：重大架构变化；\n   - 次版本号：功能性变化。2.6 之前奇数表示开发版、偶数表示稳定版；\n   - 修订号：Bug 修复、安全补丁等小改动。\n2. 发行版：由厂商/社区把 Linux 内核、GNU 工具、Shell、桌面环境、应用软件、安装程序和软件包管理器打包形成的完整操作系统，如 Red Hat/CentOS、Ubuntu、Debian、SUSE 等。"},{"id":"75f8013b","t":"f","ch":1,"tp":"目录结构（FHS）","q":"Linux 采用______结构的目录组织形式，唯一的起点是根目录。","a":[["树形","树状","树"]],"e":"整个文件系统是一棵以 / 为根的倒置的树。"},{"id":"441ca74c","t":"f","ch":1,"tp":"目录结构（FHS）","q":"存放系统配置文件的目录是______。","a":[["/etc"]],"e":"/etc 存放系统及服务的配置文件，如 /etc/passwd。"},{"id":"e82d8377","t":"f","ch":1,"tp":"目录结构（FHS）","q":"存放设备文件的目录是______。","a":[["/dev"]],"e":"Linux 把设备当作文件，放在 /dev 下。"},{"id":"b4ac720d","t":"f","ch":1,"tp":"目录结构（FHS）","q":"超级用户 root 的主目录是______。","a":[["/root"]],"e":"root 的主目录不在 /home 下，而是 /root。"},{"id":"e5cf1b8f","t":"f","ch":1,"tp":"目录结构（FHS）","q":"存放日志、邮件、缓存等经常变化的数据的目录是______（其下有 log 子目录）。","a":[["/var"]],"e":"/var 存放经常变化的数据，如 /var/log。"},{"id":"46cab3b9","t":"f","ch":1,"tp":"目录结构（FHS）","q":"存放引导加载程序与内核映像文件的目录是______。","a":[["/boot"]],"e":"/boot 下有 vmlinuz 内核和 grub 配置。"},{"id":"55091ae7","t":"c","ch":1,"tp":"目录结构（FHS）","q":"Linux 中 /bin 目录用于存放（  ）。","a":1,"o":["用户主目录","基本系统命令（可执行文件）","设备文件","配置文件"],"e":"/bin 存放所有用户都可用的基本命令，如 ls、cp、cat。"},{"id":"2bc79463","t":"c","ch":1,"tp":"目录结构（FHS）","q":"Linux 中 /sbin 目录主要存放（  ）。","a":0,"o":["系统管理员使用的系统管理命令","临时文件","用户数据","日志文件"],"e":"/sbin 存放 root 使用的系统管理命令，如 fdisk、ifconfig。"},{"id":"e4bde7fa","t":"c","ch":1,"tp":"目录结构（FHS）","q":"光盘、U盘等设备的临时挂载点通常是（  ）。","a":0,"o":["/mnt 或 /media","/dev","/proc","/boot"],"e":"/mnt、/media 是常用挂载点目录。"},{"id":"689991d0","t":"c","ch":1,"tp":"目录结构（FHS）","q":"下列关于 Linux 目录结构的叙述，正确的是（  ）。","a":1,"o":["每个磁盘分区有独立的盘符 C:、D:","所有分区都挂载到同一棵以 / 为根的目录树下","没有根目录","目录结构与 Windows 完全一致"],"e":"Linux 无盘符概念，分区通过 mount 挂载到目录树的某个目录上。"},{"id":"51f5f4d9","t":"c","ch":1,"tp":"目录结构（FHS）","q":"Linux 中 /lib 目录用于存放（  ）。","a":0,"o":["系统启动所需的共享库和内核模块","用户文档","日志","主目录"],"e":"/lib 存放系统程序所需的动态库（.so）和内核模块。"},{"id":"6e35d835","t":"j","ch":1,"tp":"目录结构（FHS）","q":"Linux 的目录结构与 Windows 一样，分为 C 盘、D 盘等多个盘符。","a":false,"e":"Linux 只有一个以 / 为根的目录树，没有盘符。"},{"id":"9b87d78a","t":"j","ch":1,"tp":"目录结构（FHS）","q":"/etc 目录中存放的是系统及软件的配置文件。","a":true,"e":"/etc 是配置文件目录。"},{"id":"793d926d","t":"j","ch":1,"tp":"目录结构（FHS）","q":"/proc 是存放在硬盘上的普通目录。","a":false,"e":"/proc 是内存中的虚拟（伪）文件系统。"},{"id":"8725147f","t":"j","ch":1,"tp":"目录结构（FHS）","q":"root 用户的主目录是 /home/root。","a":false,"e":"root 的主目录是 /root。"},{"id":"5a04dd45","t":"s","ch":1,"tp":"目录结构（FHS）","q":"简述 Linux 的目录结构，并说明 /bin、/etc、/dev、/home、/var、/tmp 目录的作用。（15分）","a":"1. Linux 采用树形目录结构，只有一个根目录 /，所有文件与目录（包括其他分区、设备）都挂在这棵树下；遵循 FHS（文件系统层次标准）。\n2. 常见目录作用：\n   - /bin：所有用户可用的基本命令（ls、cp、cat 等）；\n   - /etc：系统及应用程序的配置文件（passwd、fstab 等）；\n   - /dev：设备文件（硬盘 sda、终端 tty、/dev/null 等）；\n   - /home：普通用户的主目录；\n   - /var：经常变化的数据，如日志 /var/log、邮件、缓存、spool；\n   - /tmp：临时文件，所有用户可读写；\n   - 其他：/root（root 主目录）、/usr（用户程序与库）、/boot（内核与引导）、/proc（内核与进程信息）、/mnt、/media（挂载点）、/lib（库）、/sbin（管理命令）。"},{"id":"63650639","t":"f","ch":1,"tp":"路径与通配符","q":"表示当前目录的符号是______，表示上一级目录的符号是______。","a":[["."],[".."]],"e":". 当前目录，.. 上级目录。"},{"id":"90a26802","t":"f","ch":1,"tp":"路径与通配符","q":"从根目录开始的路径称为______路径。","a":[["绝对"]],"e":"以 / 开头的是绝对路径，否则为相对路径。"},{"id":"34b08111","t":"f","ch":1,"tp":"路径与通配符","q":"在 Linux 中，文件名以______开头的文件为隐藏文件。","a":[[".","点","英文句点"]],"e":"如 .bashrc；用 ls -a 才能显示。"},{"id":"a874c7ba","t":"c","ch":1,"tp":"路径与通配符","q":"通配符 ? 表示（  ）。","a":1,"o":["任意多个字符","任意单个字符","任意数字","任意字母"],"e":"? 匹配恰好一个任意字符。"},{"id":"1bbc9c3f","t":"c","ch":1,"tp":"路径与通配符","q":"命令 ls [a-c]*.txt 能匹配的文件是（  ）。","a":1,"o":["d1.txt","b2.txt","ab.doc","x.txt"],"e":"[a-c] 匹配 a、b、c 之一，后面 * 任意，且以 .txt 结尾。"},{"id":"373d285d","t":"c","ch":1,"tp":"路径与通配符","q":"假设当前目录为 /home/stu，则相对路径 ../../etc 指向（  ）。","a":1,"o":["/home/etc","/etc","/stu/etc","/home/stu/etc"],"e":"两次 .. 回到 /，再进入 etc，即 /etc。"},{"id":"81d8279f","t":"c","ch":1,"tp":"路径与通配符","q":"文件名区分大小写的操作系统是（  ）。","a":0,"o":["Linux","DOS","Windows 默认","都区分"],"e":"Linux 区分大小写，File 与 file 是不同文件。"},{"id":"75627862","t":"j","ch":1,"tp":"路径与通配符","q":"Linux 中文件名区分大小写，Test.txt 与 test.txt 是两个不同的文件。","a":true,"e":"Linux 文件名区分大小写。"},{"id":"a4221f01","t":"j","ch":1,"tp":"路径与通配符","q":"Linux 文件名的扩展名决定文件能否执行。","a":false,"e":"是否可执行由权限位决定，与扩展名无关。"},{"id":"d59dfc67","t":"j","ch":1,"tp":"路径与通配符","q":"通配符 * 可以匹配以点开头的隐藏文件。","a":false,"e":"默认情况下 * 不匹配以 . 开头的文件。"},{"id":"d0c53ba7","t":"j","ch":1,"tp":"路径与通配符","q":"以 / 开头的路径是绝对路径。","a":true,"e":"绝对路径从根目录开始。"},{"id":"7983ba52","t":"f","ch":1,"tp":"常用文件与目录命令","q":"显示当前工作目录的命令是______。","a":[["pwd"]],"e":"pwd = print working directory。"},{"id":"bcff0406","t":"f","ch":1,"tp":"常用文件与目录命令","q":"列出目录内容的命令是______，以长格式显示详细信息需加选项______。","a":[["ls"],["-l","ls -l"]],"e":"ls -l 长格式；ls -a 显示隐藏文件；ls -h 配合 -l 人性化显示大小。"},{"id":"a7883e54","t":"f","ch":1,"tp":"常用文件与目录命令","q":"创建目录的命令是______，递归创建多级目录需加选项______。","a":[["mkdir"],["-p","mkdir -p"]],"e":"mkdir -p a/b/c 可一次创建多级目录。"},{"id":"4c02133b","t":"f","ch":1,"tp":"常用文件与目录命令","q":"复制文件的命令是______，复制目录需加选项______。","a":[["cp"],["-r","-R","-a"]],"e":"cp -r 递归复制目录。"},{"id":"ed3d6daa","t":"f","ch":1,"tp":"常用文件与目录命令","q":"移动或重命名文件的命令是______。","a":[["mv"]],"e":"mv 既可移动也可重命名。"},{"id":"3249e32f","t":"f","ch":1,"tp":"常用文件与目录命令","q":"创建空文件或更新文件时间戳的命令是______。","a":[["touch"]],"e":"touch 文件不存在则创建空文件。"},{"id":"f48ad9d8","t":"c","ch":1,"tp":"常用文件与目录命令","q":"下列命令中，用于显示当前工作目录的是（  ）。","a":0,"o":["pwd","cd","ls","dir"],"e":"pwd 输出当前绝对路径。"},{"id":"9e0ad272","t":"c","ch":1,"tp":"常用文件与目录命令","q":"下列命令中，用于删除非空目录的是（  ）。","a":1,"o":["rmdir","rm -r","del","delete"],"e":"rm -r（或 -rf）递归删除目录及其内容；rmdir 只能删空目录。"},{"id":"9353736e","t":"c","ch":1,"tp":"常用文件与目录命令","q":"命令 mkdir -p a/b/c 的作用是（  ）。","a":1,"o":["只创建 a","一次创建多级目录 a/b/c（父目录不存在时自动创建）","显示错误","创建文件 c"],"e":"-p 表示 parents，自动创建所有缺失的上级目录。"},{"id":"ec18a366","t":"c","ch":1,"tp":"常用文件与目录命令","q":"要以长格式列出当前目录所有文件（含隐藏文件），应使用（  ）。","a":2,"o":["ls -l","ls -a","ls -la","ls -R"],"e":"-l 长格式，-a 含隐藏文件，合并为 -la。"},{"id":"96fb459f","t":"c","ch":1,"tp":"常用文件与目录命令","q":"命令 ls -d */ 的作用是（  ）。","a":0,"o":["列出当前目录下所有子目录名","递归列出","显示目录内容","删除目录"],"e":"-d 列目录本身而不是其内容，*/ 匹配所有目录。"},{"id":"a4841041","t":"c","ch":1,"tp":"常用文件与目录命令","q":"执行 ls -i 时，每个文件名前显示的数字表示（  ）。","a":1,"o":["文件大小","inode 号","权限","链接数"],"e":"ls -i 在文件名前显示 inode 号。"},{"id":"9d29eec9","t":"c","ch":1,"tp":"常用文件与目录命令","q":"关于 rm 命令，下列说法错误的是（  ）。","a":2,"o":["rm -i 删除前提示确认","rm -f 强制删除，不提示","rm 删除的文件一般放入回收站可恢复","rm -r 可删除目录"],"e":"Linux 的 rm 直接删除，没有回收站，一般难以恢复。"},{"id":"6bd07c9b","t":"c","ch":1,"tp":"常用文件与目录命令","q":"命令 cp -p a b 中 -p 的含义是（  ）。","a":1,"o":["递归","保留文件属性（权限、属主、时间）","强制","提示"],"e":"-p 保留源文件的模式、所有权和时间戳。"},{"id":"49ae4b81","t":"j","ch":1,"tp":"常用文件与目录命令","q":"rmdir 命令可以删除非空目录。","a":false,"e":"rmdir 只能删除空目录，非空需 rm -r。"},{"id":"8482ae1f","t":"j","ch":1,"tp":"常用文件与目录命令","q":"mv 命令既可移动文件也可给文件重命名。","a":true,"e":"同一目录下 mv 即为重命名。"},{"id":"acbcea48","t":"j","ch":1,"tp":"常用文件与目录命令","q":"cp 命令不加选项即可复制目录及其内容。","a":false,"e":"复制目录必须加 -r（或 -a）。"},{"id":"d18552f1","t":"j","ch":1,"tp":"常用文件与目录命令","q":"rm 命令删除的文件会进入回收站，可以随时恢复。","a":false,"e":"Linux 命令行 rm 没有回收站。"},{"id":"39425350","t":"j","ch":1,"tp":"常用文件与目录命令","q":"touch 命令只能用于创建新文件。","a":false,"e":"touch 也可更新已有文件的时间戳。"},{"id":"22caddf","t":"j","ch":1,"tp":"常用文件与目录命令","q":"ls -a 可以显示以点开头的隐藏文件。","a":true,"e":"-a 显示所有文件（包括 . 和 ..）。"},{"id":"74e651f5","t":"f","ch":1,"tp":"查看文件与文本命令","q":"将文件内容全部输出到屏幕的命令是______，分页查看可用 more 或______。","a":[["cat"],["less"]],"e":"less 可前后翻页，more 只能向前。"},{"id":"d87107e0","t":"f","ch":1,"tp":"查看文件与文本命令","q":"动态跟踪文件末尾新增内容（常用于看日志）使用命令 tail ______ 文件名。","a":[["-f","tail -f"]],"e":"tail -f /var/log/messages 实时追加显示。"},{"id":"91d6a52a","t":"f","ch":1,"tp":"查看文件与文本命令","q":"cat 命令加______选项可以显示行号。","a":[["-n"]],"e":"cat -n file 显示行号。"},{"id":"156a32e2","t":"c","ch":1,"tp":"查看文件与文本命令","q":"下列命令中，用于查看文件内容的是（  ）。","a":1,"o":["view","cat","show","display"],"e":"cat 连接并显示文件内容。"},{"id":"7a207cc3","t":"c","ch":1,"tp":"查看文件与文本命令","q":"下列命令中，可以分页显示文件内容并支持向上翻页的是（  ）。","a":1,"o":["cat","less","echo","tee"],"e":"less 可前后翻页；more 通常只向前。"},{"id":"190c86dc","t":"c","ch":1,"tp":"查看文件与文本命令","q":"要实时观察日志文件 /var/log/syslog 的新增内容，应使用（  ）。","a":1,"o":["cat -f","tail -f","head -f","less -n"],"e":"tail -f 持续输出追加内容。"},{"id":"d7500934","t":"c","ch":1,"tp":"查看文件与文本命令","q":"要统计文件 a.txt 的行数，应使用（  ）。","a":1,"o":["wc -w a.txt","wc -l a.txt","wc -c a.txt","ls -l a.txt"],"e":"-l 行数，-w 单词数，-c 字节数。"},{"id":"125a5691","t":"j","ch":1,"tp":"查看文件与文本命令","q":"tail -n 3 file 显示文件的最后3行。","a":true,"e":"tail 默认显示末尾，-n 指定行数。"},{"id":"425a91c4","t":"j","ch":1,"tp":"查看文件与文本命令","q":"more 命令可以方便地向后翻页，而 less 命令不能向后翻页。","a":false,"e":"less 既能向前也能向后翻页，功能比 more 强。"},{"id":"7d5dfa67","t":"j","ch":1,"tp":"查看文件与文本命令","q":"wc -c 统计文件的字节数。","a":true,"e":"-c 字节，-l 行，-w 单词。"},{"id":"9fcf9b99","t":"s","ch":1,"tp":"查看文件与文本命令","q":"简述 Linux 中绝对路径与相对路径的区别，并说明 . 、.. 、~ 、- 的含义。（8分）","a":"1. 绝对路径：从根目录 / 开始的完整路径，如 /home/stu/a.txt，与当前目录无关，唯一确定一个文件。\n2. 相对路径：从当前工作目录出发的路径，如 ../doc/a.txt，随当前目录改变而不同。\n3. 特殊符号：\n   - . ：当前目录；\n   - .. ：上一级（父）目录；\n   - ~ ：当前用户主目录；\n   - cd - 中的 - ：上一次所在的目录（$OLDPWD）。"},{"id":"74b2f4d7","t":"f","ch":1,"tp":"帮助、系统信息与关机","q":"查看命令的详细手册页使用______命令。","a":[["man"]],"e":"如 man ls；按 q 退出，/ 搜索。"},{"id":"df5715ef","t":"f","ch":1,"tp":"帮助、系统信息与关机","q":"显示当前登录用户名的命令是______。","a":[["whoami"]],"e":"whoami 显示有效用户名；who 显示所有登录用户。"},{"id":"5dcc97b","t":"f","ch":1,"tp":"帮助、系统信息与关机","q":"显示系统日期时间的命令是______。","a":[["date"]],"e":"date +\"%Y-%m-%d %H:%M:%S\" 可自定义格式。"},{"id":"79eb596e","t":"f","ch":1,"tp":"帮助、系统信息与关机","q":"查找命令所在路径的命令是______。","a":[["which","whereis"]],"e":"which 在 PATH 中查找可执行文件位置。"},{"id":"ce7df82c","t":"c","ch":1,"tp":"帮助、系统信息与关机","q":"查看 ls 命令的帮助手册应使用（  ）。","a":1,"o":["help ls","man ls","info ls 仅此一种","ls --man"],"e":"man 是标准手册页命令（info 与 --help 也能获取帮助，但最典型是 man）。"},{"id":"32442d5b","t":"c","ch":1,"tp":"帮助、系统信息与关机","q":"下列命令中，用于立即重启系统的是（  ）。","a":1,"o":["shutdown -h now","shutdown -r now","halt","init 0"],"e":"-r 重启，-h 关机/停机。init 6 也可重启。"},{"id":"bd812ff7","t":"c","ch":1,"tp":"帮助、系统信息与关机","q":"下列命令中，用于显示当前系统所有已登录用户的是（  ）。","a":0,"o":["who","whoami","id","su"],"e":"who 列出当前登录用户。"},{"id":"57d8c599","t":"c","ch":1,"tp":"帮助、系统信息与关机","q":"在 man 手册中，退出的按键是（  ）。","a":0,"o":["q","Esc","Ctrl+D","x"],"e":"man 使用 less 分页器，按 q 退出。"},{"id":"bb046b2b","t":"c","ch":1,"tp":"帮助、系统信息与关机","q":"在终端中，终止当前正在前台运行的命令使用快捷键（  ）。","a":0,"o":["Ctrl+C","Ctrl+D","Ctrl+Z","Ctrl+L"],"e":"Ctrl+C 发送 SIGINT；Ctrl+D 表示 EOF；Ctrl+Z 挂起；Ctrl+L 清屏。"},{"id":"55672a97","t":"c","ch":1,"tp":"帮助、系统信息与关机","q":"命令行中按 Tab 键的作用是（  ）。","a":1,"o":["清屏","命令/文件名自动补全","退出","终止命令"],"e":"Tab 补全提高输入效率。"},{"id":"34c23755","t":"j","ch":1,"tp":"帮助、系统信息与关机","q":"Ctrl+D 在终端输入的开头表示输入结束（EOF），可用来退出 shell。","a":true,"e":"Ctrl+D 发送 EOF，对 bash 即退出登录。"},{"id":"674ef321","t":"j","ch":1,"tp":"帮助、系统信息与关机","q":"shutdown -r now 用于立即关机。","a":false,"e":"-r 是重启（reboot），关机用 -h。"},{"id":"87ece6f4","t":"j","ch":1,"tp":"帮助、系统信息与关机","q":"clear 命令用于清除终端屏幕。","a":true,"e":"也可用 Ctrl+L。"},{"id":"13580433","t":"j","ch":1,"tp":"帮助、系统信息与关机","q":"history 命令可以查看已经执行过的命令列表。","a":true,"e":"!n 可重复执行第 n 条历史命令。"},{"id":"51d71034","t":"p","ch":1,"tp":"帮助、系统信息与关机","q":"写出完成以下操作的 Linux 命令：①显示当前工作目录；②切换到 /usr/local 目录；③在当前目录下创建名为 test 的子目录；④将文件 file1.txt 复制到 test 目录下并重命名为 file2.txt；⑤删除 test 目录及其中所有内容。","a":"① pwd\n② cd /usr/local\n③ mkdir test\n④ cp file1.txt test/file2.txt\n⑤ rm -rf test      （或 rm -r test）"},{"id":"638e2f22","t":"p","ch":1,"tp":"帮助、系统信息与关机","q":"写出命令：①在当前目录下一次性创建目录 project/src/code；②在 project 下创建空文件 readme.txt；③列出 project 目录下的所有文件（含隐藏文件）的详细信息；④把 project 目录整体复制为 project_bak；⑤删除 project_bak 及其内容。","a":"① mkdir -p project/src/code\n② touch project/readme.txt\n③ ls -la project\n④ cp -r project project_bak\n⑤ rm -r project_bak"},{"id":"a7a0b0a","t":"p","ch":1,"tp":"帮助、系统信息与关机","q":"写出命令：①查看 /etc/passwd 文件的前5行；②查看 /var/log/messages 的最后20行；③实时跟踪 /var/log/messages 新增内容；④统计 /etc/passwd 的行数。","a":"① head -n 5 /etc/passwd\n② tail -n 20 /var/log/messages\n③ tail -f /var/log/messages\n④ wc -l /etc/passwd"},{"id":"34d411d8","t":"p","ch":1,"tp":"帮助、系统信息与关机","q":"写出命令：①把 a.txt 重命名为 b.txt；②把 b.txt 移动到 /tmp 目录；③列出当前目录下所有以 .txt 结尾的文件；④列出当前目录下以 a 开头、长度恰好为3个字符的文件。","a":"① mv a.txt b.txt\n② mv b.txt /tmp\n③ ls *.txt\n④ ls a??"},{"id":"83796a44","t":"p","ch":1,"tp":"帮助、系统信息与关机","q":"写出命令：①显示当前日期和时间；②显示当前登录的用户名；③显示内核版本信息；④查看 ls 命令的手册页；⑤立即重启系统。","a":"① date\n② whoami\n③ uname -r   （uname -a 显示全部）\n④ man ls\n⑤ shutdown -r now    （或 reboot / init 6）"},{"id":"c76f040f","t":"p","ch":1,"tp":"帮助、系统信息与关机","q":"设当前目录为 /home/stu。请写出命令：①用绝对路径进入 /var/log；②用相对路径进入 /home/stu/doc；③从当前位置返回上一级目录；④快速回到自己的主目录；⑤回到上一次所在的目录。","a":"① cd /var/log\n② cd doc  （当前在 /home/stu 时；若不在则 cd ../stu/doc）\n③ cd ..\n④ cd  或  cd ~\n⑤ cd -"},{"id":"b9df428c","t":"p","ch":1,"tp":"帮助、系统信息与关机","q":"写出命令：①在 /tmp 下创建目录 t1；②在其中创建文件 a、b、c 三个空文件；③列出 t1 目录中的文件；④删除 t1 中的 a 文件；⑤删除整个 t1 目录。","a":"① mkdir /tmp/t1\n② touch /tmp/t1/a /tmp/t1/b /tmp/t1/c    （或 cd /tmp/t1 && touch a b c）\n③ ls /tmp/t1\n④ rm /tmp/t1/a\n⑤ rm -r /tmp/t1"},{"id":"625c7339","t":"p","ch":1,"tp":"帮助、系统信息与关机","q":"写出命令：把 /etc/passwd 中的内容显示出行号；把前10行写入文件 top10.txt（用重定向）；统计 top10.txt 的字节数。","a":"cat -n /etc/passwd\nhead -n 10 /etc/passwd > top10.txt\nwc -c top10.txt"},{"id":"561a2a30","t":"f","ch":2,"tp":"用户与组管理","q":"Linux 中保存用户账号信息的文件是______，保存加密口令的文件是______。","a":[["/etc/passwd"],["/etc/shadow"]],"e":"passwd 对所有人可读，shadow 只有 root 可读。"},{"id":"7e3eab67","t":"f","ch":2,"tp":"用户与组管理","q":"/etc/passwd 每行有______个以冒号分隔的字段。","a":[["7"]],"e":"用户名:口令:UID:GID:注释:主目录:登录Shell。"},{"id":"d4d1a3ce","t":"f","ch":2,"tp":"用户与组管理","q":"添加用户的命令是______，修改用户口令的命令是______。","a":[["useradd"],["passwd"]],"e":"useradd 创建账号，passwd 设置口令。"},{"id":"ca4ce652","t":"f","ch":2,"tp":"用户与组管理","q":"删除用户的同时删除其主目录，应使用命令 userdel ______ 用户名。","a":[["-r"]],"e":"userdel -r 同时删除主目录和邮件。"},{"id":"4aaa8996","t":"f","ch":2,"tp":"用户与组管理","q":"创建新用户组的命令是______。","a":[["groupadd"]],"e":"groupdel 删除组，groupmod 修改组。"},{"id":"802730fd","t":"f","ch":2,"tp":"用户与组管理","q":"显示当前用户的 UID、GID 及所属组信息的命令是______。","a":[["id"]],"e":"id 输出 uid=… gid=… groups=…。"},{"id":"c2c534fc","t":"c","ch":2,"tp":"用户与组管理","q":"/etc/passwd 文件中，每行的第三个字段表示（  ）。","a":2,"o":["用户名","口令","UID","GID"],"e":"顺序：用户名、口令占位符、UID、GID、注释、主目录、Shell。"},{"id":"49c5056d","t":"c","ch":2,"tp":"用户与组管理","q":"现代 Linux 系统中，用户加密口令存放在（  ）。","a":1,"o":["/etc/passwd","/etc/shadow","/etc/group","/etc/login"],"e":"passwd 中口令字段为 x，真实密文在 /etc/shadow。"},{"id":"4a15ba8c","t":"c","ch":2,"tp":"用户与组管理","q":"下列命令中，用于修改用户口令的是（  ）。","a":0,"o":["passwd","chpwd","modpass","password"],"e":"passwd 用户名。"},{"id":"5fea6a33","t":"c","ch":2,"tp":"用户与组管理","q":"命令 useradd -m -s /bin/bash -g staff zhang 中，-m 的含义是（  ）。","a":1,"o":["指定登录Shell","创建用户主目录","指定组","指定UID"],"e":"-m 创建主目录（-s 指定 Shell，-g 指定主组）。"},{"id":"4d14f280","t":"c","ch":2,"tp":"用户与组管理","q":"下列关于 su 与 su - 的区别，正确的是（  ）。","a":1,"o":["没有区别","su - 会切换到目标用户的主目录并加载其环境变量","su 才会加载环境","su - 只能切换到 root"],"e":"su - 是登录式切换，会初始化环境并切到目标用户主目录。"},{"id":"28f27729","t":"c","ch":2,"tp":"用户与组管理","q":"下列用户中，一般用于运行系统服务、不可登录的是（  ）。","a":2,"o":["root","普通用户 zhang","系统用户 nobody/daemon（shell 为 nologin）","所有用户"],"e":"系统用户的登录 Shell 常为 /sbin/nologin。"},{"id":"cfaa489f","t":"c","ch":2,"tp":"用户与组管理","q":"某用户登录 Shell 在 /etc/passwd 中被设为 /sbin/nologin，则该用户（  ）。","a":0,"o":["不能通过终端登录","可以登录","不能被删除","没有主目录"],"e":"nologin 禁止交互式登录。"},{"id":"5603a34d","t":"c","ch":2,"tp":"用户与组管理","q":"删除用户组的命令是（  ）。","a":0,"o":["groupdel","delgroup","rmgroup","userdel -g"],"e":"groupdel 组名；组内仍有用户的主组时不能删除。"},{"id":"6a9ca6c4","t":"j","ch":2,"tp":"用户与组管理","q":"/etc/passwd 中的口令字段保存的是用户的明文口令。","a":false,"e":"现代系统此处为 x，密文在 /etc/shadow，且不是明文。"},{"id":"d935cc0c","t":"j","ch":2,"tp":"用户与组管理","q":"root 用户的 UID 恒为 0。","a":true,"e":"UID 0 为超级用户。"},{"id":"774c2abe","t":"j","ch":2,"tp":"用户与组管理","q":"userdel 用户名 会默认同时删除该用户的主目录。","a":false,"e":"默认不删除主目录，需加 -r。"},{"id":"c87be31e","t":"j","ch":2,"tp":"用户与组管理","q":"普通用户可以直接使用 useradd 添加用户。","a":false,"e":"需要 root 权限（或 sudo）。"},{"id":"5b9ec910","t":"j","ch":2,"tp":"用户与组管理","q":"/etc/shadow 文件对所有用户可读。","a":false,"e":"仅 root 可读，保护口令密文。"},{"id":"fc5423e5","t":"s","ch":2,"tp":"用户与组管理","q":"简述 /etc/passwd 文件中一行记录的七个字段含义，并写出添加用户 zhang（主目录自动创建、Shell 为 bash）及设置口令的命令。（10分）","a":"1. 七个字段（以冒号分隔）：用户名 : 口令占位符(x) : UID : GID(主组) : 注释/全名 : 主目录 : 登录 Shell。\n2. 命令：\n   useradd -m -s /bin/bash zhang\n   passwd zhang"},{"id":"af8a2b3c","t":"s","ch":2,"tp":"用户与组管理","q":"简述 su 与 sudo 的区别。（6分）","a":"1. su：切换用户身份，需要知道目标用户（如 root）的口令；su - 同时加载目标用户的环境。\n2. sudo：以其他用户（通常 root）身份执行单条命令，输入的是自己的口令；权限由 /etc/sudoers 配置，可精细授权并有日志审计，更安全。"},{"id":"ad8595cf","t":"f","ch":2,"tp":"文件查找与压缩归档","q":"按文件名查找文件的命令是 find /etc ______ \"*.conf\"（填选项）。","a":[["-name"]],"e":"find 路径 -name 模式。"},{"id":"d1f03867","t":"f","ch":2,"tp":"文件查找与压缩归档","q":"find 对查找结果执行命令使用选项 -exec，命令以______结束。","a":[["\\;","\\\\;",";"]],"e":"如 find . -name \"*.o\" -exec rm {} \\;"},{"id":"f68bf593","t":"f","ch":2,"tp":"文件查找与压缩归档","q":"解压 a.tar.gz 到当前目录的命令是 tar ______ a.tar.gz。","a":[["-xzvf","xzvf","-xzf","xzf","-zxvf","zxvf"]],"e":"x 解包、z gzip。"},{"id":"412b9a8e","t":"f","ch":2,"tp":"文件查找与压缩归档","q":"tar 命令中，选项______用于列出归档内容而不解包。","a":[["-t","t"]],"e":"tar -tf a.tar。"},{"id":"6a4cfb56","t":"f","ch":2,"tp":"文件查找与压缩归档","q":"tar 命令中，选项______表示使用 bzip2 压缩。","a":[["-j","j"]],"e":"-z 对应 gzip，-j 对应 bzip2，-J 对应 xz。"},{"id":"d5d4f75a","t":"c","ch":2,"tp":"文件查找与压缩归档","q":"在 /home 下查找属主为 zhang 的文件，应使用（  ）。","a":0,"o":["find /home -user zhang","find /home -name zhang","find /home -owner zhang","grep zhang /home"],"e":"-user 按属主查找。"},{"id":"683a41df","t":"c","ch":2,"tp":"文件查找与压缩归档","q":"find / -size +10M 的含义是（  ）。","a":1,"o":["查找小于10M的文件","查找大于10M的文件","查找等于10M的文件","查找名为10M的文件"],"e":"+ 表示大于，- 表示小于。"},{"id":"51ff8d36","t":"c","ch":2,"tp":"文件查找与压缩归档","q":"下列命令中，将 a.tar.bz2 解压的是（  ）。","a":1,"o":["tar -xzf a.tar.bz2","tar -xjf a.tar.bz2","tar -cjf a.tar.bz2","gzip -d a.tar.bz2"],"e":"bz2 用 -j。"},{"id":"eaa4f049","t":"c","ch":2,"tp":"文件查找与压缩归档","q":"命令 find . -mtime -7 查找的是（  ）。","a":1,"o":["7天前修改的文件","最近7天内修改过的文件","大小为7的文件","权限为7的文件"],"e":"-mtime -n 表示 n 天以内，+n 表示 n 天以前。"},{"id":"ffc6c4e8","t":"c","ch":2,"tp":"文件查找与压缩归档","q":"locate 命令与 find 命令相比，最大的特点是（  ）。","a":1,"o":["能执行命令","基于预先建立的数据库，查找速度快","支持按权限查找","不能按文件名查找"],"e":"locate 使用 updatedb 建立的数据库，速度快，但可能不是实时的。"},{"id":"d45ea167","t":"j","ch":2,"tp":"文件查找与压缩归档","q":"tar 本身只是归档工具，压缩需要借助 gzip/bzip2 等（可用 -z/-j 调用）。","a":true,"e":"tar 打包，不压缩；加 -z/-j/-J 才压缩。"},{"id":"8428f354","t":"j","ch":2,"tp":"文件查找与压缩归档","q":"find 命令只能根据文件名查找文件。","a":false,"e":"还可按类型、大小、时间、属主、权限等查找。"},{"id":"a7730719","t":"j","ch":2,"tp":"文件查找与压缩归档","q":"gzip 命令可以直接把整个目录压缩成一个 .gz 文件。","a":false,"e":"gzip 只能压缩单个文件，目录需先用 tar 打包。"},{"id":"ed11a139","t":"j","ch":2,"tp":"文件查找与压缩归档","q":"find . -name \"*.txt\" 与 ls *.txt 的区别之一是 find 会递归搜索子目录。","a":true,"e":"find 默认递归，ls 只处理当前目录。"},{"id":"d78095f7","t":"p","ch":2,"tp":"文件查找与压缩归档","q":"写出命令：①在 /home 下查找文件名为 a.txt 的文件；②在当前目录查找大于 1M 的普通文件；③删除当前目录树下所有 .tmp 文件；④把当前目录下的 test 目录打包压缩为 test.tar.gz；⑤把它解压到 /tmp。","a":"① find /home -name a.txt\n② find . -type f -size +1M\n③ find . -name \"*.tmp\" -exec rm {} \\;      （或 find . -name \"*.tmp\" -delete）\n④ tar -czvf test.tar.gz test\n⑤ tar -xzvf test.tar.gz -C /tmp"},{"id":"8c4dc81","t":"f","ch":2,"tp":"文本处理工具","q":"在文件中搜索指定字符串的命令是______。","a":[["grep"]],"e":"Global Regular Expression Print。"},{"id":"f4d69b56","t":"f","ch":2,"tp":"文本处理工具","q":"对文本文件排序的命令是______，按数值排序加选项______。","a":[["sort"],["-n"]],"e":"sort -nr 数值逆序。"},{"id":"66973d89","t":"f","ch":2,"tp":"文本处理工具","q":"从文本中按分隔符截取字段的命令是 cut，指定分隔符选项为-d，指定字段选项为______。","a":[["-f"]],"e":"如 cut -d: -f1 /etc/passwd 取用户名。"},{"id":"7f0087f6","t":"f","ch":2,"tp":"文本处理工具","q":"比较两个文本文件差异的命令是______。","a":[["diff"]],"e":"diff a b；cmp 逐字节比较。"},{"id":"e71721d3","t":"f","ch":2,"tp":"文本处理工具","q":"流编辑器______常用 s/old/new/g 做替换。","a":[["sed"]],"e":"sed 's/a/b/g' file。"},{"id":"c426c4e9","t":"c","ch":2,"tp":"文本处理工具","q":"grep -v \"abc\" file 的作用是（  ）。","a":1,"o":["显示包含 abc 的行","显示不包含 abc 的行","显示行号","忽略大小写"],"e":"-v invert-match。"},{"id":"d503acf9","t":"c","ch":2,"tp":"文本处理工具","q":"命令 grep -c \"root\" /etc/passwd 输出的是（  ）。","a":1,"o":["匹配行的内容","匹配的行数","匹配的行号","匹配的文件名"],"e":"-c 只输出匹配行的计数。"},{"id":"a12edb4c","t":"c","ch":2,"tp":"文本处理工具","q":"要提取 /etc/passwd 中所有用户名，应使用（  ）。","a":0,"o":["cut -d: -f1 /etc/passwd","cut -f1 /etc/passwd","cut -d: -f7 /etc/passwd","cut -c1 /etc/passwd"],"e":"以冒号为分隔符取第1字段。"},{"id":"a1fd3071","t":"c","ch":2,"tp":"文本处理工具","q":"命令 sort -nr file 的作用是（  ）。","a":1,"o":["按字符升序","按数值降序","按数值升序","去重"],"e":"-n 数值，-r 逆序。"},{"id":"12894b3f","t":"c","ch":2,"tp":"文本处理工具","q":"命令 sed 's/cat/dog/g' f 的作用是（  ）。","a":0,"o":["把 f 中所有 cat 替换为 dog 并输出到屏幕（不改原文件）","直接修改 f","删除 cat","只替换每行第一个"],"e":"s 替换，g 全局；不加 -i 不改原文件。"},{"id":"9f945b3d","t":"c","ch":2,"tp":"文本处理工具","q":"awk '{print $1}' file 的作用是（  ）。","a":1,"o":["输出每行的最后一个字段","输出每行的第一个字段","输出行数","输出整个文件"],"e":"$1 是第一个字段，默认以空白分隔。"},{"id":"7fa64711","t":"c","ch":2,"tp":"文本处理工具","q":"命令 awk -F: '{print $1}' /etc/passwd 中，-F: 的含义是（  ）。","a":1,"o":["指定输出格式","指定字段分隔符为冒号","指定文件","强制执行"],"e":"-F 设置输入字段分隔符。"},{"id":"d460eee","t":"j","ch":2,"tp":"文本处理工具","q":"grep 命令在默认情况下区分大小写。","a":true,"e":"忽略大小写需加 -i。"},{"id":"17ffaa15","t":"j","ch":2,"tp":"文本处理工具","q":"uniq 命令可以去除文件中所有重复行（无论是否相邻）。","a":false,"e":"只去除相邻的重复行，通常先 sort。"},{"id":"f3799813","t":"j","ch":2,"tp":"文本处理工具","q":"cut -d: -f1,3 表示截取第1和第3个字段。","a":true,"e":"-f 可用逗号列出多个字段。"},{"id":"9cce4efb","t":"j","ch":2,"tp":"文本处理工具","q":"sed 不加 -i 选项时会直接修改原文件。","a":false,"e":"不加 -i 只输出到标准输出，原文件不变。"},{"id":"5a8e3e2a","t":"p","ch":2,"tp":"文本处理工具","q":"写出命令：①显示 /etc/passwd 中以 root 开头的行；②统计 /etc/passwd 中使用 /bin/bash 的用户数；③提取所有用户名并按字母顺序输出；④把 a.txt 中的 foo 全部替换为 bar 后另存为 b.txt。","a":"① grep '^root' /etc/passwd\n② grep -c '/bin/bash$' /etc/passwd\n③ cut -d: -f1 /etc/passwd | sort\n④ sed 's/foo/bar/g' a.txt > b.txt"},{"id":"dabf1b8d","t":"p","ch":2,"tp":"文本处理工具","q":"写出一条命令统计 words.txt 中每个单词（每行一个单词）出现的次数，并按次数从多到少排序。","a":"sort words.txt | uniq -c | sort -nr"},{"id":"2b43c126","t":"f","ch":2,"tp":"vi/vim 编辑器","q":"vi 编辑器有三种工作模式：命令模式、______模式和末行（底行）模式。","a":[["插入","编辑","输入"]],"e":"启动 vi 默认进入命令模式。"},{"id":"1b52b0ab","t":"f","ch":2,"tp":"vi/vim 编辑器","q":"从插入模式返回命令模式需按______键。","a":[["Esc","ESC"]],"e":"Esc 返回命令模式。"},{"id":"61fefc3f","t":"f","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 命令模式下，删除当前行的命令是______，复制当前行的命令是______，粘贴命令是______。","a":[["dd"],["yy"],["p"]],"e":"P 在光标前粘贴；p 在光标后/下一行粘贴。"},{"id":"f8296cdc","t":"f","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 命令模式下，撤销上一次操作的命令是______。","a":[["u"]],"e":"Ctrl+r 重做（redo）。"},{"id":"7f5956c3","t":"f","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 命令模式下，向下搜索字符串 abc 的命令是______。","a":[["/abc"]],"e":"?abc 向上搜索；n 下一个，N 上一个。"},{"id":"e5d7b35e","t":"f","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 命令模式下，光标移到文件第一行用______，移到最后一行用______。","a":[["gg"],["G"]],"e":"也可 :1 与 :$ ；0 行首，$ 行尾。"},{"id":"6cfe1180","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"vi 编辑器的三种工作模式是（  ）。","a":0,"o":["命令模式、插入模式、末行模式","编辑模式、查看模式、命令模式","普通模式、插入模式、保存模式","命令模式、编辑模式、保存模式"],"e":"vi 三种模式：命令（普通）、插入（编辑）、末行（底行/ex）模式。"},{"id":"a772aa42","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 的命令模式下，要进入末行模式应按（  ）键。","a":1,"o":["i",":","Esc","q"],"e":"命令模式输入 : 进入末行模式。"},{"id":"f1dccc60","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"vi 中，保存并退出的命令是（  ）。","a":2,"o":[":q",":w",":wq",":q!"],"e":":wq 保存并退出。"},{"id":"32a64d3f","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"vi 中，不保存强制退出的命令是（  ）。","a":3,"o":[":q",":w",":wq",":q!"],"e":":q! 放弃修改强制退出。"},{"id":"d398ecef","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"vi 命令模式下，3dd 的作用是（  ）。","a":1,"o":["删除3个字符","删除光标所在行起的3行","复制3行","光标下移3行"],"e":"数字前缀表示重复次数。"},{"id":"15098640","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"vi 命令模式下，yy 的作用是（  ）。","a":1,"o":["删除当前行","复制当前行","粘贴","撤销"],"e":"yank=复制。"},{"id":"5358c1f2","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"vi 命令模式下，x 的作用是（  ）。","a":0,"o":["删除光标处一个字符","删除一行","复制字符","保存"],"e":"x 删除当前字符，X 删除前一个字符。"},{"id":"d1a2f6f7","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"vi 命令 :%s/a/b/ 与 :%s/a/b/g 的区别是（  ）。","a":1,"o":["没区别","前者每行只替换第一个，后者替换每行所有匹配","前者替换整个文件，后者只替换一行","前者不替换"],"e":"g 标志表示全局替换（行内所有匹配）。"},{"id":"aa61037c","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"vi 命令模式下，要在光标所在行的下一行插入新行并进入插入模式，应按（  ）。","a":1,"o":["O","o","a","A"],"e":"小写 o 在下方新开一行，大写 O 在上方。"},{"id":"69bab741","t":"c","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 中，要将光标移到行尾，可使用（  ）。","a":1,"o":["0","$","^","G"],"e":"$ 行尾，0 行首，^ 第一个非空白字符。"},{"id":"b5af7179","t":"j","ch":2,"tp":"vi/vim 编辑器","q":"vi 启动后默认处于插入模式。","a":false,"e":"默认是命令模式。"},{"id":"11f7e0aa","t":"j","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 命令模式下按 i 进入插入模式。","a":true,"e":"i、a、o 等均可。"},{"id":"29ac6a33","t":"j","ch":2,"tp":"vi/vim 编辑器","q":":q! 命令用于保存并退出 vi。","a":false,"e":":q! 是不保存强制退出。"},{"id":"410e81ab","t":"j","ch":2,"tp":"vi/vim 编辑器","q":"vi 中 yy 删除一行，dd 复制一行。","a":false,"e":"yy 复制，dd 删除（剪切）。"},{"id":"64410ec0","t":"j","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 中，/pattern 向下搜索，?pattern 向上搜索。","a":true,"e":"n 同方向下一个，N 反方向。"},{"id":"a85ac90d","t":"j","ch":2,"tp":"vi/vim 编辑器","q":"在 vi 的插入模式下，可以直接输入 :wq 保存退出。","a":false,"e":"插入模式下输入的是文本，应先 Esc 回命令模式再输入 :wq。"},{"id":"3d63e8a2","t":"s","ch":2,"tp":"vi/vim 编辑器","q":"简述 vi 编辑器三种工作模式及其相互切换方法。（10分）","a":"1. 命令模式（普通模式）：启动默认模式，键盘输入被当作命令（移动光标、删除 dd、复制 yy、粘贴 p、撤销 u 等）。\n2. 插入模式：用于输入文本。由命令模式按 i、a、o、I、A、O 等进入。\n3. 末行模式：以 : 开头（也包括 / ? 搜索），用于保存退出、替换、设置等（:w、:q、:wq、:q!、:%s///、:set nu）。\n4. 切换：命令模式 -i/a/o→ 插入模式；插入模式 -Esc→ 命令模式；命令模式 -: / ? → 末行模式；末行模式执行命令后或按 Esc → 命令模式。（插入模式与末行模式之间需经命令模式中转）"},{"id":"cdd9c03a","t":"p","ch":2,"tp":"vi/vim 编辑器","q":"写出在 vi 中完成下列操作的命令：①在光标后插入文本；②删除当前行；③复制从当前行开始的3行；④粘贴；⑤撤销；⑥全文把 error 替换为 warn；⑦显示行号；⑧保存并退出；⑨不保存退出。","a":"① a（命令模式）\n② dd\n③ 3yy\n④ p\n⑤ u\n⑥ :%s/error/warn/g\n⑦ :set nu\n⑧ :wq\n⑨ :q!"},{"id":"8470eec6","t":"f","ch":2,"tp":"正则表达式","q":"正则表达式中，______匹配行首，______匹配行尾。","a":[["^"],["$"]],"e":"如 ^abc 以 abc 开头；abc$ 以 abc 结尾。"},{"id":"641ef570","t":"f","ch":2,"tp":"正则表达式","q":"正则表达式 [abc] 匹配 a、b、c 中的______个字符。","a":[["一","1","任意一"]],"e":"方括号表示字符集合，匹配其中任意一个字符。"},{"id":"5326bf29","t":"f","ch":2,"tp":"正则表达式","q":"正则表达式 a\\{2,4\\} 表示字符 a 重复______次（范围）。","a":[["2到4","2-4","2~4","2至4"]],"e":"基本正则中 \\{n,m\\} 表示重复 n 到 m 次。"},{"id":"62e57a82","t":"f","ch":2,"tp":"正则表达式","q":"扩展正则表达式中，______表示前一个字符出现一次或多次，______表示零次或一次。","a":[["+"],["?"]],"e":"ERE 中的 + ? | () {} 无需转义；grep -E 或 egrep 使用。"},{"id":"5fb7f122","t":"f","ch":2,"tp":"正则表达式","q":"POSIX 字符类 [[:digit:]] 匹配______。","a":[["数字","一个数字"]],"e":"[:alpha:] 字母，[:upper:] 大写，[:space:] 空白。"},{"id":"a9f365d4","t":"c","ch":2,"tp":"正则表达式","q":"正则表达式 ^abc 匹配（  ）。","a":2,"o":["以 abc 结尾的行","包含 abc 的行","以 abc 开头的行","只有 abc 的行"],"e":"^ 行首锚点。"},{"id":"a3b7835c","t":"c","ch":2,"tp":"正则表达式","q":"正则表达式 ^$ 匹配（  ）。","a":1,"o":["所有行","空行","以 $ 开头的行","含 ^ 的行"],"e":"行首紧接行尾，即空行。"},{"id":"e99cfa67","t":"c","ch":2,"tp":"正则表达式","q":"正则表达式 ab*c 不能匹配的字符串是（  ）。","a":3,"o":["ac","abc","abbbc","adc"],"e":"b* 表示 b 重复零次或多次。"},{"id":"e3ce6d04","t":"c","ch":2,"tp":"正则表达式","q":"正则表达式 ^[A-Z][a-z]*$ 匹配（  ）。","a":0,"o":["首字母大写、后面全为小写字母的单词（整行）","全部数字","以数字开头的行","任意行"],"e":"整行：一个大写字母后面接零个或多个小写字母。"},{"id":"292895f9","t":"c","ch":2,"tp":"正则表达式","q":"grep 'a\\{3\\}' file 输出的是（  ）。","a":0,"o":["含有连续3个 a 的行","含任意3个字符的行","含3个不连续 a 的行","以3个字符开头的行"],"e":"\\{3\\} 表示前一个字符重复 3 次。"},{"id":"a39f0b2c","t":"c","ch":2,"tp":"正则表达式","q":"在基本正则表达式（BRE）中，+ 和 ? 默认是（  ）。","a":1,"o":["特殊元字符","普通字符（需转义或用 -E 才有特殊含义）","错误语法","通配符"],"e":"GNU grep 中 BRE 用 \\+ \\?，或使用 grep -E。"},{"id":"14e71e25","t":"c","ch":2,"tp":"正则表达式","q":"通配符（文件名匹配）与正则表达式中，\"任意多个字符\"分别表示为（  ）。","a":0,"o":["通配符 *，正则 .*","通配符 .*，正则 *","都是 *","都是 .*"],"e":"通配符 * 本身就是任意串；正则中 * 是量词，需要 .* 表示任意串。"},{"id":"e8060296","t":"c","ch":2,"tp":"正则表达式","q":"正则表达式 [0-9]\\{3\\}-[0-9]\\{4\\} 匹配的是（  ）。","a":0,"o":["3位数字+短横线+4位数字","任意数字","3到4位数字","电话区号"],"e":"如 010-1234。"},{"id":"12de7414","t":"c","ch":2,"tp":"正则表达式","q":"正则中转义字符 \\ 的作用是（  ）。","a":0,"o":["使后面的元字符失去特殊含义","表示行首","表示或","表示重复"],"e":"如 \\. 匹配真正的点号。"},{"id":"436030e","t":"j","ch":2,"tp":"正则表达式","q":"正则表达式 ^ 表示行尾，$ 表示行首。","a":false,"e":"^ 行首，$ 行尾。"},{"id":"6c7ae968","t":"j","ch":2,"tp":"正则表达式","q":"正则表达式中的 . 匹配任意单个字符。","a":true,"e":"不含换行符。"},{"id":"e0ecaaca","t":"j","ch":2,"tp":"正则表达式","q":"正则表达式 [^abc] 匹配除 a、b、c 以外的任意单个字符。","a":true,"e":"[] 内开头的 ^ 表示取反。"},{"id":"86784cd5","t":"j","ch":2,"tp":"正则表达式","q":"正则表达式 a* 能匹配空字符串。","a":true,"e":"* 表示零次或多次。"},{"id":"51ea4588","t":"j","ch":2,"tp":"正则表达式","q":"通配符 * 与正则表达式中的 * 含义完全相同。","a":false,"e":"通配符 * 匹配任意串；正则 * 是对前一字符的重复。"},{"id":"527b7e0e","t":"j","ch":2,"tp":"正则表达式","q":"grep '^#' file 可用于找出以 # 开头的注释行。","a":true,"e":"^# 表示行首为 #。"},{"id":"bc0b459d","t":"s","ch":2,"tp":"正则表达式","q":"简述正则表达式中 ^、$、.、*、[ ] 的作用，并各举一例。（15分）","a":"1. ^ ：匹配行首。如 ^root 匹配以 root 开头的行。\n2. $ ：匹配行尾。如 bash$ 匹配以 bash 结尾的行。\n3. . ：匹配任意单个字符。如 a.c 匹配 abc、a1c 等。\n4. * ：匹配前面的字符 0 次或多次。如 ab*c 匹配 ac、abc、abbc；.* 表示任意长度任意字符。\n5. [ ] ：匹配方括号内的任意一个字符；[a-z] 表示范围，[^0-9] 表示取反。如 [Tt]est 匹配 Test 和 test。\n补充：\\{n,m\\} 重复次数，\\ 转义，扩展正则中的 + ? | ()。"},{"id":"2171ffbd","t":"p","ch":2,"tp":"正则表达式","q":"写出完成下列功能的命令或正则表达式：①匹配以 hello 开头的行；②匹配以 world 结尾的行；③匹配包含 test 的行；④在 file.txt 中查找包含 error 的行（忽略大小写，并显示行号）；⑤找出文件中的空行及其行号。","a":"① ^hello       （grep '^hello' file）\n② world$       （grep 'world$' file）\n③ test         （grep 'test' file）\n④ grep -in 'error' file.txt\n⑤ grep -n '^$' file"},{"id":"e52674e","t":"p","ch":2,"tp":"正则表达式","q":"写出匹配下列内容的正则表达式（BRE/ERE 均可，说明所用形式）：①三位数字；②以大写字母开头、后跟若干小写字母的单词；③以 192.168 开头的 IP 地址行；④只包含数字的整行。","a":"① [0-9]\\{3\\}     （ERE: [0-9]{3}）\n② ^[A-Z][a-z]*\n③ ^192\\.168\\.     （注意 . 要转义）\n④ ^[0-9]*$      （至少一位用 ^[0-9]\\+$）"},{"id":"7e7d786f","t":"p","ch":2,"tp":"正则表达式","q":"使用 grep 完成：①显示 /etc/passwd 中不含 nologin 的行；②在当前目录下递归查找包含 main 的所有 .c 文件；③统计 log.txt 中出现 ERROR 的行数；④显示以 # 开头的注释行之外的所有行。","a":"① grep -v 'nologin' /etc/passwd\n② grep -rn 'main' --include='*.c' .\n③ grep -c 'ERROR' log.txt\n④ grep -v '^#' file"},{"id":"80cc6377","t":"f","ch":3,"tp":"Shell 基础与脚本执行","q":"Shell 是用户与______之间的接口，既是命令解释器，也是一种编程语言。","a":[["内核","操作系统","kernel"]],"e":"用户通过 Shell 把命令传给内核执行。"},{"id":"e987b44d","t":"f","ch":3,"tp":"Shell 基础与脚本执行","q":"查看系统中可用的 Shell 列表，可查看文件______。","a":[["/etc/shells"]],"e":"用户登录 Shell 记录在 /etc/passwd 最后一个字段。"},{"id":"a61cc400","t":"f","ch":3,"tp":"Shell 基础与脚本执行","q":"Shell 脚本中以______符号开头的行为注释（第一行 #! 除外）。","a":[["#"]],"e":"# 之后到行末为注释。"},{"id":"b5255147","t":"f","ch":3,"tp":"Shell 基础与脚本执行","q":"运行 Shell 脚本 a.sh 的方法有：bash a.sh、______ a.sh（需先 chmod +x）、source a.sh。","a":[["./"]],"e":"赋予执行权限后用 ./a.sh 执行。"},{"id":"6206a97","t":"f","ch":3,"tp":"Shell 基础与脚本执行","q":"source 命令的等价简写是______。","a":[[".","点","英文句点"]],"e":". a.sh 与 source a.sh 相同，在当前 Shell 进程中执行，变量对当前 Shell 生效。"},{"id":"369825fd","t":"c","ch":3,"tp":"Shell 基础与脚本执行","q":"Shell 脚本第一行 #!/bin/bash 的作用是（  ）。","a":1,"o":["注释","指定该脚本使用 /bin/bash 解释执行","输出文本","定义变量"],"e":"#! 后是解释器路径。"},{"id":"9aba1cfc","t":"c","ch":3,"tp":"Shell 基础与脚本执行","q":"下列关于运行脚本的叙述，错误的是（  ）。","a":2,"o":["bash a.sh 不需要 a.sh 有执行权限","./a.sh 需要 a.sh 有执行权限","source a.sh 在子 Shell 中运行",". a.sh 与 source a.sh 等价"],"e":"source 在当前 Shell 中运行，不创建子进程。"},{"id":"847ec96f","t":"c","ch":3,"tp":"Shell 基础与脚本执行","q":"Shell 的作用不包括（  ）。","a":2,"o":["解释并执行用户命令","提供脚本编程环境","管理硬盘分区物理扇区","管理环境变量与重定向、管道"],"e":"磁盘物理管理属于内核/驱动，不是 Shell。"},{"id":"7942f2ad","t":"c","ch":3,"tp":"Shell 基础与脚本执行","q":"下列属于 Linux 下常见 Shell 的是（  ）。","a":0,"o":["bash","cmd","powershell.exe","explorer"],"e":"bash、sh、zsh、csh、ksh 等。"},{"id":"22cf9e65","t":"j","ch":3,"tp":"Shell 基础与脚本执行","q":"Shell 既是命令解释器又是一种脚本编程语言。","a":true,"e":"Shell 脚本是解释执行的。"},{"id":"d04e4999","t":"j","ch":3,"tp":"Shell 基础与脚本执行","q":"Shell 脚本文件必须以 .sh 为扩展名才能执行。","a":false,"e":"扩展名不是必须，由权限和解释器决定。"},{"id":"9a01b4fb","t":"j","ch":3,"tp":"Shell 基础与脚本执行","q":"脚本没有执行权限时，也可以用 bash a.sh 运行。","a":true,"e":"bash 读取文件内容解释，只需读权限。"},{"id":"b2cf5868","t":"j","ch":3,"tp":"Shell 基础与脚本执行","q":"bash 是 Linux 唯一的 Shell。","a":false,"e":"还有 sh、csh、tcsh、ksh、zsh 等。"},{"id":"60fd169d","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"Shell 变量赋值时，等号两边______空格（可以有/不能有）。","a":[["不能有","不能","不可有"]],"e":"正确：name=Tom；错误：name = Tom。"},{"id":"6deb412a","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"将局部变量导出为环境变量使用命令______。","a":[["export"]],"e":"export VAR=value。"},{"id":"e4f0ce70","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"删除变量使用命令______，设置只读变量使用命令______。","a":[["unset"],["readonly"]],"e":"readonly 变量不能被修改或删除。"},{"id":"134cc30c","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"环境变量______指定系统搜索可执行命令的目录列表，目录之间用冒号分隔。","a":[["PATH"]],"e":"echo $PATH 查看。"},{"id":"90def67e","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"脚本中，$0 表示______，$1 表示______，$# 表示______。","a":[["脚本名","脚本文件名","当前脚本名"],["第一个参数","第一个位置参数","第1个参数"],["参数个数","命令行参数个数","位置参数的个数"]],"e":"位置参数 $1 ~ $9，超过9个需 ${10}。"},{"id":"3d6212f2","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"$? 表示______，$$ 表示______。","a":[["上一条命令的退出状态","上一条命令的返回值","退出状态","返回值"],["当前进程ID","当前Shell的进程号","当前进程号","PID","进程号"]],"e":"$? 为 0 表示成功。"},{"id":"82d0e5cd","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"单引号的作用是______（所有字符均按字面处理），双引号中______、反引号等仍会被解释。","a":[["强引用","原样输出","完全转义","字面量","不进行任何替换"],["$","变量","变量替换","$变量"]],"e":"单引号内不做任何替换；双引号内 $、`、\\ 仍有特殊含义。"},{"id":"56940363","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"命令替换有两种写法：反引号 `cmd` 和______。","a":[["$(cmd)","$()"]],"e":"$(cmd) 可嵌套，推荐使用。"},{"id":"856b218d","t":"f","ch":3,"tp":"变量、引号与特殊变量","q":"显示一个变量值或文本的命令是______；加 -n 选项表示______。","a":[["echo"],["不换行","不输出换行符","不输出换行"]],"e":"echo -e 解释转义字符如 \\n。"},{"id":"a63e74bb","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"下列变量赋值语句，正确的是（  ）。","a":1,"o":["a = 10","a=10","$a=10","let a = 10"],"e":"等号两侧不能有空格；赋值时变量名前不加 $。"},{"id":"793cd363","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"设 name=Tom，则 echo \"Hi $name\" 与 echo 'Hi $name' 的输出分别是（  ）。","a":1,"o":["Hi Tom 和 Hi Tom","Hi Tom 和 Hi $name","Hi $name 和 Hi Tom","Hi $name 和 Hi $name"],"e":"双引号替换变量，单引号原样输出。"},{"id":"d3cd98e3","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"命令 echo `date` 与 echo $(date) 的效果（  ）。","a":1,"o":["不同","相同，都是命令替换","前者输出 date 文本","后者输出 date 文本"],"e":"两种都是命令替换。"},{"id":"33b0d535","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"脚本 ./a.sh x y z 中，$2 的值是（  ）。","a":1,"o":["x","y","z","./a.sh"],"e":"$1=x，$2=y，$3=z。"},{"id":"b9e2cc57","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"上一条命令成功执行时，$? 的值是（  ）。","a":0,"o":["0","1","-1","255"],"e":"0 表示成功，非 0 表示失败。"},{"id":"4638d2a2","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"下列特殊变量中，表示当前 Shell 进程 ID 的是（  ）。","a":1,"o":["$#","$$","$?","$!"],"e":"$! 表示最近一个后台进程的 PID。"},{"id":"ba86a012","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"设 a=5，则执行 echo ${a}th 的输出是（  ）。","a":0,"o":["5th","${a}th","ath","报错"],"e":"花括号限定变量名范围。"},{"id":"a2c24921","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"变量定义后，要使子进程（如执行的子脚本）也能使用，需要（  ）。","a":1,"o":["readonly","export","unset","local"],"e":"export 把变量变为环境变量，子进程继承。"},{"id":"d4ead527","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"下列关于 echo 命令的叙述，正确的是（  ）。","a":0,"o":["echo -n 不输出末尾换行符","echo -e 表示禁止解释转义字符","echo 只能输出字符串常量","echo 不能输出变量的值"],"e":"echo -n 不换行；-e 才是解释 \\n、\\t 等转义字符；echo 可以输出变量。"},{"id":"440779ec","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"关于环境变量 PATH，下列说法正确的是（  ）。","a":0,"o":["其值是以冒号分隔的目录列表","其值是以逗号分隔的","只能被 root 修改","不能被修改"],"e":"PATH=$PATH:/new/dir 可追加目录。"},{"id":"78100e63","t":"c","ch":3,"tp":"变量、引号与特殊变量","q":"在 bash 中，命令 a=$(( 3 + 4 * 2 )); echo $a 的输出是（  ）。","a":1,"o":["14","11","10","7"],"e":"先乘后加 3+8=11。"},{"id":"12f798f5","t":"j","ch":3,"tp":"变量、引号与特殊变量","q":"Shell 中变量必须先声明类型（如 int、char）才能使用。","a":false,"e":"Shell 变量无需声明类型，默认都是字符串。"},{"id":"3f0c7e48","t":"j","ch":3,"tp":"变量、引号与特殊变量","q":"Shell 变量赋值时等号两边不能有空格。","a":true,"e":"a=1 正确，a = 1 会被当作命令 a。"},{"id":"edcc86d6","t":"j","ch":3,"tp":"变量、引号与特殊变量","q":"单引号中的 $name 会被替换为变量的值。","a":false,"e":"单引号内原样输出。"},{"id":"f9e9eeea","t":"j","ch":3,"tp":"变量、引号与特殊变量","q":"环境变量只对当前 Shell 有效，对子进程不可见。","a":false,"e":"环境变量（export）会被子进程继承；仅局部变量不被继承。"},{"id":"e566d2e7","t":"j","ch":3,"tp":"变量、引号与特殊变量","q":"$0 表示脚本的第一个参数。","a":false,"e":"$0 是脚本名，$1 才是第一个参数。"},{"id":"6e75f0f4","t":"j","ch":3,"tp":"变量、引号与特殊变量","q":"\"$@\" 与 \"$*\" 在任何情况下的结果完全相同。","a":false,"e":"双引号中 \"$@\" 保持各参数独立，\"$*\" 合并为一个字符串。"},{"id":"f15403b5","t":"j","ch":3,"tp":"变量、引号与特殊变量","q":"反引号和 $( ) 都可以实现命令替换。","a":true,"e":"推荐 $( )，因为可嵌套且更清晰。"},{"id":"2ce01a65","t":"s","ch":3,"tp":"变量、引号与特殊变量","q":"简述 Shell 脚本中 $0、$1、$#、$?、$$、$@ 的含义。（10分）","a":"1. $0：当前脚本（命令）的名称；\n2. $1…$9：第1…第9个位置参数（第10个起用 ${10}）；\n3. $#：位置参数的个数；\n4. $?：上一条命令的退出状态（0 表示成功，非 0 失败）；\n5. $$：当前 Shell（脚本进程）的进程号 PID；\n6. $@：所有位置参数，加引号 \"$@\" 时每个参数独立；$* 也表示所有参数，但 \"$*\" 合并为一个字符串。"},{"id":"aed9bfec","t":"s","ch":3,"tp":"变量、引号与特殊变量","q":"简述单引号、双引号、反引号在 Shell 中的区别，并各举一例。（10分）","a":"1. 单引号 ' ' ：强引用，其中所有字符（包括 $、`、\\）均按字面处理，不做变量替换。例：echo '$HOME' 输出 $HOME。\n2. 双引号 \" \" ：弱引用，保留空格等，但 $变量、`命令`、$(命令)、\\ 仍被解释。例：echo \"$HOME\" 输出 /home/xxx。\n3. 反引号 ` `（或 $( )）：命令替换，把其中命令的标准输出结果替换到命令行。例：echo \"今天是 `date`\"。"},{"id":"93fffa39","t":"s","ch":3,"tp":"变量、引号与特殊变量","q":"简述 export、readonly、unset 的作用，并说明局部变量与环境变量的区别。（8分）","a":"1. export：把变量导出为环境变量，使其对之后启动的子进程可见；\n2. readonly：将变量设为只读，不能再修改或 unset；\n3. unset：删除变量。\n4. 局部变量：只在当前 Shell 中有效，子进程不可见；环境变量：经 export 后被当前 Shell 及其子进程继承，如 PATH、HOME。"},{"id":"3593a7c0","t":"f","ch":3,"tp":"算术运算与条件测试","q":"Shell 中进行整数算术运算的表达式写法之一是______，例如 $((3+4))。","a":[["$(( ))","$((  ))","$((表达式))"]],"e":"也可用 expr、let、(( ))。"},{"id":"ef48d55c","t":"f","ch":3,"tp":"算术运算与条件测试","q":"test 命令有两种形式：test 表达式 与______。","a":[["[ 表达式 ]","[ ]","[]"]],"e":"[ 与 ] 内侧必须有空格。"},{"id":"718bcc32","t":"f","ch":3,"tp":"算术运算与条件测试","q":"字符串比较：判断字符串为空用______，判断字符串非空用______。","a":[["-z"],["-n"]],"e":"-z string 长度为0；-n string 长度非0。"},{"id":"5aa54055","t":"f","ch":3,"tp":"算术运算与条件测试","q":"文件测试：判断是否为普通文件用______，是否为目录用______。","a":[["-f"],["-d"]],"e":"-e 存在，-s 大小非0，-L 符号链接。"},{"id":"1235032f","t":"f","ch":3,"tp":"算术运算与条件测试","q":"test 中逻辑与、逻辑或、逻辑非的运算符分别是______、______、______。","a":[["-a"],["-o"],["!"]],"e":"[[ ]] 或多个 [ ] 中可用 && 与 ||。"},{"id":"7fa9ac97","t":"c","ch":3,"tp":"算术运算与条件测试","q":"[ $a -eq $b ] 用于判断（  ）。","a":1,"o":["两字符串相等","两整数相等","两文件相同","a 是否为空"],"e":"-eq 整数相等；字符串相等用 =。"},{"id":"7406c276","t":"c","ch":3,"tp":"算术运算与条件测试","q":"下列关于 test 与 [ ] 的叙述，正确的是（  ）。","a":0,"o":["两者功能相同，[ ] 中括号两侧必须有空格","两者功能完全不同","[ ] 比 test 功能更多","test 只能测试文件"],"e":"[ 实际是 test 命令的别名。"},{"id":"f638ec04","t":"c","ch":3,"tp":"算术运算与条件测试","q":"判断字符串变量 s 是否为空串的正确写法是（  ）。","a":0,"o":["[ -z \"$s\" ]","[ -n \"$s\" ]","[ s = \"\" ]","[ $s -eq 0 ]"],"e":"-z 为空；建议给变量加双引号。"},{"id":"52e95a41","t":"c","ch":3,"tp":"算术运算与条件测试","q":"判断文件 f 是否存在且是目录的测试是（  ）。","a":1,"o":["[ -f f ]","[ -d f ]","[ -e f ]（仅存在）","[ -r f ]"],"e":"-d 目录；-f 普通文件。"},{"id":"69ce0e82","t":"c","ch":3,"tp":"算术运算与条件测试","q":"命令 [ -f a.txt -a -r a.txt ] 的含义是（  ）。","a":1,"o":["a.txt 是普通文件或可读","a.txt 是普通文件且可读","a.txt 是目录且可读","a.txt 不存在"],"e":"-a 逻辑与。"},{"id":"eefc91ea","t":"c","ch":3,"tp":"算术运算与条件测试","q":"表达式 $(( 7 / 2 )) 的值是（  ）。","a":1,"o":["3.5","3","4","2"],"e":"Shell 整数除法，舍去小数。"},{"id":"48017f5f","t":"c","ch":3,"tp":"算术运算与条件测试","q":"表达式 $(( 7 % 3 )) 的值是（  ）。","a":1,"o":["0","1","2","3"],"e":"% 取余数。"},{"id":"230d33fa","t":"c","ch":3,"tp":"算术运算与条件测试","q":"设 x=3，则 expr $x + 2 输出（  ）。","a":0,"o":["5","3+2","x+2","报错"],"e":"expr 要求运算符两侧有空格，输出 5。"},{"id":"8ffe1739","t":"c","ch":3,"tp":"算术运算与条件测试","q":"下列命令中，可以进行整数运算并赋值的是（  ）。","a":0,"o":["let c=a+b","c = a + b","c=a+b（得到字符串\"a+b\"）","set c = a + b"],"e":"let c=a+b 或 c=$((a+b))。"},{"id":"b5db9078","t":"j","ch":3,"tp":"算术运算与条件测试","q":"test -f file 判断 file 是否为目录。","a":false,"e":"-f 判断普通文件，-d 判断目录。"},{"id":"9b9fefb5","t":"j","ch":3,"tp":"算术运算与条件测试","q":"[ \"$a\" = \"$b\" ] 中等号两边必须有空格。","a":true,"e":"否则会被当作一个字符串。"},{"id":"b28fe581","t":"j","ch":3,"tp":"算术运算与条件测试","q":"expr 3 * 4 可以得到 12。","a":false,"e":"* 会被 Shell 展开为通配符，需写成 expr 3 \\* 4。"},{"id":"42adf61d","t":"j","ch":3,"tp":"算术运算与条件测试","q":"在 [ ] 条件测试中，> 与 < 作为整数比较运算符是安全的。","a":false,"e":"应使用 -gt、-lt；> 会被当作重定向。"},{"id":"5fe3d565","t":"j","ch":3,"tp":"算术运算与条件测试","q":"(( a > b )) 可以进行整数比较。","a":true,"e":"(( )) 内可使用 C 风格运算符。"},{"id":"dfb2301","t":"f","ch":3,"tp":"流程控制：if / case / 循环","q":"Shell 中 if 语句以______结束，case 语句以______结束。","a":[["fi"],["esac"]],"e":"记忆：反写。"},{"id":"d335c574","t":"f","ch":3,"tp":"流程控制：if / case / 循环","q":"if 语句的多分支关键字是______，写成 elif 条件; then。","a":[["elif"]],"e":"else if 在 Shell 中要写 elif。"},{"id":"a15125a9","t":"f","ch":3,"tp":"流程控制：if / case / 循环","q":"在 case 语句中，每个分支的命令以______结束，通配（默认）分支的模式写作______。","a":[[";;","双分号"],["*)","*"]],"e":"case $x in a) ...;; *) ...;; esac。"},{"id":"d42242d3","t":"f","ch":3,"tp":"流程控制：if / case / 循环","q":"要输出 1 到 5，C 风格 for 循环应写成 for ((______; i<=5; i++))。","a":[["i=1"]],"e":"初值 i=1，条件 i<=5，每次 i++。"},{"id":"919a2a76","t":"f","ch":3,"tp":"流程控制：if / case / 循环","q":"until 循环在条件为______时退出（真/假）。","a":[["真"]],"e":"while 条件真时循环，until 条件假时循环。"},{"id":"5ce213f9","t":"f","ch":3,"tp":"流程控制：if / case / 循环","q":"列出 1 到 5 的序列，可用花括号展开______或命令 seq 1 5。","a":[["{1..5}"]],"e":"for i in {1..5}。"},{"id":"ae9e8215","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"Shell 中 if 语句的结束标记是（  ）。","a":1,"o":["end","fi","endif","done"],"e":"if…fi。"},{"id":"c6a25e6a","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"Shell 中 case 语句的结束标记是（  ）。","a":1,"o":["end","esac","endcase","done"],"e":"case…esac。"},{"id":"73420bb0","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"下列关于 Shell 流程控制的叙述，错误的是（  ）。","a":3,"o":["if 必须以 fi 结束","case 必须以 esac 结束","for 循环必须以 done 结束","while 循环不需要 done 结束"],"e":"while 同样需要 do … done。"},{"id":"931bb34e","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"在 if 语句中，条件为真的含义是（  ）。","a":0,"o":["命令退出状态为 0","命令退出状态为 1","命令输出非空","命令输出 true"],"e":"Shell 中以退出状态判断：0 为真，非 0 为假。"},{"id":"9a1fff7c","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"下列循环的输出是（  ）：for i in 1 2 3; do echo -n $i; done","a":1,"o":["1 2 3（换行）","123","i i i","321"],"e":"-n 不换行，输出 123。"},{"id":"35354d6c","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"命令 for i in $(seq 1 2 7); do echo $i; done 输出的数是（  ）。","a":1,"o":["1 2 3 4 5 6 7","1 3 5 7","2 4 6","1 2 7"],"e":"seq 起点 步长 终点，所以 1 3 5 7。"},{"id":"f66f1139","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"case 语句中，匹配多个模式用（  ）分隔。","a":1,"o":["逗号","竖线 |","分号","空格"],"e":"如 y|Y|yes)。"},{"id":"8e15fe8f","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"在 Shell 脚本中，无限循环的写法是（  ）。","a":0,"o":["while true; do …; done","while [ 0 -eq 1 ]; do …; done","while false; do …; done","until true; do …; done"],"e":"while true 永远为真；另外 while : 也可。"},{"id":"9a3d4b53","t":"c","ch":3,"tp":"流程控制：if / case / 循环","q":"语句 [ -f a.txt ] && echo yes || echo no 的含义是（  ）。","a":0,"o":["a.txt 是普通文件则输出 yes，否则输出 no","总是输出 yes","总是输出 no","语法错误"],"e":"&& 前面成功才执行后面，|| 前面失败才执行。"},{"id":"8fcf3822","t":"j","ch":3,"tp":"流程控制：if / case / 循环","q":"Shell 中 if 的结束标记是 endif。","a":false,"e":"结束标记是 fi。"},{"id":"5d017cb8","t":"j","ch":3,"tp":"流程控制：if / case / 循环","q":"case 语句每个分支必须以 ;; 结束。","a":true,"e":"最后一个分支的 ;; 可省略，但规范写法是加上。"},{"id":"abcded9c","t":"j","ch":3,"tp":"流程控制：if / case / 循环","q":"break 语句用于跳出当前循环，continue 语句用于跳过本次循环剩余语句。","a":true,"e":"两者含义不同。"},{"id":"ff151eb0","t":"j","ch":3,"tp":"流程控制：if / case / 循环","q":"while 循环在条件为假时执行循环体。","a":false,"e":"while 条件真时执行，until 条件假时执行。"},{"id":"c10e0c6c","t":"j","ch":3,"tp":"流程控制：if / case / 循环","q":"Shell 的 if 语句判断的是命令的退出状态，而不是布尔值。","a":true,"e":"例如 if grep -q root /etc/passwd; then …"},{"id":"ca3baa28","t":"s","ch":3,"tp":"流程控制：if / case / 循环","q":"简述 Shell 中 if 语句的基本结构（含 elif、else），并写出判断分数 score 等级的示例。（10分）","a":"1. 基本结构：\n   if 条件1; then\n       命令组1\n   elif 条件2; then\n       命令组2\n   else\n       命令组3\n   fi\n2. 示例：\n   if [ $score -ge 90 ]; then echo A\n   elif [ $score -ge 60 ]; then echo Pass\n   else echo Fail\n   fi"},{"id":"968f1aa7","t":"s","ch":3,"tp":"流程控制：if / case / 循环","q":"简述 for、while、until 三种循环的基本结构和区别。（10分）","a":"1. for：for 变量 in 列表; do 命令; done —— 遍历列表（或 C 风格 for ((i=0;i<n;i++))）；循环次数由列表确定。\n2. while：while 条件; do 命令; done —— 条件为真时循环。\n3. until：until 条件; do 命令; done —— 条件为假时循环，直到条件为真退出。\n4. 共同：循环体以 do 开始、done 结束；可用 break、continue 控制。"},{"id":"b3c09367","t":"s","ch":3,"tp":"流程控制：if / case / 循环","q":"简述 test 命令（或 [ ]）能完成的三类测试，并各举 3 个运算符。（8分）","a":"1. 整数比较：-eq（等于）、-ne（不等于）、-gt（大于）、-ge、-lt、-le。\n2. 字符串测试：=（相等）、!=（不等）、-z（长度为0）、-n（长度非0）。\n3. 文件测试：-e（存在）、-f（普通文件）、-d（目录）、-r/-w/-x（可读/写/执行）、-s（大小非0）。\n4. 逻辑组合：-a（与）、-o（或）、!（非）。注意 [ ] 内侧必须有空格。"},{"id":"dcd91f45","t":"f","ch":3,"tp":"函数、数组与重定向","q":"定义 Shell 函数的格式为：______ name() { 命令; }（可省略的关键字）。","a":[["function"]],"e":"function name { } 或 name() { }。"},{"id":"69c499a","t":"f","ch":3,"tp":"函数、数组与重定向","q":"在函数中声明只在函数内有效的变量，使用关键字______。","a":[["local"]],"e":"默认变量是全局的。"},{"id":"f974df89","t":"f","ch":3,"tp":"函数、数组与重定向","q":"输出重定向符号______覆盖写入文件，______追加写入文件。","a":[[">"],[">>"]],"e":"< 为输入重定向。"},{"id":"48940890","t":"f","ch":3,"tp":"函数、数组与重定向","q":"将标准错误重定向到文件使用______，丢弃输出使用重定向到______。","a":[["2>"],["/dev/null"]],"e":"2>&1 把错误合并到标准输出。"},{"id":"b85a70ae","t":"f","ch":3,"tp":"函数、数组与重定向","q":"将标准输出和标准错误一起重定向到 all.log 的写法（追加方式）：cmd ______ all.log 2>&1。","a":[[">>","&>>",">>"]],"e":"cmd >> all.log 2>&1。"},{"id":"fe9cd537","t":"f","ch":3,"tp":"函数、数组与重定向","q":"启动 bash 脚本并显示每条执行命令的调试选项是 bash ______ a.sh。","a":[["-x"]],"e":"-n 只检查语法，不执行。"},{"id":"5f9d8824","t":"c","ch":3,"tp":"函数、数组与重定向","q":"命令 ls > a.txt 的作用是（  ）。","a":1,"o":["把 ls 输出追加到 a.txt","把 ls 输出写入 a.txt（覆盖）","读取 a.txt","错误重定向"],"e":"> 覆盖，>> 追加。"},{"id":"818cbcc5","t":"c","ch":3,"tp":"函数、数组与重定向","q":"命令 cmd 2>&1 > f 与 cmd > f 2>&1 的区别主要在于（  ）。","a":1,"o":["没有区别","前者错误仍输出到屏幕，后者错误也进入文件","前者错误进文件","都报错"],"e":"重定向按从左到右顺序处理，2>&1 在 > f 之前时指向的是原来的屏幕。"},{"id":"5a124105","t":"c","ch":3,"tp":"函数、数组与重定向","q":"Shell 函数的参数在函数内通过（  ）获取。","a":0,"o":["$1、$2…","arg1、arg2","%1","args[]"],"e":"函数内的 $1 是函数的第一个参数，不是脚本参数。"},{"id":"a47a72e0","t":"c","ch":3,"tp":"函数、数组与重定向","q":"命令 cat <<EOF 称为（  ）。","a":1,"o":["输出重定向","Here Document（这里文档）","命令替换","管道"],"e":"<< 后接结束标记，把其间文本作为输入。"},{"id":"6d4943f8","t":"c","ch":3,"tp":"函数、数组与重定向","q":"命令 echo hello | wc -c 的输出是（  ）。","a":1,"o":["5","6","1","0"],"e":"hello 加换行符共 6 字节。"},{"id":"e4b35197","t":"c","ch":3,"tp":"函数、数组与重定向","q":"命令 ls /noexist 2> /dev/null 的结果是（  ）。","a":1,"o":["屏幕显示错误","不显示错误信息","创建文件","删除文件"],"e":"错误信息被丢弃。"},{"id":"f4392895","t":"c","ch":3,"tp":"函数、数组与重定向","q":"下面不是 Shell 调试手段的是（  ）。","a":3,"o":["bash -x a.sh","bash -n a.sh","set -x","gcc a.sh"],"e":"gcc 是 C 编译器。"},{"id":"455623ba","t":"j","ch":3,"tp":"函数、数组与重定向","q":"Shell 函数必须先定义后调用。","a":true,"e":"解释器自上而下执行，调用时函数需已定义。"},{"id":"16ceaef0","t":"j","ch":3,"tp":"函数、数组与重定向","q":">> 与 > 都表示覆盖写入。","a":false,"e":">> 追加，> 覆盖。"},{"id":"d21658c6","t":"j","ch":3,"tp":"函数、数组与重定向","q":"Shell 函数中定义的变量默认是局部变量。","a":false,"e":"默认是全局变量，需 local 才是局部变量。"},{"id":"b02270af","t":"j","ch":3,"tp":"函数、数组与重定向","q":"bash -n a.sh 只检查脚本语法，不执行。","a":true,"e":"-n = noexec。"},{"id":"7811a4cf","t":"j","ch":3,"tp":"函数、数组与重定向","q":"/dev/null 是一个特殊的空设备，写入的内容会被丢弃。","a":true,"e":"常用于屏蔽输出。"},{"id":"7b3fc6c6","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本，完成：①显示当前日期和时间；②显示当前登录用户名；③显示当前工作目录；④提示输入姓名并输出 \"Hello, 姓名\"。","a":"#!/bin/bash\necho \"当前日期时间: $(date)\"\necho \"当前用户: $(whoami)\"\necho \"当前目录: $(pwd)\"\nread -p \"请输入你的名字: \" name\necho \"Hello, $name\""},{"id":"7b27f66e","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本：判断当前目录下是否存在文件 test.txt，存在则输出\"存在\"，否则输出\"不存在\"。","a":"#!/bin/bash\nif [ -f test.txt ]; then\n    echo \"存在\"\nelse\n    echo \"不存在\"\nfi"},{"id":"dce98e4a","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本：使用 for 循环计算 1 到 100 的和并输出。","a":"#!/bin/bash\nsum=0\nfor i in $(seq 1 100); do\n    sum=$((sum + i))\ndone\necho \"1到100的和为: $sum\""},{"id":"c1357efd","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本：接收一个整数参数 n，用 while 循环输出 1~n 中所有偶数；若未提供参数，则提示用法并以状态 1 退出。","a":"#!/bin/bash\nif [ $# -ne 1 ]; then\n    echo \"用法: $0 n\"\n    exit 1\nfi\ni=1\nwhile [ $i -le $1 ]; do\n    if [ $((i % 2)) -eq 0 ]; then\n        echo $i\n    fi\n    i=$((i + 1))\ndone"},{"id":"6c025cf2","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本：从键盘读入一个分数，按 90 以上\"优秀\"、80~89\"良好\"、60~79\"及格\"、其余\"不及格\"输出评语（使用 if 或 case）。","a":"#!/bin/bash\nread -p \"请输入分数: \" s\nif [ $s -ge 90 ]; then\n    echo \"优秀\"\nelif [ $s -ge 80 ]; then\n    echo \"良好\"\nelif [ $s -ge 60 ]; then\n    echo \"及格\"\nelse\n    echo \"不及格\"\nfi"},{"id":"cbd6c9cd","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本：使用 case 语句根据输入的字符 y/Y 输出 \"确认\"，n/N 输出 \"取消\"，其他输出 \"无效输入\"。","a":"#!/bin/bash\nread -p \"是否继续(y/n)? \" ch\ncase $ch in\n    y|Y) echo \"确认\" ;;\n    n|N) echo \"取消\" ;;\n    *)   echo \"无效输入\" ;;\nesac"},{"id":"5b36f87e","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 函数 add，接收两个整数参数并输出它们的和，然后调用该函数计算 3 和 5 的和。","a":"#!/bin/bash\nadd() {\n    echo $(( $1 + $2 ))\n}\nresult=$(add 3 5)\necho \"3 + 5 = $result\""},{"id":"5a50794f","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本：统计当前目录下普通文件和子目录的个数，分别输出。","a":"#!/bin/bash\nfiles=0\ndirs=0\nfor f in *; do\n    if [ -f \"$f\" ]; then\n        files=$((files + 1))\n    elif [ -d \"$f\" ]; then\n        dirs=$((dirs + 1))\n    fi\ndone\necho \"普通文件: $files 个\"\necho \"目录: $dirs 个\""},{"id":"de9970da","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本：判断用户输入的整数是否为素数（大于1，仅能被1和自身整除）。","a":"#!/bin/bash\nread -p \"请输入一个整数: \" n\nif [ $n -lt 2 ]; then\n    echo \"$n 不是素数\"\n    exit 0\nfi\nis_prime=1\ni=2\nwhile [ $((i * i)) -le $n ]; do\n    if [ $((n % i)) -eq 0 ]; then\n        is_prime=0\n        break\n    fi\n    i=$((i + 1))\ndone\nif [ $is_prime -eq 1 ]; then\n    echo \"$n 是素数\"\nelse\n    echo \"$n 不是素数\"\nfi"},{"id":"41fb4b4a","t":"p","ch":3,"tp":"函数、数组与重定向","q":"编写 Shell 脚本：把当前目录下所有 .txt 文件复制到 backup 目录中（若 backup 不存在则先创建），并输出复制的文件个数。","a":"#!/bin/bash\n[ -d backup ] || mkdir backup\ncount=0\nfor f in *.txt; do\n    if [ -f \"$f\" ]; then\n        cp \"$f\" backup/\n        count=$((count + 1))\n    fi\ndone\necho \"共复制 $count 个文件\""},{"id":"73a8b6ef","t":"p","ch":3,"tp":"函数、数组与重定向","q":"写出一行命令：把命令 ls /etc 的标准输出追加到 out.log，错误输出丢弃。","a":"ls /etc >> out.log 2>/dev/null"},{"id":"52356c57","t":"f","ch":4,"tp":"文件类型与 inode","q":"在 ls -l 输出中，目录文件的类型字符是______，符号链接是______。","a":[["d"],["l"]],"e":"- 普通文件；b 块设备；c 字符设备；p 命名管道；s 套接字。"},{"id":"1fed14c0","t":"f","ch":4,"tp":"文件类型与 inode","q":"Linux 中一切皆文件，硬件设备在______目录下以设备文件形式出现。","a":[["/dev"]],"e":"如 /dev/sda、/dev/tty。"},{"id":"412c6816","t":"c","ch":4,"tp":"文件类型与 inode","q":"在 ls -l 的输出中，第一个字符为 - 表示该文件是（  ）。","a":0,"o":["普通文件","目录","符号链接","块设备"],"e":"- 普通文件。"},{"id":"3e34f679","t":"c","ch":4,"tp":"文件类型与 inode","q":"inode 中不包含的信息是（  ）。","a":2,"o":["文件大小","文件权限","文件名","数据块位置"],"e":"文件名存放在目录项中。"},{"id":"e62beac9","t":"c","ch":4,"tp":"文件类型与 inode","q":"一个文件系统中 inode 数量耗尽但磁盘空间尚有时，将会出现（  ）。","a":1,"o":["仍可创建任意多文件","不能再创建新文件","文件自动合并","系统重启"],"e":"inode 数量在格式化时固定，用完则无法新建文件，可用 df -i 查看。"},{"id":"458b1fc3","t":"c","ch":4,"tp":"文件类型与 inode","q":"下列关于 Linux 目录的叙述，正确的是（  ）。","a":0,"o":["目录是一种特殊文件，其内容是目录项列表","目录不是文件","目录不占用 inode","目录内容为文件数据"],"e":"目录是特殊的文件，也占用 inode。"},{"id":"4c6dc90f","t":"j","ch":4,"tp":"文件类型与 inode","q":"Linux 中 /dev/sda 属于块设备文件。","a":true,"e":"磁盘是块设备。"},{"id":"81bbf4b1","t":"j","ch":4,"tp":"文件类型与 inode","q":"Linux 的文件扩展名决定文件的类型。","a":false,"e":"类型由 inode 中的类型位决定，扩展名只是习惯。"},{"id":"cb3fdee1","t":"s","ch":4,"tp":"文件类型与 inode","q":"简述 Linux 系统中 inode 的作用及其存储的信息。（10分）","a":"1. 作用：inode（索引节点）是文件系统中描述文件元数据的数据结构，每个文件对应一个 inode，通过 inode 号标识；内核通过 inode 找到文件数据块。\n2. 存储信息：文件类型与权限、属主 UID 和属组 GID、文件大小、三个时间戳（atime、mtime、ctime）、硬链接数、指向数据块的指针（块地址）。\n3. 注意：inode 不存储文件名，文件名存放于目录项（目录文件）中，目录项建立\"文件名—inode 号\"对应。"},{"id":"7526d00b","t":"f","ch":4,"tp":"权限管理","q":"文件权限 rwxr-xr-- 用数字表示为______。","a":[["754"]],"e":"rwx=7，r-x=5，r--=4。"},{"id":"c7068807","t":"f","ch":4,"tp":"权限管理","q":"执行 chmod u+x a.sh 后，______（所有者/属组/其他）获得了执行权限。","a":[["所有者","属主","用户","u"]],"e":"u=user(所有者)，g=group，o=others，a=all。"},{"id":"8bd33555","t":"f","ch":4,"tp":"权限管理","q":"对目录而言，______权限决定是否可以进入目录（cd）。","a":[["x","执行","可执行"]],"e":"目录的 r 允许列出目录内容，w 允许在目录中创建/删除文件，x 允许进入/访问。"},{"id":"aaa4cb11","t":"c","ch":4,"tp":"权限管理","q":"命令 chmod 644 file 后，file 的权限是（  ）。","a":1,"o":["rwxr--r--","rw-r--r--","rw-rw-r--","r--r--r--"],"e":"6=rw-，4=r--，4=r--。"},{"id":"18ccfa6","t":"c","ch":4,"tp":"权限管理","q":"命令 chmod g-w file 的含义是（  ）。","a":1,"o":["为属组增加写权限","去除属组的写权限","去除属主的写权限","去除其他用户写权限"],"e":"g=group，-w 去掉写。"},{"id":"4f521c62","t":"c","ch":4,"tp":"权限管理","q":"umask 值为 077 时，新建文件的默认权限是（  ）。","a":0,"o":["600","700","644","666"],"e":"文件 666-077=600。"},{"id":"5d07490","t":"c","ch":4,"tp":"权限管理","q":"用户对目录具有 w 权限而没有 x 权限，则（  ）。","a":1,"o":["可以在目录中创建文件","一般不能在其中创建或删除文件（因为无法进入）","可以进入目录","等于 r 权限"],"e":"对目录的写操作通常需要 w 和 x 同时具备。"},{"id":"8e82d2ef","t":"c","ch":4,"tp":"权限管理","q":"SUID 的作用是（  ）。","a":0,"o":["执行该程序时以文件所有者的身份运行","执行时以组身份运行","文件不可被删除","文件加密"],"e":"如 /usr/bin/passwd 带 s 位，使普通用户能修改 /etc/shadow。"},{"id":"a4a6ec3c","t":"c","ch":4,"tp":"权限管理","q":"要使一个脚本 test.sh 能被所有者执行，最合适的命令是（  ）。","a":0,"o":["chmod u+x test.sh","chmod u-x test.sh","chown u+x test.sh","chgrp x test.sh"],"e":"赋予所有者执行权限。"},{"id":"b97c8739","t":"j","ch":4,"tp":"权限管理","q":"目录的 x 权限表示可以进入该目录。","a":true,"e":"没有 x 无法 cd 或访问其中文件。"},{"id":"f07afa2a","t":"j","ch":4,"tp":"权限管理","q":"普通用户可以用 chown 把自己的文件改成别人的。","a":false,"e":"改属主通常需要 root 权限。"},{"id":"b145829b","t":"j","ch":4,"tp":"权限管理","q":"文件的权限和文件所在目录的权限无关，只与文件自身有关。","a":false,"e":"删除文件、重命名取决于所在目录的 w 与 x 权限。"},{"id":"c128c510","t":"s","ch":4,"tp":"权限管理","q":"说明 Linux 文件权限的组成（以 -rwxr-xr-- 为例），并写出 chmod 的数字法和符号法各一例。（8分）","a":"1. 共 10 个字符：第1位为文件类型（- 普通文件）；第2~4位为属主权限 rwx；第5~7位为属组权限 r-x；第8~10位为其他用户权限 r--。\n2. 数值：r=4，w=2，x=1；rwxr-xr-- = 754。\n3. 数字法：chmod 754 file；符号法：chmod u=rwx,g=rx,o=r file（或 chmod g-w,o+r file）。"},{"id":"ddec34d1","t":"f","ch":4,"tp":"硬链接与软链接","q":"硬链接与原文件共享同一个______号。","a":[["inode"]],"e":"硬链接本质是目录项指向同一 inode。"},{"id":"d73056ff","t":"f","ch":4,"tp":"硬链接与软链接","q":"硬链接______（能/不能）跨文件系统，______（能/不能）对目录创建。","a":[["不能"],["不能"]],"e":"软链接则可跨文件系统，也可链接目录。"},{"id":"6fbf8f8f","t":"c","ch":4,"tp":"硬链接与软链接","q":"下列关于软链接的叙述，错误的是（  ）。","a":2,"o":["有自己的 inode","可以跨文件系统","原文件删除后软链接仍然有效","可以指向目录"],"e":"原文件删除后软链接成为悬空链接（dangling link）。"},{"id":"263458e5","t":"c","ch":4,"tp":"硬链接与软链接","q":"文件 a 有 1 个硬链接，执行 ln a b 后，a 的链接数变为（  ）。","a":1,"o":["1","2","3","0"],"e":"链接数加 1。"},{"id":"360742af","t":"c","ch":4,"tp":"硬链接与软链接","q":"ls -l 中显示 lrwxrwxrwx 1 root root 9 … link -> /etc/hosts，表示 link 是（  ）。","a":1,"o":["硬链接","软链接（符号链接）","目录","设备"],"e":"l 开头，-> 指向目标。"},{"id":"fdbf56b0","t":"j","ch":4,"tp":"硬链接与软链接","q":"软链接可以跨越不同的文件系统。","a":true,"e":"软链接保存的是路径字符串。"},{"id":"f13c98b","t":"j","ch":4,"tp":"硬链接与软链接","q":"ln 命令默认创建软链接。","a":false,"e":"默认是硬链接，ln -s 才是软链接。"},{"id":"8e393d80","t":"s","ch":4,"tp":"硬链接与软链接","q":"简述硬链接和软链接的区别。（15分）","a":"1. 硬链接：①与原文件共享同一个 inode（本质是同一文件的另一个目录项）；②不能跨文件系统；③不能对目录创建；④删除原文件不影响硬链接，只要链接数>0，数据就保留；⑤命令 ln src dst。\n2. 软链接（符号链接）：①是一个独立的特殊文件，有自己的 inode，内容为目标路径；②可以跨文件系统；③可以链接目录；④删除原文件后，软链接失效成为悬空链接；⑤命令 ln -s src dst。"},{"id":"41eca774","t":"f","ch":4,"tp":"文件系统类型与挂载","q":"将设备挂载到目录的命令是______，卸载的命令是______。","a":[["mount"],["umount"]],"e":"注意是 umount，不是 unmount。"},{"id":"5de89312","t":"f","ch":4,"tp":"文件系统类型与挂载","q":"VFS 的全称是______，它为各种文件系统提供统一的接口。","a":[["虚拟文件系统","Virtual File System"]],"e":"使应用程序用同样的系统调用访问不同文件系统。"},{"id":"d32e52e2","t":"f","ch":4,"tp":"文件系统类型与挂载","q":"检查并修复文件系统的命令是______。","a":[["fsck"]],"e":"应在文件系统未挂载时执行。"},{"id":"beab790f","t":"c","ch":4,"tp":"文件系统类型与挂载","q":"下列命令中，用于显示磁盘分区空间使用情况的是（  ）。","a":1,"o":["du","df","ls","fdisk -l"],"e":"df = disk free。"},{"id":"ecceee44","t":"c","ch":4,"tp":"文件系统类型与挂载
