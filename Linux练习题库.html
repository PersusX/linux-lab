","q":"挂载 U 盘分区 /dev/sdb1 到 /mnt/usb 的命令是（  ）。","a":0,"o":["mount /dev/sdb1 /mnt/usb","mount /mnt/usb /dev/sdb1","umount /dev/sdb1 /mnt/usb","link /dev/sdb1 /mnt/usb"],"e":"mount 设备 挂载点。"},{"id":"15cf7c24","t":"c","ch":4,"tp":"文件系统类型与挂载","q":"下列关于 Linux 支持文件系统的叙述，正确的是（  ）。","a":1,"o":["只支持 ext 系列","通过 VFS 可同时支持多种文件系统","不能访问 FAT 格式的 U 盘","每增加一种文件系统都必须重写应用程序"],"e":"VFS 屏蔽了差异，应用程序无需修改即可访问不同文件系统。"},{"id":"535fb840","t":"c","ch":4,"tp":"文件系统类型与挂载","q":"/proc 文件系统的特点是（  ）。","a":1,"o":["存放在硬盘中","是内存中的虚拟文件系统，反映内核和进程信息","存放用户文件","保存日志"],"e":"如 /proc/cpuinfo。"},{"id":"65690069","t":"j","ch":4,"tp":"文件系统类型与挂载","q":"挂载点必须是一个已经存在的目录。","a":true,"e":"mount 的挂载点应是已存在的目录，挂载后原目录内容被隐藏。"},{"id":"b791aebe","t":"j","ch":4,"tp":"文件系统类型与挂载","q":"df 命令用于统计某个目录占用的磁盘空间。","a":false,"e":"df 显示文件系统的总量/已用/可用；统计目录用 du。"},{"id":"483a8770","t":"s","ch":4,"tp":"文件系统类型与挂载","q":"简述 VFS（虚拟文件系统）的作用和主要组成对象。（10分）","a":"1. 作用：VFS 是内核中的一个抽象层，向上为应用程序提供统一的文件操作接口（open/read/write/close 等系统调用），向下屏蔽 ext4、XFS、FAT、NTFS、NFS、proc 等不同文件系统的差异，使 Linux 能同时支持多种文件系统。\n2. 主要对象：\n   - 超级块（superblock）：描述已挂载文件系统的整体信息；\n   - 索引节点（inode）：描述文件的元数据；\n   - 目录项（dentry）：描述目录层次中的文件名与 inode 的对应，加速路径查找；\n   - 文件对象（file）：描述进程已打开的文件。"},{"id":"5e880fd1","t":"f","ch":4,"tp":"文件 I/O 系统调用","q":"文件描述符是一个______（负数/非负整数），open 成功返回最小的未使用的描述符。","a":[["非负整数","非负","整数"]],"e":"open 失败返回 -1。"},{"id":"48afbf24","t":"f","ch":4,"tp":"文件 I/O 系统调用","q":"获取文件元信息（大小、权限、inode 等）的系统调用是______，对已打开的文件描述符操作的是______。","a":[["stat"],["fstat"]],"e":"lstat 对符号链接本身获取信息。"},{"id":"ec0aa2ce","t":"f","ch":4,"tp":"文件 I/O 系统调用","q":"出错时，库函数 perror() 根据全局变量______输出错误描述。","a":[["errno"]],"e":"需包含 <errno.h>/<stdio.h>。"},{"id":"e42f2fa2","t":"c","ch":4,"tp":"文件 I/O 系统调用","q":"open(\"a.txt\", O_WRONLY|O_CREAT|O_TRUNC, 0644) 的含义是（  ）。","a":1,"o":["只读打开","只写打开，不存在则创建，存在则清空","读写追加","只写追加"],"e":"O_TRUNC 清空原内容。"},{"id":"79a55b3d","t":"c","ch":4,"tp":"文件 I/O 系统调用","q":"read(fd, buf, 100) 返回 0，表示（  ）。","a":1,"o":["出错","已到达文件末尾","读到 100 字节","文件未打开"],"e":"0 表示 EOF，-1 表示错误。"},{"id":"286718cd","t":"c","ch":4,"tp":"文件 I/O 系统调用","q":"关于标准输入、标准输出、标准错误的文件描述符，正确的是（  ）。","a":0,"o":["0、1、2","1、2、3","2、1、0","3、4、5"],"e":"STDIN=0，STDOUT=1，STDERR=2。"},{"id":"3e67d07a","t":"c","ch":4,"tp":"文件 I/O 系统调用","q":"语句 dup2(fd, 1) 的作用是（  ）。","a":1,"o":["关闭 fd","使标准输出重定向到 fd 所指文件","使 fd 指向标准输入","创建管道"],"e":"dup2 将文件描述符 1 变成 fd 的副本。"},{"id":"efeb4e7e","t":"c","ch":4,"tp":"文件 I/O 系统调用","q":"标准输出连接到终端时，stdout 默认是（  ）。","a":1,"o":["无缓冲","行缓冲","全缓冲","不可缓冲"],"e":"连接文件或管道时是全缓冲；stderr 无缓冲。"},{"id":"91e1f62b","t":"c","ch":4,"tp":"文件 I/O 系统调用","q":"在 C 语言中，判断 st_mode 是否是目录的宏是（  ）。","a":0,"o":["S_ISDIR(st_mode)","S_ISREG(st_mode)","S_ISLNK(st_mode)","S_ISFIFO(st_mode)"],"e":"S_ISREG 普通文件，S_ISDIR 目录。"},{"id":"89ef665c","t":"c","ch":4,"tp":"文件 I/O 系统调用","q":"fflush(stdout) 的作用是（  ）。","a":1,"o":["关闭 stdout","将用户缓冲区中的数据立即写出","清屏","读取输入"],"e":"强制刷新缓冲区。"},{"id":"e6d487a","t":"j","ch":4,"tp":"文件 I/O 系统调用","q":"read 返回 0 表示发生错误。","a":false,"e":"返回 0 表示 EOF，错误返回 -1。"},{"id":"2595898","t":"j","ch":4,"tp":"文件 I/O 系统调用","q":"标准 I/O 库函数 fopen 返回文件描述符（整数）。","a":false,"e":"fopen 返回 FILE* 指针；fileno(fp) 可取得描述符。"},{"id":"6860bc7d","t":"j","ch":4,"tp":"文件 I/O 系统调用","q":"lseek 可以使文件读写位置超出文件末尾，形成\"空洞\"文件。","a":true,"e":"空洞部分读出为 0，不占磁盘块。"},{"id":"180198e4","t":"j","ch":4,"tp":"文件 I/O 系统调用","q":"子进程会继承父进程已打开的文件描述符。","a":true,"e":"fork 后共享同一个打开文件表项（含偏移量）。"},{"id":"3d2aa442","t":"s","ch":4,"tp":"文件 I/O 系统调用","q":"比较系统调用 I/O 与标准 I/O 库（fopen/fread/fwrite）的区别。（8分）","a":"1. 层次：系统调用直接进入内核（open/read/write），返回文件描述符 int；标准 I/O 是 C 库函数，使用 FILE* 流。\n2. 缓冲：系统调用无用户态缓冲（每次调用进入内核）；标准 I/O 带用户缓冲（全缓冲/行缓冲/无缓冲），能减少系统调用次数，需 fflush 才立即写出。\n3. 可移植性：标准 I/O 为 ISO C 标准，可移植；系统调用是 POSIX/平台特有。\n4. 功能：标准 I/O 提供格式化输入输出（printf/scanf）、按行读写等；系统调用可用于设备、管道、套接字及底层控制（lseek、fcntl）。"},{"id":"d7b297a9","t":"p","ch":4,"tp":"文件 I/O 系统调用","q":"使用系统调用 open/read/write 编写 C 程序，把文件 src.txt 复制为 dst.txt。","a":"#include <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n\nint main(void)\n{\n    int in = open(\"src.txt\", O_RDONLY);\n    if (in < 0) { perror(\"open src\"); return 1; }\n    int out = open(\"dst.txt\", O_WRONLY | O_CREAT | O_TRUNC, 0644);\n    if (out < 0) { perror(\"open dst\"); close(in); return 1; }\n\n    char buf[1024];\n    ssize_t n;\n    while ((n = read(in, buf, sizeof(buf))) > 0) {\n        if (write(out, buf, n) != n) { perror(\"write\"); break; }\n    }\n    close(in);\n    close(out);\n    return 0;\n}"},{"id":"9ab17617","t":"p","ch":4,"tp":"文件 I/O 系统调用","q":"编写 C 程序，使用 opendir/readdir/closedir 列出当前目录下所有文件名。","a":"#include <stdio.h>\n#include <dirent.h>\n\nint main(void)\n{\n    DIR *dp = opendir(\".\");\n    if (dp == NULL) { perror(\"opendir\"); return 1; }\n    struct dirent *entry;\n    while ((entry = readdir(dp)) != NULL) {\n        printf(\"%s\\n\", entry->d_name);\n    }\n    closedir(dp);\n    return 0;\n}"},{"id":"f671628a","t":"p","ch":4,"tp":"文件 I/O 系统调用","q":"编写 C 程序，利用 lseek 求文件 a.txt 的大小并输出。","a":"#include <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n\nint main(void)\n{\n    int fd = open(\"a.txt\", O_RDONLY);\n    if (fd < 0) { perror(\"open\"); return 1; }\n    off_t size = lseek(fd, 0, SEEK_END);\n    printf(\"文件大小: %ld 字节\\n\", (long)size);\n    close(fd);\n    return 0;\n}"},{"id":"cd004cf9","t":"p","ch":4,"tp":"文件 I/O 系统调用","q":"编写 C 程序，使用 dup2 把标准输出重定向到文件 out.txt，然后用 printf 输出一行文字（该行应写入 out.txt）。","a":"#include <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n\nint main(void)\n{\n    int fd = open(\"out.txt\", O_WRONLY | O_CREAT | O_TRUNC, 0644);\n    if (fd < 0) { perror(\"open\"); return 1; }\n    dup2(fd, STDOUT_FILENO);   /* 1 号描述符现在指向 out.txt */\n    close(fd);\n    printf(\"Hello, redirected output!\\n\");\n    fflush(stdout);\n    return 0;\n}"},{"id":"ca01ded9","t":"p","ch":4,"tp":"文件 I/O 系统调用","q":"写出完成以下操作的命令：①将 file.txt 权限设为所有者可读写执行、组和其他用户只读；②创建 file.txt 的硬链接 hardlink.txt；③创建软链接 softlink.txt；④查看当前目录各文件占用空间；⑤查看磁盘空间使用情况；⑥把 file.txt 的属主改为 zhang、属组改为 staff。","a":"① chmod 744 file.txt\n② ln file.txt hardlink.txt\n③ ln -s file.txt softlink.txt\n④ du -sh *\n⑤ df -h\n⑥ chown zhang:staff file.txt   （需 root）"},{"id":"e092877c","t":"p","ch":4,"tp":"文件 I/O 系统调用","q":"写出命令：①查看 file.txt 的 inode 号；②查看 file.txt 的详细元信息；③将 /dev/sdb1 格式化为 ext4；④将 /dev/sdb1 挂载到 /mnt/data；⑤卸载它。","a":"① ls -i file.txt\n② stat file.txt\n③ mkfs.ext4 /dev/sdb1     （或 mkfs -t ext4 /dev/sdb1）\n④ mount /dev/sdb1 /mnt/data\n⑤ umount /mnt/data"},{"id":"3c2d2e5b","t":"f","ch":5,"tp":"进程概念与状态","q":"Linux 内核用______结构体（task_struct）描述一个进程，相当于进程控制块 PCB。","a":[["task_struct","PCB","进程控制块"]],"e":"保存 PID、状态、寄存器、打开文件等信息。"},{"id":"e4370635","t":"f","ch":5,"tp":"进程概念与状态","q":"在 ps 的 STAT 列中，R 表示运行，S 表示可中断睡眠，T 表示停止，Z 表示______。","a":[["僵尸","僵尸进程","zombie"]],"e":"D 为不可中断睡眠（常见于等待磁盘 I/O）。"},{"id":"2506b58d","t":"c","ch":5,"tp":"进程概念与状态","q":"Linux 中描述进程的数据结构是（  ）。","a":0,"o":["task_struct","struct proc_t","PCB.h","inode"],"e":"task_struct 即 Linux 的 PCB。"},{"id":"39025349","t":"c","ch":5,"tp":"进程概念与状态","q":"ps 命令显示的进程状态中，Z 表示（  ）。","a":2,"o":["运行","停止","僵尸","睡眠"],"e":"Z = zombie。"},{"id":"d276bbce","t":"c","ch":5,"tp":"进程概念与状态","q":"进程从运行态转为就绪态的原因通常是（  ）。","a":0,"o":["时间片用完","等待 I/O","程序结束","等待信号量"],"e":"时间片耗尽被抢占，仍可运行，所以回到就绪队列。"},{"id":"35eb70b","t":"c","ch":5,"tp":"进程概念与状态","q":"下列关于进程和线程的叙述，错误的是（  ）。","a":3,"o":["进程是资源分配的基本单位","线程是 CPU 调度的基本单位","同一进程的多个线程共享地址空间","每个线程拥有独立的地址空间"],"e":"线程共享所属进程的地址空间。"},{"id":"dc708f00","t":"j","ch":5,"tp":"进程概念与状态","q":"进程控制块（PCB）是进程存在的唯一标志。","a":true,"e":"内核通过 PCB 感知和管理进程。"},{"id":"f78544d1","t":"j","ch":5,"tp":"进程概念与状态","q":"Linux 中所有进程都由 1 号进程直接创建。","a":false,"e":"进程由父进程创建，形成进程树；1 号进程是祖先，不是所有进程的直接父进程。"},{"id":"44ebef1c","t":"f","ch":5,"tp":"进程管理命令","q":"动态实时查看进程资源占用的命令是______。","a":[["top"]],"e":"按 q 退出，P 按 CPU 排序，M 按内存排序。"},{"id":"c410c002","t":"f","ch":5,"tp":"进程管理命令","q":"查看当前 Shell 的后台作业用______命令，将后台作业调到前台用______命令。","a":[["jobs"],["fg"]],"e":"bg 让停止的作业在后台继续运行。"},{"id":"2ececa66","t":"f","ch":5,"tp":"进程管理命令","q":"按进程名称终止进程的命令是______。","a":[["killall","pkill"]],"e":"killall name / pkill name。"},{"id":"ede52b99","t":"c","ch":5,"tp":"进程管理命令","q":"要把进程 1234 强制终止，应使用（  ）。","a":1,"o":["kill 1234","kill -9 1234","kill -1 1234","kill -15 1234"],"e":"-9（SIGKILL）无法被忽略。"},{"id":"3e2646b4","t":"c","ch":5,"tp":"进程管理命令","q":"nice 值的取值范围是（  ）。","a":1,"o":["0~99","-20~19","-100~100","1~10"],"e":"数值越小优先级越高，只有 root 可设负值。"},{"id":"64ca77bb","t":"c","ch":5,"tp":"进程管理命令","q":"命令 sleep 60 & 的作用是（  ）。","a":0,"o":["让 sleep 在后台运行","同时运行两次","杀死 sleep","循环"],"e":"& 后台运行，立即返回提示符。"},{"id":"6480691d","t":"c","ch":5,"tp":"进程管理命令","q":"要查看名为 nginx 的进程，较常用的组合是（  ）。","a":0,"o":["ps -ef | grep nginx","cat nginx","ls nginx","top nginx -x"],"e":"ps 输出通过 grep 过滤。"},{"id":"f9b68630","t":"c","ch":5,"tp":"进程管理命令","q":"下列命令中能够显示进程树的是（  ）。","a":0,"o":["pstree","ptree -x","ps -t","tree -p"],"e":"pstree 以树形显示。"},{"id":"6f201443","t":"j","ch":5,"tp":"进程管理命令","q":"nice 值越大，进程优先级越高。","a":false,"e":"nice 值越小优先级越高。"},{"id":"2ad82545","t":"j","ch":5,"tp":"进程管理命令","q":"Ctrl+C 可终止前台进程，Ctrl+Z 可挂起前台进程。","a":true,"e":"SIGINT 与 SIGTSTP。"},{"id":"789c52d3","t":"s","ch":5,"tp":"进程管理命令","q":"列举常用的进程管理命令（至少 6 个）并说明作用。（8分）","a":"1. ps：查看进程快照（ps -ef、ps aux）；\n2. top：动态实时显示进程资源占用；\n3. pstree：树状显示父子关系；\n4. kill / killall / pkill：向进程发送信号，终止进程（kill -9 强制）；\n5. jobs / bg / fg：查看、后台运行、前台调出作业；\n6. nice / renice：设置与调整进程优先级；\n7. nohup：使进程忽略挂起信号，退出登录后仍运行；& 使命令后台运行。"},{"id":"e9ca035c","t":"f","ch":5,"tp":"fork / vfork / exec","q":"fork() 在父进程中返回______，在子进程中返回______，失败返回______。","a":[["子进程PID","子进程ID","子进程的PID","子进程的进程号"],["0"],["-1"]],"e":"据此区分父子进程。"},{"id":"2083c007","t":"f","ch":5,"tp":"fork / vfork / exec","q":"exec 函数族的作用是用______替换当前进程的代码段、数据段等，进程 PID______（改变/不变）。","a":[["新程序","新的程序"],["不变"]],"e":"exec 成功后不返回。"},{"id":"64785050","t":"f","ch":5,"tp":"fork / vfork / exec","q":"在 C 程序中执行 shell 命令的库函数是______，其内部通过 fork + exec + wait 实现。","a":[["system"]],"e":"system(\"ls -l\")。"},{"id":"ec27bed4","t":"c","ch":5,"tp":"fork / vfork / exec","q":"fork() 函数在子进程中返回（  ）。","a":0,"o":["0","-1","子进程的 PID","父进程的 PID"],"e":"据此判断自己是子进程。"},{"id":"ba7b1046","t":"c","ch":5,"tp":"fork / vfork / exec","q":"程序 fork(); fork(); printf(\"A\\n\"); 运行后，输出 A 的次数是（  ）。","a":3,"o":["1","2","3","4"],"e":"两次 fork 共有 4 个进程，每个都执行 printf。"},{"id":"3bc28f97","t":"c","ch":5,"tp":"fork / vfork / exec","q":"程序 for(i=0;i<3;i++) fork(); 执行结束后，总进程数（含原进程）是（  ）。","a":3,"o":["3","6","7","8"],"e":"每次 fork 使进程数翻倍：2^3=8。"},{"id":"d5ade38f","t":"c","ch":5,"tp":"fork / vfork / exec","q":"exec 族函数执行成功后（  ）。","a":2,"o":["返回 0","返回子进程 PID","不返回，原程序被新程序取代","继续执行 exec 后的语句"],"e":"只有失败时才返回 -1。"},{"id":"5cdaeffd","t":"c","ch":5,"tp":"fork / vfork / exec","q":"vfork() 与 fork() 的主要区别是（  ）。","a":1,"o":["vfork 创建线程","vfork 子进程与父进程共享地址空间，父进程被挂起","vfork 不创建子进程","vfork 不返回"],"e":"vfork 子进程应立即 exec 或 _exit。"},{"id":"a197232e","t":"c","ch":5,"tp":"fork / vfork / exec","q":"写时复制（COW）技术的主要目的是（  ）。","a":0,"o":["提高 fork() 的效率，减少不必要的内存复制","提高 exec 效率","提高 wait 效率","提高 exit 效率"],"e":"fork 后暂不复制物理页，写时才复制。"},{"id":"c1bc8758","t":"c","ch":5,"tp":"fork / vfork / exec","q":"程序 int x=10; if(fork()==0){x+=5; printf(\"%d\\n\",x);} else {wait(NULL); printf(\"%d\\n\",x);} 的输出依次为（  ）。","a":1,"o":["15 15","15 10","10 15","10 10"],"e":"父子进程有各自的数据副本：子进程 x=15，父进程 x 仍为 10；父进程 wait 保证子先输出。"},{"id":"35b88d9c","t":"c","ch":5,"tp":"fork / vfork / exec","q":"程序 printf(\"hi\"); fork(); （无换行，未 fflush）运行到结束，屏幕上共输出 hi 的次数为（  ）。","a":1,"o":["1","2","0","不确定"],"e":"缓冲区中的 \"hi\" 被子进程复制，两个进程退出时各自刷新一次。"},{"id":"f0343000","t":"c","ch":5,"tp":"fork / vfork / exec","q":"exec 族函数中，e 后缀的含义是（  ）。","a":1,"o":["按 PATH 搜索","可以传递环境变量数组","参数为列表","结束"],"e":"如 execle、execve。"},{"id":"37e8b573","t":"j","ch":5,"tp":"fork / vfork / exec","q":"fork() 调用一次，返回两次。","a":true,"e":"父进程中返回子 PID，子进程中返回 0。"},{"id":"160e4162","t":"j","ch":5,"tp":"fork / vfork / exec","q":"exec 族函数会创建一个新的进程。","a":false,"e":"exec 不创建新进程，只是替换当前进程映像，PID 不变。"},{"id":"46544153","t":"j","ch":5,"tp":"fork / vfork / exec","q":"vfork 创建的子进程运行时，父进程被阻塞。","a":true,"e":"直到子进程 exec 或退出。"},{"id":"1999e587","t":"j","ch":5,"tp":"fork / vfork / exec","q":"execl(\"/bin/ls\",\"ls\",\"-l\",NULL); 成功后，该语句之后的代码仍会被执行。","a":false,"e":"成功时不返回，之后代码被覆盖。"},{"id":"758e0f6e","t":"s","ch":5,"tp":"fork / vfork / exec","q":"简述 fork() 函数的特点和返回值。（10分）","a":"1. 作用：创建一个与调用进程几乎相同的子进程（复制代码、数据、堆栈、打开的文件描述符等），采用写时复制。\n2. 特点：调用一次、返回两次；父子进程并发执行，顺序不确定；子进程有独立的 PID 和 PPID，数据相互独立。\n3. 返回值：父进程中返回子进程的 PID（>0）；子进程中返回 0；失败返回 -1（不创建子进程）。"},{"id":"7a75981","t":"s","ch":5,"tp":"fork / vfork / exec","q":"比较 fork 与 vfork 的区别。（8分）","a":"1. 地址空间：fork 子进程拥有父进程地址空间的副本（写时复制）；vfork 子进程共享父进程地址空间。\n2. 执行顺序：fork 父子进程顺序不确定；vfork 保证子进程先运行，父进程被阻塞，直到子进程调用 exec 或 _exit。\n3. 用途：fork 通用；vfork 用于子进程立即 exec 的场景，开销小，但子进程不得返回/修改共享数据，否则行为未定义。"},{"id":"a0c68d86","t":"f","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"从 wait 得到的 status 中，宏______用于判断子进程是否正常退出，宏______用于取退出码。","a":[["WIFEXITED"],["WEXITSTATUS"]],"e":"WIFSIGNALED 判断是否被信号终止。"},{"id":"4d1594b4","t":"f","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"main 函数中 return n 的效果相当于调用______(n)。","a":[["exit"]],"e":"在 main 中，return 等价于 exit。"},{"id":"ca785164","t":"c","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"僵尸进程是指（  ）。","a":1,"o":["正在运行的进程","已终止但父进程尚未回收其信息的进程","父进程已终止的进程","无法终止的进程"],"e":"Z 状态，占用进程表项。"},{"id":"5426155c","t":"c","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"清除僵尸进程的有效方法是（  ）。","a":1,"o":["对僵尸进程执行 kill -9","让其父进程调用 wait/waitpid，或终止其父进程","重启 shell","使用 nice"],"e":"僵尸已经死亡，kill 无效；父进程回收或父进程退出由 init 回收。"},{"id":"be7039c0","t":"c","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"下列关于 wait() 的叙述，正确的是（  ）。","a":1,"o":["如果没有子进程结束，wait 立即返回 0","wait 会阻塞父进程，直到某个子进程结束","wait 创建新进程","wait 只能等待指定子进程"],"e":"等待指定子进程用 waitpid。"},{"id":"18c1e958","t":"c","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"waitpid(-1, &st, WNOHANG) 的含义是（  ）。","a":1,"o":["阻塞等待任一子进程","非阻塞地检查任一子进程是否已结束","等待进程组","忽略子进程"],"e":"-1 表示任意子进程；无子进程结束时立即返回 0。"},{"id":"a4873d42","t":"c","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"下列语句中，哪一个会使调用它的进程立即终止而不做任何标准 I/O 清理？（  ）","a":2,"o":["exit(0)","return 0","_exit(0)","sleep(0)"],"e":"_exit 直接结束，不刷新缓冲区。"},{"id":"b04aa084","t":"j","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"僵尸进程会占用 CPU 资源，应及时清除。","a":false,"e":"僵尸进程不占 CPU，但占用进程表项和 PID。"},{"id":"cbf97773","t":"j","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"wait() 函数用于创建子进程。","a":false,"e":"wait 用于等待子进程结束，创建用 fork。"},{"id":"ef86df7f","t":"j","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"kill -9 可以直接清除僵尸进程。","a":false,"e":"僵尸已经终止，需父进程回收。"},{"id":"f0baf839","t":"j","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"main 函数中 return 与 exit 的效果相同。","a":true,"e":"main 返回时库会调用 exit。"},{"id":"10fe3730","t":"s","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"简述僵尸进程和孤儿进程的概念、危害和处理方法。（10分）","a":"1. 僵尸进程：子进程已终止，但父进程没有调用 wait/waitpid 读取其退出状态，子进程的 PCB 仍保留（状态 Z）。危害：占用进程表项和 PID，大量堆积会使系统无法创建新进程。处理：父进程调用 wait/waitpid；处理 SIGCHLD 信号；杀死父进程，让 init 回收。\n2. 孤儿进程：父进程先于子进程结束，子进程被 init(1号进程) 收养，由 init 回收，一般没有危害。"},{"id":"8a285ab4","t":"p","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"编写 C 程序，使用 fork() 创建一个子进程，父子进程分别输出自己的 PID 和父进程 PID。","a":"#include <stdio.h>\n#include <unistd.h>\n#include <sys/types.h>\n\nint main(void)\n{\n    pid_t pid = fork();\n    if (pid < 0) {\n        perror(\"fork\");\n        return 1;\n    } else if (pid == 0) {\n        printf(\"子进程: PID=%d, PPID=%d\\n\", getpid(), getppid());\n    } else {\n        printf(\"父进程: PID=%d, 子进程PID=%d\\n\", getpid(), pid);\n    }\n    return 0;\n}"},{"id":"dbfaa2d","t":"p","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"编写 C 程序：创建子进程，子进程使用 execl 执行 \"ls -l\"，父进程等待子进程结束后输出 \"done\"。","a":"#include <stdio.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n\nint main(void)\n{\n    pid_t pid = fork();\n    if (pid < 0) {\n        perror(\"fork\");\n        return 1;\n    }\n    if (pid == 0) {\n        execl(\"/bin/ls\", \"ls\", \"-l\", (char *)NULL);\n        perror(\"execl\");     /* 只有失败才会执行到这里 */\n        _exit(1);\n    }\n    wait(NULL);\n    printf(\"done\\n\");\n    return 0;\n}"},{"id":"f0ef53e9","t":"p","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"编写 C 程序：创建 3 个子进程，每个子进程输出自己的编号和 PID 后退出，父进程等待所有子进程结束。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n\nint main(void)\n{\n    int i;\n    for (i = 1; i <= 3; i++) {\n        pid_t pid = fork();\n        if (pid < 0) {\n            perror(\"fork\");\n            exit(1);\n        }\n        if (pid == 0) {              /* 子进程 */\n            printf(\"子进程 %d, PID=%d\\n\", i, getpid());\n            exit(0);                 /* 防止子进程继续循环 fork */\n        }\n    }\n    for (i = 0; i < 3; i++)\n        wait(NULL);                  /* 回收 3 个子进程 */\n    printf(\"所有子进程已结束\\n\");\n    return 0;\n}"},{"id":"6481b058","t":"p","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"编写 C 程序，制造一个僵尸进程：子进程立即退出，父进程睡眠 30 秒后才结束（期间可用 ps 看到 Z 状态）。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <sys/types.h>\n\nint main(void)\n{\n    pid_t pid = fork();\n    if (pid < 0) {\n        perror(\"fork\");\n        return 1;\n    }\n    if (pid == 0) {\n        printf(\"子进程 %d 退出\\n\", getpid());\n        exit(0);                    /* 子进程先结束 */\n    }\n    printf(\"父进程 %d 睡眠中，不调用 wait\\n\", getpid());\n    sleep(30);                      /* 此期间 ps aux 可见子进程为 Z 状态 */\n    return 0;\n}"},{"id":"bcb2adbc","t":"p","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"编写 C 程序，演示 fork 后父子进程的变量互不影响：全局变量 g=100，子进程把 g 改为 200 并输出，父进程等待后输出 g。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n\nint g = 100;\n\nint main(void)\n{\n    pid_t pid = fork();\n    if (pid < 0) {\n        perror(\"fork\");\n        return 1;\n    }\n    if (pid == 0) {\n        g = 200;\n        printf(\"子进程: g=%d\\n\", g);     /* 200 */\n        exit(0);\n    }\n    wait(NULL);\n    printf(\"父进程: g=%d\\n\", g);         /* 仍为 100 */\n    return 0;\n}"},{"id":"a6334515","t":"p","ch":5,"tp":"wait / exit / 僵尸与孤儿","q":"写出命令：①后台运行 sleep 300；②查看后台作业；③把作业 1 调到前台；④查看名为 sleep 的进程；⑤强制终止 PID 为 4321 的进程；⑥以 nice 值 10 启动 ./a.out。","a":"① sleep 300 &\n② jobs\n③ fg %1\n④ ps -ef | grep sleep\n⑤ kill -9 4321\n⑥ nice -n 10 ./a.out"},{"id":"6bc41df8","t":"f","ch":6,"tp":"进程间通信概述","q":"System V IPC 包括消息队列、共享内存和______三种对象。","a":[["信号量"]],"e":"通过 key 值或 ID 标识。"},{"id":"54a75a09","t":"c","ch":6,"tp":"进程间通信概述","q":"下列 IPC 方式中速度最快的是（  ）。","a":2,"o":["管道","消息队列","共享内存","信号"],"e":"共享内存直接映射到进程地址空间。"},{"id":"ac08233d","t":"c","ch":6,"tp":"进程间通信概述","q":"查看系统中 System V IPC 对象的命令是（  ）。","a":0,"o":["ipcs","ipcls","ps ipc","show ipc"],"e":"ipcs 查看，ipcrm 删除。"},{"id":"33ee6c5f","t":"j","ch":6,"tp":"进程间通信概述","q":"不同进程的地址空间相互独立，所以它们之间不能直接共享变量。","a":true,"e":"需要借助 IPC。"},{"id":"32157e9d","t":"j","ch":6,"tp":"进程间通信概述","q":"System V IPC 对象会随创建它的进程退出自动销毁。","a":false,"e":"它们属于内核持久对象，必须显式删除。"},{"id":"15817884","t":"f","ch":6,"tp":"信号","q":"向指定进程发送信号的系统调用是______，进程向自己发送信号用______。","a":[["kill"],["raise"]],"e":"raise(sig) 等价于 kill(getpid(), sig)。"},{"id":"e01d6811","t":"f","ch":6,"tp":"信号","q":"使进程挂起直到收到一个信号的函数是______。","a":[["pause"]],"e":"收到信号并处理后 pause 返回 -1。"},{"id":"39e8c426","t":"f","ch":6,"tp":"信号","q":"信号 SIGKILL 和______不能被捕获、阻塞或忽略。","a":[["SIGSTOP"]],"e":"这两个信号保证管理员总能控制进程。"},{"id":"297f4bfb","t":"f","ch":6,"tp":"信号","q":"把信号处理方式设置为忽略，应使用 signal(sig, ______)。","a":[["SIG_IGN"]],"e":"SIG_DFL 恢复默认。"},{"id":"5f60b6bc","t":"c","ch":6,"tp":"信号","q":"下列信号中，Ctrl+C 产生的是（  ）。","a":0,"o":["SIGINT","SIGQUIT","SIGTSTP","SIGHUP"],"e":"SIGINT = 2。"},{"id":"38f00dc7","t":"c","ch":6,"tp":"信号","q":"signal(SIGINT, SIG_IGN) 的作用是（  ）。","a":1,"o":["恢复默认处理","忽略 SIGINT 信号","捕获信号","终止进程"],"e":"SIG_IGN 表示忽略。"},{"id":"5b6ff5c1","t":"c","ch":6,"tp":"信号","q":"kill(pid, 0) 的特殊用途是（  ）。","a":1,"o":["杀死进程","检查进程是否存在（不发送信号）","暂停进程","复制进程"],"e":"返回 0 表示进程存在且有权发信号。"},{"id":"ad88c7bd","t":"c","ch":6,"tp":"信号","q":"下列关于信号处理函数的叙述，正确的是（  ）。","a":1,"o":["信号处理函数由内核创建的新线程执行","信号到达时打断进程正常执行流程，转去执行处理函数，结束后返回","信号处理函数必须是 main 的子函数","信号处理函数不能有参数"],"e":"信号处理函数的原型为 void handler(int signo)。"},{"id":"c432b306","t":"c","ch":6,"tp":"信号","q":"Linux 中发送信号 SIGTERM 的命令是（  ）。","a":0,"o":["kill -15 pid","kill -9 pid","kill -2 pid","kill -19 pid"],"e":"-9 SIGKILL，-2 SIGINT，-19 SIGSTOP。"},{"id":"ba92760f","t":"c","ch":6,"tp":"信号","q":"信号 SIGPIPE 产生的典型情形是（  ）。","a":0,"o":["向没有读端的管道写数据","向管道读数据","管道已满","管道创建失败"],"e":"默认终止进程。"},{"id":"8e174bfa","t":"j","ch":6,"tp":"信号","q":"信号是一种异步通信机制。","a":true,"e":"进程无法预知信号何时到达。"},{"id":"495f7e0e","t":"j","ch":6,"tp":"信号","q":"进程收到 SIGINT 信号后默认会终止。","a":true,"e":"默认动作 Term。"},{"id":"3f238040","t":"j","ch":6,"tp":"信号","q":"一个进程只能向自己发送信号。","a":false,"e":"可以向其他进程发信号（权限允许时），使用 kill。"},{"id":"ffd323b1","t":"j","ch":6,"tp":"信号","q":"进程可以在信号处理函数中安全地调用任意库函数（如 printf、malloc）。","a":false,"e":"只有异步信号安全（async-signal-safe）的函数才可安全调用，write 是，printf 不是。"},{"id":"b1cd3c30","t":"s","ch":6,"tp":"信号","q":"简述 kill()、signal()、alarm()、pause() 四个函数的作用。（8分）","a":"1. kill(pid, sig)：向指定进程（或进程组）发送信号 sig。\n2. signal(sig, handler)：为信号 sig 注册处理函数（或 SIG_IGN/SIG_DFL）。\n3. alarm(n)：n 秒后向本进程发送 SIGALRM；n=0 取消定时器。\n4. pause()：挂起进程，直到捕获到一个信号并从处理函数返回。"},{"id":"e91c42cf","t":"f","ch":6,"tp":"管道与有名管道","q":"创建无名管道的系统调用是______，参数是一个含两个整数的数组 fd[2]。","a":[["pipe"]],"e":"fd[0] 读端，fd[1] 写端。"},{"id":"8c312b0a","t":"f","ch":6,"tp":"管道与有名管道","q":"管道是______（单向/双向）、先进先出的字节流，一端读另一端写。","a":[["单向（半双工）","单向","半双工"]],"e":"双向通信需要两个管道。"},{"id":"c78a4bae","t":"f","ch":6,"tp":"管道与有名管道","q":"管道的所有写端都关闭后，读端 read 返回______。","a":[["0"]],"e":"相当于文件结束 EOF。"},{"id":"7e3e5735","t":"c","ch":6,"tp":"管道与有名管道","q":"无名管道的特点是（  ）。","a":1,"o":["可以在任意两个进程间通信","只能用于有亲缘关系的进程，半双工","管道在磁盘文件系统中有名字","双向通信"],"e":"有名管道才可用于无亲缘关系的进程。"},{"id":"87e5421","t":"c","ch":6,"tp":"管道与有名管道","q":"当管道中无数据时，read 的行为是（  ）。","a":1,"o":["立即返回 0（只要写端仍打开）","阻塞等待数据（默认情况，写端仍打开时）","崩溃","返回 -1"],"e":"所有写端关闭后才返回 0。"},{"id":"7e086230","t":"c","ch":6,"tp":"管道与有名管道","q":"用 pipe 实现父子进程通信时，通常要（  ）。","a":0,"o":["父子进程各自关闭不用的那一端","父子都使用同一端","关闭全部描述符后再通信","子进程必须先 exec"],"e":"例如父写子读：父关 fd[0]，子关 fd[1]。"},{"id":"1ba4cb0e","t":"c","ch":6,"tp":"管道与有名管道","q":"下列命令中，可创建有名管道的是（  ）。","a":0,"o":["mkfifo f","mkdir f","pipe f","touch f"],"e":"mkfifo 创建命名管道文件，ls -l 显示类型 p。"},{"id":"67d3cc8b","t":"c","ch":6,"tp":"管道与有名管道","q":"下列关于 open 一个 FIFO 的描述，正确的是（  ）。","a":0,"o":["以只读方式 open 时，通常会阻塞直到另一进程以写方式打开","总是立即返回","不能 open","必须以读写方式打开"],"e":"默认阻塞，O_NONBLOCK 可避免阻塞。"},{"id":"1c941c57","t":"j","ch":6,"tp":"管道与有名管道","q":"无名管道可以用于任意两个进程之间的通信。","a":false,"e":"只适用于有亲缘关系的进程。"},{"id":"33f37a53","t":"j","ch":6,"tp":"管道与有名管道","q":"有名管道在文件系统中有对应的路径名，所以可以在无亲缘关系的进程间通信。","a":true,"e":"FIFO 以文件形式存在。"},{"id":"21b7495d","t":"j","ch":6,"tp":"管道与有名管道","q":"向读端已全部关闭的管道写数据会触发 SIGPIPE 信号。","a":true,"e":"默认动作终止进程。"},{"id":"fd68354d","t":"j","ch":6,"tp":"管道与有名管道","q":"mkfifo 命令创建的文件在磁盘上存储大量数据。","a":false,"e":"FIFO 文件只是文件系统中的入口，数据在内核缓冲区中。"},{"id":"31aaffc2","t":"s","ch":6,"tp":"管道与有名管道","q":"简述无名管道和有名管道的区别。（15分）","a":"1. 无名管道：①由 pipe() 创建，没有名字，不在文件系统中可见；②只能用于有亲缘关系的进程（如父子、兄弟），通过 fork 继承描述符；③生命周期随进程，所有描述符关闭后自动消失。\n2. 有名管道（FIFO）：①由 mkfifo 命令或 mkfifo() 函数创建，在文件系统中有路径名（类型 p）；②可用于任意两个无亲缘关系进程的通信，通过路径 open；③文件节点持久存在，需要手动 unlink/rm 删除。\n3. 共同点：都是半双工、先进先出的字节流；读空阻塞，写满阻塞；数据在内核缓冲区；写端全关则 read 返回 0；读端全关时写触发 SIGPIPE。"},{"id":"c5a0b688","t":"f","ch":6,"tp":"System V IPC","q":"创建共享内存的函数是______，把共享内存附加到进程地址空间的函数是______。","a":[["shmget"],["shmat"]],"e":"断开用 shmdt，控制/删除用 shmctl。"},{"id":"d0bc029e","t":"f","ch":6,"tp":"System V IPC","q":"ftok(path, id) 函数用于生成 System V IPC 所需的______。","a":[["key","键值","key值"]],"e":"key_t key。"},{"id":"6961ddf6","t":"f","ch":6,"tp":"System V IPC","q":"查看系统 IPC 资源的命令是______，删除指定 IPC 资源的命令是______。","a":[["ipcs"],["ipcrm"]],"e":"如 ipcrm -m shmid。"},{"id":"290869aa","t":"c","ch":6,"tp":"System V IPC","q":"消息队列中，msgrcv 通过消息的（  ）来选择接收哪类消息。","a":1,"o":["长度","类型 mtype","时间","优先级（无）"],"e":"msgtyp 为 0 取第一个，>0 取指定类型。"},{"id":"4072851f","t":"c","ch":6,"tp":"System V IPC","q":"shmat 函数的返回值是（  ）。","a":1,"o":["共享内存标识符","共享内存在进程地址空间中的起始地址","0","共享内存大小"],"e":"失败返回 (void *)-1。"},{"id":"3d2d3aaf","t":"c","ch":6,"tp":"System V IPC","q":"信号量的 P 操作含义是（  ）。","a":0,"o":["申请资源，信号量减 1，若无资源则阻塞","释放资源，信号量加 1","初始化信号量","删除信号量"],"e":"P 申请（wait），V 释放（signal/post）。"},{"id":"ee1c309e","t":"c","ch":6,"tp":"System V IPC","q":"消息队列相对于管道的优点是（  ）。","a":0,"o":["消息有类型，可按类型选择接收，且是面向记录的","速度比共享内存快","只能用于亲缘进程","读空时必须阻塞"],"e":"消息队列独立于进程，支持按类型读取。"},{"id":"5efba593","t":"c","ch":6,"tp":"System V IPC","q":"下列 IPC 方式中，需要使用 ftok 或 IPC_PRIVATE 获得 key 的是（  ）。","a":0,"o":["System V 消息队列、共享内存、信号量","无名管道","信号","有名管道"],"e":"System V IPC 用 key 标识对象；IPC_PRIVATE 创建私有对象。"},{"id":"8ba9eaf0","t":"j","ch":6,"tp":"System V IPC","q":"信号量主要用于进程间的同步与互斥。","a":true,"e":"本质上是计数器。"},{"id":"14bf801c","t":"j","ch":6,"tp":"System V IPC","q":"shmdt 函数会销毁共享内存段。","a":false,"e":"shmdt 只是分离；销毁用 shmctl(IPC_RMID)。"},{"id":"537d533b","t":"j","ch":6,"tp":"System V IPC","q":"信号量 P 操作使信号量加 1，V 操作使信号量减 1。","a":false,"e":"P：减 1（申请），V：加 1（释放）。"},{"id":"e4d2720b","t":"s","ch":6,"tp":"System V IPC","q":"比较管道、消息队列、共享内存三种 IPC 的特点。（10分）","a":"1. 管道：半双工字节流，简单；无名管道限于亲缘进程，有名管道可用于任意进程；读写需系统调用，有数据拷贝。\n2. 消息队列：面向消息（记录），带类型可选择接收；独立于进程存在；数据经内核拷贝，适合小量数据。\n3. 共享内存：映射同一块物理内存，不经内核拷贝，速度最快，适合大量数据；本身无同步，需配合信号量。"},{"id":"cf8a13ef","t":"p","ch":6,"tp":"System V IPC","q":"编写 C 程序：用 signal 捕获 SIGINT，收到信号后输出 \"Caught SIGINT\" 并退出程序。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <signal.h>\n#include <unistd.h>\n\nvoid handler(int sig)\n{\n    const char msg[] = \"Caught SIGINT\\n\";\n    write(STDOUT_FILENO, msg, sizeof(msg) - 1);\n    _exit(0);\n}\n\nint main(void)\n{\n    signal(SIGINT, handler);\n    printf(\"按 Ctrl+C 试试...\\n\");\n    while (1)\n        pause();\n    return 0;\n}"},{"id":"b9e3b32d","t":"p","ch":6,"tp":"System V IPC","q":"编写 C 程序：设置 alarm(3)，并用 signal 捕获 SIGALRM，在处理函数中输出 \"Time out\" 后退出。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <signal.h>\n#include <unistd.h>\n\nvoid on_alarm(int sig)\n{\n    printf(\"Time out\\n\");\n    exit(0);\n}\n\nint main(void)\n{\n    signal(SIGALRM, on_alarm);\n    alarm(3);\n    printf(\"3 秒后超时...\\n\");\n    while (1)\n        pause();\n    return 0;\n}"},{"id":"48e8266c","t":"p","ch":6,"tp":"System V IPC","q":"编写 C 程序：使用无名管道实现父子进程通信，父进程向子进程发送字符串 \"Hello\"，子进程接收并输出。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n\nint main(void)\n{\n    int fd[2];\n    char buf[64];\n\n    if (pipe(fd) == -1) {\n        perror(\"pipe\");\n        return 1;\n    }\n    pid_t pid = fork();\n    if (pid < 0) {\n        perror(\"fork\");\n        return 1;\n    }\n    if (pid == 0) {                    /* 子进程：读 */\n        close(fd[1]);                  /* 关闭写端 */\n        ssize_t n = read(fd[0], buf, sizeof(buf) - 1);\n        if (n > 0) {\n            buf[n] = '\\0';\n            printf(\"子进程收到: %s\\n\", buf);\n        }\n        close(fd[0]);\n        exit(0);\n    }\n    close(fd[0]);                      /* 父进程：关闭读端 */\n    write(fd[1], \"Hello\", strlen(\"Hello\"));\n    close(fd[1]);\n    wait(NULL);\n    return 0;\n}"},{"id":"6e17f9c4","t":"p","ch":6,"tp":"System V IPC","q":"编写 C 程序：用 mkfifo 创建有名管道 /tmp/myfifo，写进程向其中写入 \"Hello FIFO\"（只给出写进程）。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/stat.h>\n\nint main(void)\n{\n    const char *path = \"/tmp/myfifo\";\n    if (mkfifo(path, 0666) == -1) {\n        perror(\"mkfifo\");        /* 已存在时可忽略 EEXIST */\n    }\n    int fd = open(path, O_WRONLY);   /* 阻塞直到有读端 */\n    if (fd < 0) {\n        perror(\"open\");\n        return 1;\n    }\n    const char *msg = \"Hello FIFO\";\n    write(fd, msg, strlen(msg));\n    close(fd);\n    return 0;\n}"},{"id":"4daf8d6c","t":"p","ch":6,"tp":"System V IPC","q":"编写 C 程序：使用共享内存，父进程创建共享内存并写入字符串 \"Hello SHM\"，子进程读取并输出（用 wait 保证顺序）。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/ipc.h>\n#include <sys/shm.h>\n#include <sys/wait.h>\n\nint main(void)\n{\n    int shmid = shmget(IPC_PRIVATE, 1024, IPC_CREAT | 0666);\n    if (shmid == -1) {\n        perror(\"shmget\");\n        return 1;\n    }\n    char *p = (char *)shmat(shmid, NULL, 0);\n    if (p == (void *)-1) {\n        perror(\"shmat\");\n        return 1;\n    }\n    strcpy(p, \"Hello SHM\");          /* 父进程先写 */\n\n    pid_t pid = fork();\n    if (pid == 0) {\n        printf(\"子进程读到: %s\\n\", p);  /* 子进程继承映射 */\n        shmdt(p);\n        exit(0);\n    }\n    wait(NULL);\n    shmdt(p);\n    shmctl(shmid, IPC_RMID, NULL);   /* 删除共享内存 */\n    return 0;\n}"},{"id":"ac2460e1","t":"p","ch":6,"tp":"System V IPC","q":"写出命令：①创建名为 mypipe 的有名管道；②在一个终端向其写入 hello（echo）；③在另一个终端读出内容（cat）；④查看系统中的 System V IPC 信息；⑤删除 shmid 为 5 的共享内存；⑥向 PID 为 1234 的进程发送 SIGUSR1。","a":"① mkfifo mypipe\n② echo hello > mypipe\n③ cat mypipe\n④ ipcs\n⑤ ipcrm -m 5\n⑥ kill -USR1 1234    （或 kill -10 1234）"},{"id":"fb2d27b2","t":"f","ch":7,"tp":"线程基本概念","q":"同一进程的各线程共享进程的地址空间、全局变量、打开的文件描述符，但各自拥有独立的______和寄存器。","a":[["栈","线程栈","堆栈"]],"e":"还包括独立的线程 ID、errno、信号屏蔽字。"},{"id":"b315a15e","t":"f","ch":7,"tp":"线程基本概念","q":"线程相对于进程的优点：创建和切换开销______（大/小），通信方便（共享内存）。","a":[["小"]],"e":"因为不需要复制地址空间。"},{"id":"45660f71","t":"c","ch":7,"tp":"线程基本概念","q":"关于线程与进程的叙述，正确的是（  ）。","a":1,"o":["线程是资源分配的基本单位","线程是 CPU 调度的基本单位","线程之间不能共享数据","一个进程只能有一个线程"],"e":"进程是资源分配单位，线程是调度单位。"},{"id":"dfb044e8","t":"c","ch":7,"tp":"线程基本概念","q":"Linux 中线程的实现方式是（  ）。","a":1,"o":["用户级线程，内核无感知","通过共享资源的轻量级进程（LWP）实现","不支持线程","仅支持纤程"],"e":"NPTL 一对一模型，每个线程对应一个内核调度实体。"},{"id":"ed85921a","t":"c","ch":7,"tp":"线程基本概念","q":"多线程程序中，下列变量为线程私有（互不干扰）的是（  ）。","a":2,"o":["全局变量","静态局部变量","函数内的自动局部变量","堆上动态分配的内存（通过全局指针共享）"],"e":"自动变量在各线程自己的栈上。"},{"id":"2aabd567","t":"j","ch":7,"tp":"线程基本概念","q":"线程拥有独立的栈空间。","a":true,"e":"每个线程有自己的栈和寄存器。"},{"id":"23ffe096","t":"j","ch":7,"tp":"线程基本概念","q":"线程是资源分配的基本单位。","a":false,"e":"资源分配的基本单位是进程，线程是 CPU 调度的基本单位。"},{"id":"49c160fc","t":"s","ch":7,"tp":"线程基本概念","q":"简述线程与进程的区别。（10分）","a":"1. 资源：进程是资源分配的基本单位，拥有独立地址空间；线程是 CPU 调度的基本单位，共享所属进程的地址空间、文件描述符等资源，仅拥有自己的栈、寄存器、线程 ID 等。\n2. 开销：进程创建、切换开销大；线程小。\n3. 通信：进程间通信需借助 IPC；同一进程内线程通过全局变量等直接通信，但必须同步。\n4. 独立性：进程相互独立，一个进程崩溃一般不影响其他进程；线程崩溃会导致整个进程退出。\n5. Linux 实现：线程以轻量级进程（LWP）实现，通过 clone 创建，共享资源。"},{"id":"115af6f6","t":"f","ch":7,"tp":"线程创建与终止","q":"线程终止自己的函数是______，获取自己线程 ID 的函数是______。","a":[["pthread_exit"],["pthread_self"]],"e":"pthread_equal 比较两个线程 ID。"},{"id":"83bccceb","t":"f","ch":7,"tp":"线程创建与终止","q":"请求终止同一进程内另一个线程的函数是______。","a":[["pthread_cancel"]],"e":"目标线程在取消点响应。"},{"id":"985e2177","t":"c","ch":7,"tp":"线程创建与终止","q":"pthread_create 的第一个参数用来（  ）。","a":1,"o":["传递线程函数","返回新线程的 ID","指定线程属性","传递参数"],"e":"pthread_t *thread，成功后写入新线程 ID。"},{"id":"824f36fc","t":"c","ch":7,"tp":"线程创建与终止","q":"pthread_exit 与 exit 的区别是（  ）。","a":1,"o":["pthread_exit 结束整个进程","pthread_exit 只结束调用它的线程，exit 结束整个进程","没有区别","exit 只结束线程"],"e":"主线程调用 pthread_exit 时，其他线程继续运行。"},{"id":"80717c4","t":"c","ch":7,"tp":"线程创建与终止","q":"关于 pthread_create 的参数传递，下列说法正确的是（  ）。","a":0,"o":["只能传一个参数，但可通过结构体指针传多个值","可以直接传递多个参数","不能传递参数","线程函数不需要参数"],"e":"线程函数的 void * 参数可以是结构体指针。"},{"id":"e5bc4b9b","t":"c","ch":7,"tp":"线程创建与终止","q":"pthread_detach(tid) 之后（  ）。","a":0,"o":["线程结束后自动释放资源，不能再 join","仍必须 join","线程被终止","线程变成进程"],"e":"避免僵尸线程。"},{"id":"df0184ab","t":"c","ch":7,"tp":"线程创建与终止","q":"pthread_self() 返回（  ）。","a":0,"o":["当前线程的 ID","进程 PID","父线程 ID","线程优先级"],"e":"类型 pthread_t。"},{"id":"69ff0792","t":"j","ch":7,"tp":"线程创建与终止","q":"主线程用 pthread_exit 退出后，其他线程可以继续运行。","a":true,"e":"进程在最后一个线程结束时才终止。"},{"id":"ab2530e0","t":"j","ch":7,"tp":"线程创建与终止","q":"一个线程执行 exit() 会终止整个进程。","a":true,"e":"exit 作用于进程。"},{"id":"2124cdbc","t":"j","ch":7,"tp":"线程创建与终止","q":"pthread_join 可以对已被 detach 的线程调用。","a":false,"e":"会返回错误 EINVAL。"},{"id":"ad8d2582","t":"s","ch":7,"tp":"线程创建与终止","q":"简述 pthread_create 函数的各参数含义，并说明线程如何终止。（10分）","a":"1. int pthread_create(pthread_t *thread, const pthread_attr_t *attr, void *(*start_routine)(void *), void *arg)：\n   thread：保存新线程 ID；attr：线程属性，NULL 表示默认；start_routine：线程入口函数；arg：传给入口函数的参数；成功返回 0，失败返回错误码。\n2. 线程终止方式：①从入口函数 return；②调用 pthread_exit；③被其他线程 pthread_cancel；④进程终止（exit/main 返回）。\n3. 回收：pthread_join 等待并获取返回值；或 pthread_detach 让其自行回收。"},{"id":"75539d4f","t":"f","ch":7,"tp":"互斥锁","q":"互斥锁可以用宏______静态初始化。","a":[["PTHREAD_MUTEX_INITIALIZER"]],"e":"动态初始化用 pthread_mutex_init。"},{"id":"1fa82484","t":"f","ch":7,"tp":"互斥锁","q":"访问共享资源的那段代码称为______。","a":[["临界区"]],"e":"进入前加锁，出来后解锁。"},{"id":"8d779fed","t":"c","ch":7,"tp":"互斥锁","q":"下列关于互斥锁的叙述，正确的是（  ）。","a":1,"o":["允许多个线程同时持有","一次只能被一个线程持有","不需要初始化","不需要解锁"],"e":"未获得锁的线程会阻塞。"},{"id":"525c7be3","t":"c","ch":7,"tp":"互斥锁","q":"下列场景中，最容易引起死锁的是（  ）。","a":0,"o":["线程 A 持有锁1等待锁2，线程 B 持有锁2等待锁1","线程只用一把锁","线程加锁后很快释放","线程不加锁"],"e":"循环等待。"},{"id":"54ef46df","t":"c","ch":7,"tp":"互斥锁","q":"两个线程各对共享变量 count 执行 100000 次 count++（不加锁），最终 count 的值（  ）。","a":1,"o":["一定等于 200000","可能小于 200000","一定大于 200000","一定等于 100000"],"e":"count++ 不是原子操作，会丢失更新。"},{"id":"52e00460","t":"c","ch":7,"tp":"互斥锁","q":"关于加锁范围的叙述，较合理的是（  ）。","a":1,"o":["临界区越大越好","临界区应尽量小，只保护必须互斥的代码","不需要考虑","整个线程函数都加锁"],"e":"减少阻塞，提高并发。"},{"id":"f9daa211","t":"j","ch":7,"tp":"互斥锁","q":"临界区越大，程序并发性能越好。","a":false,"e":"临界区应尽量小。"},{"id":"7318c04f","t":"j","ch":7,"tp":"互斥锁","q":"线程加锁后忘记解锁，会导致其他等待该锁的线程永久阻塞。","a":true,"e":"这是常见错误。"},{"id":"80b7db02","t":"j","ch":7,"tp":"互斥锁","q":"线程 A 加的锁可以由线程 B 解锁（普通互斥锁）。","a":false,"e":"应由加锁线程解锁。"},{"id":"1fc3498d","t":"f","ch":7,"tp":"条件变量与信号量","q":"条件变量必须与______一起使用，以保护被判断的共享条件。","a":[["互斥锁","互斥量","mutex"]],"e":"pthread_cond_wait(&cond, &mutex)。"},{"id":"878a927e","t":"f","ch":7,"tp":"条件变量与信号量","q":"POSIX 信号量的头文件是 semaphore.h，初始化函数是 sem_init，P 操作函数是______，V 操作函数是______。","a":[["sem_wait"],["sem_post"]],"e":"销毁用 sem_destroy。"},{"id":"99040ca4","t":"c","ch":7,"tp":"条件变量与信号量","q":"pthread_cond_wait 调用时的正确做法是（  ）。","a":0,"o":["先加锁，再在 while 条件检查中调用 wait","不加锁直接调用","用 if 判断条件即可","先解锁再 wait"],"e":"防止丢失唤醒和虚假唤醒。"},{"id":"9d875fb5","t":"c","ch":7,"tp":"条件变量与信号量","q":"生产者—消费者问题中，缓冲区满时生产者应（  ）。","a":1,"o":["继续生产","等待（阻塞）直到有空位","退出","清空缓冲"],"e":"用条件变量或信号量实现。"},{"id":"58186844","t":"c","ch":7,"tp":"条件变量与信号量","q":"sem_post 的作用是（  ）。","a":0,"o":["信号量加 1，并唤醒等待者","信号量减 1","等待","销毁"],"e":"相当于 V 操作。"},{"id":"45c760b9","t":"c","ch":7,"tp":"条件变量与信号量","q":"线程同步的方式不包括（  ）。","a":3,"o":["互斥锁","条件变量","信号量","fork"],"e":"fork 用于创建进程。"},{"id":"85c1320","t":"c","ch":7,"tp":"条件变量与信号量","q":"可重入函数的特点是（  ）。","a":1,"o":["使用静态/全局数据且不加保护","不依赖全局状态，可被多个线程同时调用（或中断后再次调用）","必须使用锁","只能递归调用"],"e":"如 strtok_r、localtime_r。"},{"id":"77d9d87c","t":"j","ch":7,"tp":"条件变量与信号量","q":"条件变量必须与互斥锁一起使用。","a":true,"e":"互斥锁保护条件判断。"},{"id":"8d09b904","t":"j","ch":7,"tp":"条件变量与信号量","q":"调用 pthread_cond_wait 时应使用 if 而非 while 来检查条件。","a":false,"e":"应使用 while，防止虚假唤醒。"},{"id":"5edc8f70","t":"j","ch":7,"tp":"条件变量与信号量","q":"信号量既可用于互斥，也可用于同步。","a":true,"e":"初值1做互斥；初值0做同步。"},{"id":"ff8249fb","t":"j","ch":7,"tp":"条件变量与信号量","q":"strtok 是线程安全的函数。","a":false,"e":"使用静态缓冲区，不安全，应使用 strtok_r。"},{"id":"b583b91c","t":"s","ch":7,"tp":"条件变量与信号量","q":"简述互斥锁和条件变量的作用及使用步骤。（15分）","a":"1. 互斥锁：保证对共享资源（临界区）的互斥访问。步骤：①定义 pthread_mutex_t 并初始化（PTHREAD_MUTEX_INITIALIZER 或 pthread_mutex_init）；②进入临界区前 pthread_mutex_lock；③访问共享数据；④pthread_mutex_unlock；⑤不再使用时 pthread_mutex_destroy。\n2. 条件变量：让线程等待某个条件成立，并在条件变化时被通知。必须与互斥锁配合。步骤：①定义并初始化 pthread_cond_t；②等待方：lock(mutex) → while(条件不满足) pthread_cond_wait(&cond,&mutex) → 处理 → unlock；③通知方：lock → 修改条件 → pthread_cond_signal/broadcast → unlock；④销毁 pthread_cond_destroy。\n3. pthread_cond_wait 会原子地解锁并睡眠，唤醒时重新加锁；使用 while 防止虚假唤醒。"},{"id":"6b9c9b2b","t":"s","ch":7,"tp":"条件变量与信号量","q":"简述死锁产生的必要条件及预防方法。（8分）","a":"1. 必要条件：①互斥：资源一次只能被一个线程占用；②请求与保持：持有资源的同时请求新资源；③不可剥夺：已获得的资源不能被强行夺走；④循环等待：存在线程之间资源请求的循环链。\n2. 预防：破坏任一条件。如对多把锁规定统一申请顺序（破坏循环等待）；一次性申请全部资源（破坏请求与保持）；使用 trylock 失败后释放已持有的锁（破坏不可剥夺）；缩小临界区、减少嵌套锁。"},{"id":"9a5456c5","t":"p","ch":7,"tp":"条件变量与信号量","q":"编写 C 程序：创建两个线程，线程1计算 1~50 的和，线程2计算 51~100 的和，主线程等待两个线程结束后输出总和。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <pthread.h>\n\nstruct range { int from, to; long sum; };\n\nvoid *calc(void *arg)\n{\n    struct range *r = (struct range *)arg;\n    r->sum = 0;\n    for (int i = r->from; i <= r->to; i++)\n        r->sum += i;\n    return NULL;\n}\n\nint main(void)\n{\n    pthread_t t1, t2;\n    struct range r1 = {1, 50, 0}, r2 = {51, 100, 0};\n\n    pthread_create(&t1, NULL, calc, &r1);\n    pthread_create(&t2, NULL, calc, &r2);\n    pthread_join(t1, NULL);\n    pthread_join(t2, NULL);\n\n    printf(\"1~50 的和: %ld\\n\", r1.sum);\n    printf(\"51~100 的和: %ld\\n\", r2.sum);\n    printf(\"总和: %ld\\n\", r1.sum + r2.sum);\n    return 0;\n}"},{"id":"a6145ff4","t":"p","ch":7,"tp":"条件变量与信号量","q":"编写 C 程序：创建一个线程，在线程中输出 \"Hello from thread\"，并输出线程 ID；主线程等待其结束后输出 \"main exit\"。","a":"#include <stdio.h>\n#include <pthread.h>\n\nvoid *thread_func(void *arg)\n{\n    printf(\"Hello from thread, tid=%lu\\n\", (unsigned long)pthread_self());\n    return NULL;\n}\n\nint main(void)\n{\n    pthread_t tid;\n    if (pthread_create(&tid, NULL, thread_func, NULL) != 0) {\n        fprintf(stderr, \"create failed\\n\");\n        return 1;\n    }\n    pthread_join(tid, NULL);\n    printf(\"main exit\\n\");\n    return 0;\n}"},{"id":"8e332a8","t":"p","ch":7,"tp":"条件变量与信号量","q":"编写 C 程序：创建 3 个线程，通过参数传入编号 0、1、2，每个线程输出 \"thread N running\"。要求参数传递不产生竞争。","a":"#include <stdio.h>\n#include <pthread.h>\n\nvoid *run(void *arg)\n{\n    int id = *(int *)arg;\n    printf(\"thread %d running\\n\", id);\n    return NULL;\n}\n\nint main(void)\n{\n    pthread_t tid[3];\n    int ids[3];                    /* 每个线程使用独立的参数变量 */\n\n    for (int i = 0; i < 3; i++) {\n        ids[i] = i;\n        pthread_create(&tid[i], NULL, run, &ids[i]);\n    }\n    for (int i = 0; i < 3; i++)\n        pthread_join(tid[i], NULL);\n    return 0;\n}"},{"id":"a692925d","t":"p","ch":7,"tp":"条件变量与信号量","q":"编写 C 程序：线程函数返回一个整数结果（如 42），主线程通过 pthread_join 获取并输出该返回值。","a":"#include <stdio.h>\n#include <stdlib.h>\n#include <pthread.h>\n\nvoid *func(void *arg)\n{\n    int *result = malloc(sizeof(int));\n    *result = 42;\n    return result;                  /* 不能返回局部变量地址 */\n}\n\nint main(void)\n{\n    pthread_t tid;\n    void *ret;\n\n    pthread_create(&tid, NULL, func, NULL);\n    pthread_join(tid, &ret);\n    printf(\"线程返回值: %d\\n\", *(int *)ret);\n    free(ret);\n    return 0;\n}"},{"id":"c02ae08d","t":"p","ch":7,"tp":"条件变量与信号量","q":"使用条件变量编写简单示例：线程 A 等待变量 ready 变为 1，线程 B（主线程）置 ready=1 并通知 A。","a":"#include <stdio.h>\n#include <unistd.h>\n#include <pthread.h>\n\npthread_mutex_t mtx = PTHREAD_MUTEX_INITIALIZER;\npthread_cond_t  cond = PTHREAD_COND_INITIALIZER;\nint ready = 0;\n\nvoid *waiter(void *arg)\n{\n    pthread_mutex_lock(&mtx);\n    while (!ready)                              /* 用 while 防止虚假唤醒 */\n        pthread_cond_wait(&cond, &mtx);         /* 原子地解锁并等待 */\n    printf(\"A: 条件满足，继续执行\\n\");\n    pthread_mutex_unlock(&mtx);\n    return NULL;\n}\n\nint main(void)\n{\n    pthread_t t;\n    pthread_create(&t, NULL, waiter, NULL);\n\n    sleep(1);\n    pthread_mutex_lock(&mtx);\n    ready = 1;\n    pthread_cond_signal(&cond);                 /* 通知 A */\n    pthread_mutex_unlock(&mtx);\n\n    pthread_join(t, NULL);\n    return 0;\n}"},{"id":"a565d12c","t":"p","ch":7,"tp":"条件变量与信号量","q":"编写生产者—消费者程序（缓冲区容量 5，生产/消费各 10 个整数），使用互斥锁和两个条件变量实现。","a":"#include <stdio.h>\n#include <pthread.h>\n\n#define N 5\n#define TOTAL 10\n\nint buf[N];\nint in = 0, out = 0, count = 0;\npthread_mutex_t mtx = PTHREAD_MUTEX_INITIALIZER;\npthread_cond_t not_full  = PTHREAD_COND_INITIALIZER;\npthread_cond_t not_empty = PTHREAD_COND_INITIALIZER;\n\nvoid *producer(void *arg)\n{\n    for (int i = 1; i <= TOTAL; i++) {\n        pthread_mutex_lock(&mtx);\n        while (count == N)\n            pthread_cond_wait(&not_full, &mtx);\n        buf[in] = i;\n        in = (in + 1) % N;\n        count++;\n        printf(\"生产: %d\\n\", i);\n        pthread_cond_signal(&not_empty);\n        pthread_mutex_unlock(&mtx);\n    }\n    return NULL;\n}\n\nvoid *consumer(void *arg)\n{\n    for (int i = 1; i <= TOTAL; i++) {\n        pthread_mutex_lock(&mtx);\n        while (count == 0)\n            pthread_cond_wait(&not_empty, &mtx);\n        int v = buf[out];\n        out = (out + 1) % N;\n        count--;\n        printf(\"消费: %d\\n\", v);\n        pthread_cond_signal(&not_full);\n        pthread_mutex_unlock(&mtx);\n    }\n    return NULL;\n}\n\nint main(void)\n{\n    pthread_t p, c;\n    pthread_create(&p, NULL, producer, NULL);\n    pthread_create(&c, NULL, consumer, NULL);\n    pthread_join(p, NULL);\n    pthread_join(c, NULL);\n    return 0;\n}"},{"id":"86a328af","t":"p","ch":7,"tp":"条件变量与信号量","q":"写出命令：①编译多线程程序 t.c 生成可执行文件 t；②查看进程 t 的所有线程（LWP）；③后台运行 ./t。","a":"① gcc t.c -o t -lpthread      （或 -pthread）\n② ps -eLf | grep t            （或 ps -T -p <pid>）\n③ ./t &"}]};
</script>
<script>
(function(){

const CNUM=['一','二','三','四','五'];
const DAY=864e5, BOX_DAYS=[0,1,2,4,7,15,30];
const Q=QB.q; const BY={}; Q.forEach((q,i)=>{q.i=i;BY[q.id]=q;});
const CHS=Object.keys(QB.ch).map(Number).sort((a,b)=>a-b);
const CHN=ch=>QB.ch[ch]||('第'+ch+'章');
const TOPICS=[]; const TOPIC_IDX={};
Q.forEach(q=>{const k=q.ch+'|'+q.tp;if(!TOPIC_IDX[k]){TOPIC_IDX[k]={key:k,ch:q.ch,tp:q.tp,ids:[]};TOPICS.push(TOPIC_IDX[k]);}TOPIC_IDX[k].ids.push(q.id);});
const IC={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>',

};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0');};
const pct=(a,b)=>b?Math.round(a*100/b):0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const off=new Date().getTimezoneOffset()*6e4;
const dayN=ts=>Math.floor((ts-off)/DAY);
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function norm(s){return String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s'"`‘’“”。，、]/g,'').replace(/\(\)$/,'');}

/* ====================== 存储 ====================== */
const KEY='linux-qb-v1';
let memOnly=false;
const defState=()=>({v:1,rec:{},log:{},hist:[],exams:[],stars:{},set:{theme:'auto',shuffle:true,instant:true},resume:null,created:Date.now()});
let S=defState();
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw);S=Object.assign(defState(),o);S.set=Object.assign(defState().set,o.set||{});}
  }catch(e){memOnly=true;}
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,120);}
function saveNow(){
  try{localStorage.setItem(KEY,JSON.stringify(S));if(memOnly){memOnly=false;render(true);}}
  catch(e){if(!memOnly){memOnly=true;render(true);}}
}
window.addEventListener('beforeunload',()=>{persistSession();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){persistSession();saveNow();}});

/* ====================== 记录与状态判断 ====================== */
const rec=id=>S.rec[id]||null;
const isNew=id=>{const r=S.rec[id];return !r||!r.a;};
const isWrong=id=>{const r=S.rec[id];return !!(r&&r.wb);};
const isMas=id=>{const r=S.rec[id];return !!(r&&r.mas&&!r.wb);};
const isDue=id=>{const r=S.rec[id];return !!(r&&r.a>0&&!r.wb&&r.due<=dayN(Date.now()));};
const isStar=id=>!!S.stars[id];
function record(id,ok,ans){
  const now=Date.now();
  const r=S.rec[id]||(S.rec[id]={a:0,c:0,w:0,st:0,box:0,due:0,hist:''});
  r.a++;r.last=now;r.res=ok?1:0;r.hist=((r.hist||'')+(ok?'1':'0')).slice(-8);
  if(ok){r.c++;r.st++;r.box=Math.min(6,r.box+1);r.due=dayN(now)+BOX_DAYS[r.box];if(r.wb&&r.st>=2){r.wb=0;r.mas=1;}}
  else{r.w++;r.st=0;r.box=0;r.due=dayN(now);r.wb=1;r.mas=0;r.lw=now;r.la=ans==null?'':String(ans).slice(0,300);}
  const k=dayKey(now),L=S.log[k]||(S.log[k]={n:0,c:0});L.n++;if(ok)L.c++;
  save();
}
function applyRecord(q,a){
  a.snap=S.rec[q.id]?JSON.parse(JSON.stringify(S.rec[q.id])):null;a.day=dayKey(Date.now());
  record(q.id,a.ok,ansText(q,a));a.rec=true;
}
function reRecord(q,a,newOk){
  if(a.rec){
    if(a.snap)S.rec[q.id]=a.snap;else delete S.rec[q.id];
    const L=S.log[a.day];if(L){L.n--;if(a.ok)L.c--;}
  }
  a.ok=newOk;applyRecord(q,a);
}
function ansText(q,a){
  if(q.t==='c')return a.v==null?'':q.o[a.v];
  if(q.t==='j')return a.v==null?'':(a.v?'正确':'错误');
  if(q.t==='f')return (a.v||[]).join(' ; ');
  return a.v||'';
}

/* ====================== 判分 ====================== */
function gradeObj(q,a){
  if(!a)return false;
  if(q.t==='c')return a.v===q.a;
  if(q.t==='j')return a.v===q.a;
  if(q.t==='f'){
    const v=a.v||[];
    return q.a.every((alts,i)=>{const x=norm(v[i]);return x!==''&&alts.some(t=>norm(t)===x);});
  }
  return (a.sc||0)>=0.7;
}
function fillMarks(q,a){const v=(a&&a.v)||[];return q.a.map((alts,i)=>{const x=norm(v[i]);return x!==''&&alts.some(t=>norm(t)===x);});}
const isSub=q=>q.t==='s'||q.t==='p';
const answered=(q,a)=>{
  if(!a)return false;
  if(q.t==='f')return (a.v||[]).some(x=>String(x||'').trim());
  if(isSub(q))return !!(a.rev||(a.v||'').trim());
  return a.v!=null;
};

/* ====================== 筛选与出题 ====================== */
function srcOK(id,src){
  switch(src){
    case 'new':return isNew(id);
    case 'wrong':return isWrong(id);
    case 'due':return isDue(id);
    case 'star':return isStar(id);
    case 'mas':return isMas(id);
    case 'done':return !isNew(id);
    default:return true;
  }
}
function poolOf(f){
  return Q.filter(q=>f.chs.has(q.ch)&&f.types.has(q.t)&&(!f.topics.size||f.topics.has(q.ch+'|'+q.tp))&&srcOK(q.id,f.src));
}
function topicStat(t){
  const done=t.ids.filter(id=>!isNew(id));
  const ok=done.filter(id=>S.rec[id].res===1).length;
  return {n:t.ids.length,done:done.length,ok,acc:done.length?ok/done.length:null,wrong:t.ids.filter(isWrong).length};
}
function weakTopics(){
  return TOPICS.map(t=>({t,s:topicStat(t)})).filter(x=>x.s.done>=2&&x.s.acc<0.75||x.s.wrong>=2)
    .sort((a,b)=>(a.s.acc??1)-(b.s.acc??1)||b.s.wrong-a.s.wrong);
}
function chStat(ch){
  const ids=Q.filter(q=>q.ch===ch).map(q=>q.id);
  const done=ids.filter(id=>!isNew(id));
  const ok=done.filter(id=>S.rec[id].res===1).length;
  return {n:ids.length,done:done.length,ok,wrong:ids.filter(isWrong).length,acc:done.length?ok/done.length:null};
}
function overall(){
  const done=Q.filter(q=>!isNew(q.id));
  let att=0,cor=0;Object.values(S.rec).forEach(r=>{att+=r.a;cor+=r.c;});
  const okLatest=done.filter(q=>S.rec[q.id].res===1).length;
  return {n:Q.length,done:done.length,att,cor,okLatest,wrong:Q.filter(q=>isWrong(q.id)).length,due:Q.filter(q=>isDue(q.id)).length,
    mas:Q.filter(q=>isMas(q.id)).length,star:Object.keys(S.stars).filter(id=>BY[id]).length};
}
function streakDays(){
  let n=0,d=dayN(Date.now());
  const has=k=>S.log[k]&&S.log[k].n>0;
  const key=dn=>dayKey(dn*DAY+off+DAY/2);
  if(!has(key(d)))d--;
  while(has(key(d))){n++;d--;}
  return n;
}
const todayCount=()=>{const L=S.log[dayKey(Date.now())];return L?L.n:0;};
function buildSmart(n){
  n=n||20;const all=Q.map(q=>q.id),used=new Set(),out=[];
  const take=(arr,k)=>{for(const id of arr){if(out.length>=n||k<=0)break;if(used.has(id))continue;used.add(id);out.push(id);k--;}};
  const wrong=shuffle(all.filter(isWrong));
  const due=all.filter(isDue).sort((a,b)=>S.rec[a].due-S.rec[b].due);
  const wk=weakTopics().slice(0,3).map(x=>x.t.key);
  const weak=shuffle(Q.filter(q=>wk.includes(q.ch+'|'+q.tp)&&(isNew(q.id)||S.rec[q.id].res!==1)).map(q=>q.id));
  const cs={};CHS.forEach(c=>cs[c]=chStat(c));
  const fresh=shuffle(all.filter(isNew)).sort((a,b)=>{const ca=cs[BY[a].ch],cb=cs[BY[b].ch];return (ca.done/ca.n)-(cb.done/cb.n);});
  take(wrong,Math.ceil(n*.35));take(due,Math.ceil(n*.3));take(weak,Math.ceil(n*.2));take(fresh,n);
  if(out.length<n){take(shuffle(all.filter(id=>!isNew(id)).sort((a,b)=>S.rec[a].last-S.rec[b].last).slice(0,n*3)),n);}
  if(out.length<n)take(shuffle(all),n);
  return shuffle(out);

/* 代码高亮（轻量） */
const KW_C=new Set('int char long short void return if else for while do break continue struct const unsigned signed sizeof static NULL typedef switch case default extern'.split(' '));
const KW_SH=new Set('if then else elif fi for in do done while until case esac function local return exit break continue'.split(' '));
function looksCode(s){return /#include|#!\/bin|^\s*(if|for|while)\b.*(then|do)\b|^\s*\w+\(\)\s*\{/m.test(s)||/^[a-z_]+=\S+$/m.test(s)&&s.split('\n').length>3;}
function hl(src){
  const isC=/#include/.test(src);const KW=isC?KW_C:KW_SH;
  const re=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|(^#(?:include|define|!)[^\n]*)|((?:^|[ \t])#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+\b)|([A-Za-z_]\w*)/gm;
  return esc(src).replace(/&quot;/g,'"').replace(re,(m,c1,pp,c2,str,num,id)=>{
    if(c1)return '<span class="tk-c">'+c1+'</span>';
    if(pp)return '<span class="tk-p">'+pp+'</span>';
    if(c2){const lead=m.match(/^[ \t]*/)[0];return lead+'<span class="tk-c">'+m.slice(lead.length)+'</span>';}
    if(str)return '<span class="tk-s">'+str+'</span>';
    if(num)return '<span class="tk-n">'+num+'</span>';
    if(id&&KW.has(id))return '<span class="tk-k">'+id+'</span>';
    return m;
  });
}
function codeBlock(s){return '<pre class="code">'+(looksCode(s)?hl(s):esc(s))+'</pre>';}

const ES={chs:new Set(CHS),limit:120,pref:'fresh'};
const EXAM_SPEC={f:{n:15,p:[1]},c:{n:20,p:[1]},j:{n:15,p:[1]},s:{n:2,p:[10,15]},p:{n:2,p:[15,10]}};
function buildExam(){
  const pool=Q.filter(q=>ES.chs.has(q.ch));
  const ids=[],pts={};
  TORDER.forEach(t=>{
    const spec=EXAM_SPEC[t];let list=pool.filter(q=>q.t===t);
    // 章节均衡：按章分组轮流取
    const byCh={};list.forEach(q=>(byCh[q.ch]=byCh[q.ch]||[]).push(q));
    Object.keys(byCh).forEach(c=>{
      let arr=shuffle(byCh[c]);
      if(ES.pref==='fresh'){const m={};arr.forEach(q=>m[q.id]=score(q));arr=arr.sort((a,b)=>m[a.id]-m[b.id]);}
      byCh[c]=arr;
    });
    function score(q){const r=S.rec[q.id];if(!r||!r.a)return 0-Math.random()*.5;if(r.wb)return 1+Math.random();return 2+(r.res?1:0)+Math.random();}
    const picked=[];
    const rr=(ks,cnt)=>{ks=shuffle(ks);let k=0;while(cnt>0&&ks.some(c=>byCh[c].length)){const c=ks[k%ks.length];k++;if(byCh[c].length){picked.push(byCh[c].shift());cnt--;}}};
    const all=Object.keys(byCh),fr=all.filter(c=>+c<=3),bk=all.filter(c=>+c>3);
    if(fr.length&&bk.length){const nF=Math.round(spec.n*.6);rr(fr,nF);rr(bk,spec.n-picked.length);rr(all,spec.n-picked.length);}
    else rr(all,spec.n);
    shuffle(picked).forEach((q,i)=>picked[i]=q);
    picked.forEach((q,i)=>{ids.push(q.id);pts[q.id]=spec.p[Math.min(i,spec.p.length-1)];});
  });
  return {ids,pts};
}

/* ====================== 答题界面 ====================== */
function ordOf(q,a){
  if(q.t!=='c')return null;
  if(!a.ord){a.ord=S.set.shuffle?shuffle([0,1,2,3]):[0,1,2,3];}
  return a.ord;
}
function curQ(){return BY[SES.ids[SES.idx]];}
function curA(q){return SES.ans[q.id]||(SES.ans[q.id]={});}
function vRun(){
  const n=SES.ids.length,q=curQ();
  if(!q){finishSession();return '';}
  const a=curA(q);
  const locked=SES.instant&&!!a.chk;
  const ptsTxt=SES.pts&&SES.pts[q.id]&&(q.t==='s'||q.t==='p')?'<span class="pts">（'+SES.pts[q.id]+' 分）</span>':'';
  let h='<div class="run-head"><button class="btn sm" data-act="quit">'+IC.x+'退出</button><span class="ttl">'+esc(SES.title)+'</span><div class="bar"><i style="width:'+pct(SES.idx+1,n)+'%"></i></div><span class="timer" id="timer"></span></div>';
  h+='<div class="card qcard"><div class="qmeta"><span class="qno">'+(SES.idx+1)+' / '+n+'</span>'+tTag(q.t)+'<span class="tag">第'+q.ch+'章 · '+esc(q.tp)+'</span>'+(isWrong(q.id)?'<span class="tag bad">错题</span>':isNew(q.id)?'<span class="tag ok">新题</span>':'')+'<button class="star '+(isStar(q.id)?'on':'')+'" data-act="star" title="收藏（S）">'+IC.star+'</button></div>';
  h+=qBody(q,a,locked,ptsTxt);
  h+=feedback(q,a,locked);
  h+='</div>';
  // 底部
  const last=SES.idx===n-1;
  h+='<div class="run-foot"><button class="btn" data-act="prev" '+(SES.idx?'':'disabled')+'>← 上一题</button><span class="sp"></span>';
  if(!SES.instant&&last)h+='<button class="btn pri" data-act="finish">交卷</button>';
  else if(last)h+='<button class="btn pri" data-act="finish">完成 '+IC.check+'</button>';
  else h+='<button class="btn pri" data-act="next">下一题 →</button>';
  h+='</div>';
  h+='<details class="mt" '+(SES.navOpen?'open':'')+' id="navd"><summary class="sub" style="cursor:pointer">题目导航'+(SES.instant?'':'（'+SES.ids.filter(id=>answered(BY[id],SES.ans[id])).length+'/'+n+' 已作答）')+'</summary><div class="navg">'+SES.ids.map((id,i)=>{
    const qq=BY[id],aa=SES.ans[id];let c='';
    if(aa&&aa.chk&&SES.instant)c=aa.ok?'ok':'bad';else if(answered(qq,aa))c='ans';
    if(i===SES.idx)c+=' cur';
    return '<button class="'+c+'" data-act="jump" data-arg="'+i+'">'+(i+1)+'</button>';}).join('')+'</div><div class="legend"><span><i style="background:var(--accent-soft)"></i>答对</span><span><i style="background:var(--bad-soft)"></i>答错</span><span><i style="background:var(--surface2);border-color:var(--muted)"></i>已作答</span></div></details>';
  h+='<div class="sub mt" style="text-align:center"><span class="kbd">←</span> <span class="kbd">→</span> 切题 · <span class="kbd">Enter</span> 提交/下一题 · <span class="kbd">A–D</span> 选择 · <span class="kbd">T</span>/<span class="kbd">F</span> 判断 · <span class="kbd">S</span> 收藏</div>';
  return h;
}
function qBody(q,a,locked,ptsTxt){
  let h='';
  if(q.t==='f'){
    const parts=q.q.split(/_{3,}/);const marks=locked?(a.ov?q.a.map(()=>true):fillMarks(q,a)):[];
    h+='<div class="qtext">';
    parts.forEach((p,i)=>{h+=esc(p);if(i<parts.length-1){const val=(a.v&&a.v[i])||'';h+='<input class="blank '+(locked?(marks[i]?'ok':'bad'):'')+'" data-bi="'+i+'" value="'+esc(val)+'" '+(locked?'readonly':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第'+(i+1)+'空">';}});
    h+='</div>';
    if(!locked&&SES.instant)h+='<div class="qact"><button class="btn pri" data-act="submit">提交答案</button><span class="sub">多个空依次填写，Enter 键提交</span></div>';
  }else if(q.t==='c'){
    const ord=ordOf(q,a);
    h+='<div class="qtext">'+esc(q.q)+'</div><div class="opts">'+ord.map((oi,k)=>{
      let cls=a.v===oi?'sel':'';
      if(locked){cls=oi===q.a?'ok':(a.v===oi?'bad':'');}
      return '<button class="opt '+cls+' '+(locked?'lock':'')+'" data-act="pick" data-arg="'+oi+'"><span class="k">'+'ABCD'[k]+'</span><span class="t">'+esc(q.o[oi])+'</span></button>';}).join('')+'</div>';
  }else if(q.t==='j'){
    const f=(v)=>{let cls=a.v===v?'sel':'';if(locked){cls=v===q.a?'ok':(a.v===v?'bad':'');}return cls+(locked?' lock':'');};
    h+='<div class="qtext">'+esc(q.q)+'</div><div class="jrow"><button class="jbtn '+f(true)+'" data-act="judge" data-arg="1"><b>√</b>正确</button><button class="jbtn '+f(false)+'" data-act="judge" data-arg="0"><b>×</b>错误</button></div>';
  }else{
    h+='<div class="qtext">'+esc(q.q)+ptsTxt+'</div>';
    h+='<textarea class="ans '+(q.t==='p'?'code':'')+'" id="ta" placeholder="'+(q.t==='p'?'在这里写出命令 / 脚本 / 程序（可选，写出来记忆更牢）':'在这里写出你的要点（可选）')+'" spellcheck="false" >'+esc(a.v||'')+'</textarea>';
    if(SES.instant&&!a.rev)h+='<div class="qact"><button class="btn pri" data-act="reveal">查看参考答案</button><span class="sub">先自己想一想或写一写，再对照</span></div>';
    else if(!SES.instant)h+='<div class="qact"><span class="sub">交卷后对照参考答案自评打分</span></div>';
  }
  return h;
}
function rateBar(q,a){
  const R=[[1,'完全掌握'],[.7,'基本正确'],[.4,'部分正确'],[0,'没答出']];
  return '<div class="rate"><span class="lb">对照参考答案，自评：</span>'+R.map(([s,l])=>'<button class="btn sm '+(a.sc===s?'on'+(s===0?' r0':''):'')+'" data-act="rate" data-arg="'+s+'">'+l+'</button>').join('')+'</div>';
}
function feedback(q,a,locked){
  if(isSub(q)){
    if(!a.rev)return '';
    const cls=a.sc==null?'neu':(a.sc>=.7?'ok':'bad');
    return '<div class="fb '+cls+'"><div class="v">参考答案</div><div class="ans">'+ansHtml(q)+'</div>'+rateBar(q,a)+expHtml(q)+'</div>';
  }
  if(!locked)return '';
  const ok=a.ok;
  let h='<div class="fb '+(ok?'ok':'bad')+'"><div class="v">'+(ok?IC.check.replace('<svg','<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"'):IC.x.replace('<svg','<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"'))+(ok?(a.ov?'已按"答对"记录':'回答正确'):'回答错误')+'</div>';
  if(!ok||q.t==='f')h+='<div class="ans"><span class="sub">正确答案：</span>'+ansHtml(q,a.ord)+'</div>';
  if(q.t==='f'&&!ok)h+='<div style="margin-top:8px"><button class="btn sm" data-act="override">我的答案其实也对（等价写法）</button></div>';
  h+=expHtml(q)+'</div>';
  return h;
}
function afterRunRender(){
  const q=curQ();if(!q)return;
  const f=$('.blank:not([readonly])');
  if(f&&!('ontouchstart' in window))f.focus();
}

/* 答题动作 */
function commit(q,a){
  if(a.chk)return;
  a.chk=true;a.ok=gradeObj(q,a);
  if(SES.instant)applyRecord(q,a);
  persistSession();
}
function goto(i){SES.idx=Math.max(0,Math.min(SES.ids.length-1,i));persistSession();render(true);window.scrollTo({top:0});}
function finishSession(){
  if(!SES||SES.done)return;
  const ms=elapsed();
  if(SES.instant){
    // 即时反馈：已即时记录，未提交的填空视为未作答
  }else{
    SES.ids.forEach(id=>{
      const q=BY[id],a=SES.ans[id];
      if(!a||isSub(q)||!answered(q,a))return;
      a.chk=true;a.ok=gradeObj(q,a);applyRecord(q,a);
    });
  }
  SES.done=true;SES.ms=ms;
  const objIds=SES.ids.filter(id=>!isSub(BY[id])&&SES.ans[id]&&SES.ans[id].chk);
  const okN=objIds.filter(id=>SES.ans[id].ok).length;
  S.resume=null;
  SES.entry={t:Date.now(),mode:SES.mode,title:SES.title,n:SES.ids.length,ms};
  S.hist.push(SES.entry);if(S.hist.length>150)S.hist=S.hist.slice(-150);
  if(SES.mode==='exam'){const sc=examScore();S.exams.push({t:SES.entry.t,score:sc.got,full:sc.full,ms:ms,range:(SES.cfg&&SES.cfg.range)||'全部章节'});}
  saveNow();
  go('#/result');
}
function examScore(){
  let got=0,full=0,byT={};
  SES.ids.forEach(id=>{
    const q=BY[id],a=SES.ans[id]||{},p=SES.pts[id]||1;full+=p;
    const b=byT[q.t]||(byT[q.t]={got:0,full:0,n:0,ok:0,done:0});b.full+=p;b.n++;
    if(isSub(q)){if(a.sc!=null){b.done++;b.got+=p*a.sc;if(a.sc>=.7)b.ok++;}}
    else if(a.chk){b.done++;if(a.ok){b.got+=p;b.ok++;}}
  });
  Object.values(byT).forEach(b=>{got+=b.got;});
  return {got:Math.round(got*10)/10,full,byT};
}

  }

  SES.ids.forEach((id,i)=>{h+=reviewItem(BY[id],SES.ans[id]||{},i);});

function reviewItem(q,a,i){
  const state=isSub(q)?(a.sc==null?'un':(a.sc>=.7?'ok':'bad')):(!a.chk?'un':(a.ok?'ok':'bad'));
  const tag=state==='ok'?'<span class="tag ok">正确</span>':state==='bad'?'<span class="tag bad">错误</span>':'<span class="tag warn">'+(isSub(q)?'待自评':'未作答')+'</span>';
  const pts=SES.pts&&SES.pts[q.id]?'<span class="tag">'+SES.pts[q.id]+' 分</span>':'';
  let mine='';
  if(q.t==='c'&&a.v!=null)mine='<div class="sub" style="margin-top:8px">你的答案：'+esc(q.o[a.v])+'</div>';
  if(q.t==='j'&&a.v!=null)mine='<div class="sub" style="margin-top:8px">你的答案：'+(a.v?'正确':'错误')+'</div>';
  if(q.t==='f'&&answered(q,a))mine='<div class="sub" style="margin-top:8px">你的答案：'+esc((a.v||[]).join(' ； '))+'</div>';
  if(isSub(q)&&(a.v||'').trim())mine='<div style="margin-top:8px" class="sub">你的作答：</div><pre class="txt">'+esc(a.v)+'</pre>';
  const optList=q.t==='c'?'<ul class="opts-s">'+q.o.map((o,k)=>'<li class="'+(k===q.a?'ok':'')+'">'+'ABCD'[k]+'. '+esc(o)+'</li>').join('')+'</ul>':'';
  const open=(state!=='ok'||isSub(q))?'open':'';
  return '<details class="qi" data-st="'+state+'" '+open+'><summary><span class="qno">'+(i+1)+'</span><div class="st"><div class="tg">'+tTag(q.t)+'<span class="tag">第'+q.ch+'章 · '+esc(q.tp)+'</span>'+pts+tag+'</div><div class="tx">'+esc(q.q)+'</div></div></summary><div class="bd">'+optList+mine+'<div class="ans" style="margin-top:10px"><span class="sub">参考答案：</span>'+ansHtml(q)+'</div>'+(isSub(q)?'<div data-rate="'+q.id+'">'+rateBar(q,a)+'</div>':'')+expHtml(q)+'</div></details>';
}

function qItem(q,showHist){
  const r=S.rec[q.id]||{};

  const mine=showHist&&r.la?'<div class="sub" style="margin-top:8px">你上次的答案：<span style="color:var(--bad)">'+esc(r.la)+'</span></div>':'';

}

    let ans;
    if(q.t==='f')ans=q.a.map(a=>esc(a[0])).join('；');
    else if(q.t==='c')ans='ABCD'[q.a]+'. '+esc(q.o[q.a]);
    else if(q.t==='j')ans=q.a?'√ 正确':'× 错误';
    else ans='<pre>'+esc(q.a)+'</pre>';
    return '<div class="pq"><div><b>'+(i+1)+'.</b> ['+TYPES[q.t]+' · 第'+q.ch+'章] '+esc(q.q)+'</div>'+body+'<div class="pa"><b>答案：</b>'+ans+'</div>'+(q.e?'<div class="pe">解析：'+esc(q.e)+'</div>':'')+'</div>';
  }).join('');
  setTimeout(()=>window.print(),80);
}

/* ====================== 题库浏览 ====================== */
const BS={q:'',ch:0,t:'',st:'all',lim:40};
function vBank(){
  const kw=BS.q.trim().toLowerCase();
  let list=Q.filter(q=>(!BS.ch||q.ch===BS.ch)&&(!BS.t||q.t===BS.t)&&
    (BS.st==='all'||(BS.st==='new'&&isNew(q.id))||(BS.st==='done'&&!isNew(q.id))||(BS.st==='wrong'&&isWrong(q.id))||(BS.st==='mas'&&isMas(q.id))||(BS.st==='star'&&isStar(q.id)))&&
    (!kw||(q.q+' '+(q.tp)+' '+(q.e||'')+' '+(q.o?q.o.join(' '):'')+' '+(typeof q.a==='string'?q.a:'')).toLowerCase().includes(kw)));
  let h='<div class="row mb"><div><h1>题库浏览</h1><div class="sub">查题、背答案、按关键词搜索；展开可看答案与解析</div></div></div>';
  h+='<div class="row mb"><div class="search">'+IC.search+'<input class="inp" id="bq" placeholder="搜索关键词，如 fork、umask、管道…" value="'+esc(BS.q)+'"></div><select id="bch"><option value="0">全部章节</option>'+CHS.map(c=>'<option value="'+c+'" '+(BS.ch===c?'selected':'')+'>第'+c+'章</option>').join('')+'</select><select id="bt"><option value="">全部题型</option>'+TORDER.map(t=>'<option value="'+t+'" '+(BS.t===t?'selected':'')+'>'+TYPES[t]+'</option>').join('')+'</select><select id="bst">'+[['all','全部状态'],['new','未做'],['done','已做'],['wrong','错题'],['mas','已掌握'],['star','收藏']].map(([k,l])=>'<option value="'+k+'" '+(BS.st===k?'selected':'')+'>'+l+'</option>').join('')+'</select></div>';
  h+='<div class="sub mb">共 '+list.length+' 题</div>';

  if(!list.length)h+='<div class="card empty"><b>没有找到题目</b>换个关键词或筛选条件试试</div>';
  return h;
}

  h+='<div class="sec"><h2>各专题正确率</h2><span class="sub">从低到高；至少做过 1 题</span></div><div class="card flat"><table class="t"><tr><th>专题</th><th class="n">已做</th><th class="n">正确率</th></tr>'+(TOPICS.map(t=>({t,s:topicStat(t)})).filter(x=>x.s.done).sort((a,b)=>a.s.acc-b.s.acc).map(({t,s})=>'<tr><td><span class="tag">第'+t.ch+'章</span> '+esc(t.tp)+'</td><td class="n">'+s.done+'/'+s.n+'</td><td class="n" style="color:'+(s.acc<.6?'var(--bad)':s.acc<.8?'var(--warn)':'var(--accent)')+'"><b>'+Math.round(s.acc*100)+'%</b></td></tr>').join('')||'<tr><td colspan="3" class="sub">做几道题之后，这里会显示各专题的正确率</td></tr>')+'</table></div>';
  h+='<div class="sec"><h2>各题型</h2></div><div class="grid g4">'+TORDER.map(t=>{const ids=Q.filter(q=>q.t===t).map(q=>q.id),d=ids.filter(id=>!isNew(id)),ok=d.filter(id=>S.rec[id].res===1).length;return '<div class="card flat"><div>'+tTag(t)+'</div><div class="score" style="font-size:28px;margin-top:8px">'+pct(ok,d.length)+'<small>%</small></div><div class="sub">已做 '+d.length+'/'+ids.length+'</div></div>';}).join('')+'</div>';
  h+='<div class="sec"><h2>近 14 天</h2></div><div class="card">'+activityChart()+'</div>';
  const ex=S.exams.slice(-8);

  const hs=S.hist.slice(-10).reverse();
  if(hs.length)h+='<div class="sec"><h2>最近练习</h2></div><div class="card flat"><table class="t"><tr><th>时间</th><th>内容</th><th class="n">题数</th><th class="n">用时</th></tr>'+hs.map(x=>'<tr><td>'+dayKey(x.t)+'</td><td>'+(x.mode==='exam'?'<span class="tag warn">模考</span> ':'')+esc(x.title)+'</td><td class="n">'+x.n+'</td><td class="n">'+fmtT(x.ms)+'</td></tr>').join('')+'</table></div>';
  h+='<div class="sec"><h2>数据管理</h2></div><div class="card flat row"><button class="btn" data-act="export">导出进度（JSON 备份）</button><button class="btn" data-act="import">导入进度</button><span class="sp"></span><button class="btn bad" data-act="reset">清空全部记录</button></div>';
  return h;
}

  '<div class="sub">题库 '+Q.length+' 题 · 复习间隔：1 / 2 / 4 / 7 / 15 / 30 天</div>');

function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='linux题库进度-'+dayKey(Date.now()).replace(/-/g,'')+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('已导出');
}
function importData(txt){
  let o;try{o=JSON.parse(txt);}catch(e){toast('文件格式不正确');return;}
  if(!o||typeof o!=='object'||!o.rec){toast('不是有效的进度文件');return;}
  let n=0;
  Object.keys(o.rec).forEach(id=>{if(!BY[id])return;const a=S.rec[id],b=o.rec[id];if(!a||(b.last||0)>(a.last||0)){S.rec[id]=b;n++;}});
  Object.assign(S.stars,o.stars||{});
  Object.keys(o.log||{}).forEach(k=>{const a=S.log[k],b=o.log[k];if(!a||b.n>a.n)S.log[k]=b;});
  const seen=new Set(S.hist.map(x=>x.t));(o.hist||[]).forEach(x=>{if(!seen.has(x.t))S.hist.push(x);});S.hist.sort((a,b)=>a.t-b.t);
  const se=new Set(S.exams.map(x=>x.t));(o.exams||[]).forEach(x=>{if(!se.has(x.t))S.exams.push(x);});S.exams.sort((a,b)=>a.t-b.t);
  saveNow();closeModal();render(true);toast('已合并导入，更新 '+n+' 道题的记录');
}

/* ====================== 事件 ====================== */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){closeModal();go('#/'+g.dataset.go);return;}
  const b=e.target.closest('[data-act]');
  if(!b)return;
  act(b.dataset.act,b.dataset.arg||b.dataset.v,b);
});
function act(a,arg,el){
  switch(a){
    case 'close-modal':closeModal();break;
    case 'resume':resumeSession();break;
    case 'discard':if(confirm('放弃未完成的练习？')){S.resume=null;saveNow();render(true);}break;
    case 'smart':startSession({mode:'practice',title:'今日复习',ids:buildSmart(20),instant:S.set.instant});break;
    case 's-wrong':startSession({mode:'practice',title:'错题攻克',ids:shuffle(Q.filter(q=>isWrong(q.id)).map(q=>q.id)).slice(0,30),instant:true});break;
    case 's-due':startSession({mode:'practice',title:'到期复习',ids:Q.filter(q=>isDue(q.id)).sort((a,b)=>S.rec[a.id].due-S.rec[b.id].due).map(q=>q.id).slice(0,30),instant:true});break;
    case 's-weak':{const w=weakTopics().slice(0,3).map(x=>x.t.key);startSession({mode:'practice',title:'薄弱专题强化',ids:shuffle(Q.filter(q=>w.includes(q.ch+'|'+q.tp)).map(q=>q.id)).slice(0,25),instant:true});break;}
    case 's-new':startSession({mode:'practice',title:'新题探索',ids:buildNew(20),instant:S.set.instant});break;
    case 'topic':startSession({mode:'practice',title:TOPIC_IDX[arg].tp,ids:shuffle(TOPIC_IDX[arg].ids).slice(0,20),instant:true});break;
    case 'chapter':{const c=+arg;startSession({mode:'practice',title:'第'+c+'章 '+CHN(c),ids:shuffle(Q.filter(q=>q.ch===c).map(q=>q.id)).sort((x,y)=>(isNew(y)-isNew(x))).slice(0,20),instant:S.set.instant});break;}
    // 练习设置
    case 'tg':{const k=el.dataset.k,v=el.dataset.v,set=PS[k];const val=k==='chs'?+v:v;set.has(val)?set.delete(val):set.add(val);if(k==='chs'&&!PS.chs.has(+v)){[...PS.topics].forEach(t=>{if(t.startsWith(v+'|'))PS.topics.delete(t);});}render(true);break;}
    case 'all-ch':PS.chs=new Set(CHS);render(true);break;
    case 'no-ch':PS.chs=new Set();PS.topics.clear();render(true);break;
    case 'clr-tp':PS.topics.clear();render(true);break;
    case 'src':PS.src=arg;render(true);break;
    case 'n':PS.n=+arg;render(true);break;
    case 'order':PS.order=arg;render(true);break;
    case 'p-inst':PS.instant=!(PS.instant==null?S.set.instant:PS.instant);render(true);break;
    case 'p-start':{
      let ids=poolOf(PS);
      if(PS.order==='rand')ids=shuffle(ids);
      if(PS.n&&ids.length>PS.n){ids=PS.order==='rand'?ids.slice(0,PS.n):shuffle(ids).slice(0,PS.n).sort((x,y)=>x.i-y.i);}
      if(PS.order==='seq')ids=ids.slice().sort((x,y)=>x.i-y.i);
      startSession({mode:'practice',title:'自选练习',ids:ids.map(q=>q.id),instant:PS.instant==null?S.set.instant:PS.instant,cfg:{custom:1}});break;}
    // 考试
    case 'e-tg':{const v=+arg;ES.chs.has(v)?ES.chs.delete(v):ES.chs.add(v);render(true);break;}
    case 'e-all':ES.chs=new Set(CHS);render(true);break;
    case 'e-limit':ES.limit=+arg;render(true);break;
    case 'e-pref':ES.pref=arg;render(true);break;
    case 'e-start':{const ex=buildExam();const all=ES.chs.size===CHS.length;startSession({mode:'exam',title:'模拟考试 · '+(all?'期末综合':[...ES.chs].sort().map(c=>'CH'+c).join(' ')),ids:ex.ids,pts:ex.pts,instant:false,limit:ES.limit,cfg:{range:all?'全部章节':[...ES.chs].sort().map(c=>'第'+c+'章').join('、')}});break;}
    // 答题
    case 'quit':syncCur();persistSession();toast('进度已保存，可在首页继续');SES=null;go('#/home');break;
    case 'pick':{const q=curQ(),a=curA(q);if(SES.instant&&a.chk)break;a.v=+arg;if(SES.instant)commit(q,a);else persistSession();render(true);break;}
    case 'judge':{const q=curQ(),a=curA(q);if(SES.instant&&a.chk)break;a.v=arg==='1';if(SES.instant)commit(q,a);else persistSession();render(true);break;}
    case 'submit':{const q=curQ(),a=curA(q);syncInputs(q,a);if(!answered(q,a)){toast('先填写答案');break;}commit(q,a);render(true);break;}
    case 'reveal':{const q=curQ(),a=curA(q);syncInputs(q,a);a.rev=true;persistSession();render(true);break;}
    case 'rate':{const q=curQ(),a=curA(q);a.sc=+arg;a.chk=true;if(a.rec)reRecord(q,a,a.sc>=.7);else{a.ok=a.sc>=.7;applyRecord(q,a);}persistSession();render(true);break;}
    case 'override':{const q=curQ(),a=curA(q);a.ov=true;reRecord(q,a,true);persistSession();render(true);break;}
    case 'star':{const q=curQ();toggleStar(q.id);render(true);break;}
    case 'next':syncCur();goto(SES.idx+1);break;
    case 'prev':syncCur();goto(SES.idx-1);break;
    case 'jump':syncCur();SES.navOpen=true;goto(+arg);break;
    case 'finish':syncCur();
      if(!SES.instant){const un=SES.ids.filter(id=>!answered(BY[id],SES.ans[id])).length;if(un&&!confirm('还有 '+un+' 题未作答，确定交卷吗？'))break;}
      finishSession();break;
    case 'again':{const c=SES.cfg;if(SES.mode==='exam'){go('#/exam');}else if(c&&c.custom){go('#/practice');}else{startSession({mode:'practice',title:'今日复习',ids:buildSmart(20),instant:S.set.instant});}break;}
    case 'redo-wrong':{const ids=SES.ids.filter(id=>SES.ans[id]&&(SES.ans[id].chk||SES.ans[id].sc!=null)&&!SES.ans[id].ok);startSession({mode:'practice',title:'本次错题重做',ids:shuffle(ids),instant:true});break;}
    case 'rv':{$$('#rvf button').forEach(x=>x.classList.toggle('on',x===el));$$('#rvlist .qi').forEach(d=>{d.classList.toggle('hide',arg==='bad'&&d.dataset.st==='ok');});break;}
    // 评分（结果页）
    // 错题本
    case 'w-tab':WS.tab=arg;render(true);break;
    case 'redo-all':startSession({mode:'practice',title:'错题重练',ids:shuffle(Q.filter(q=>isWrong(q.id)).map(q=>q.id)).slice(0,40),instant:true});break;
    case 'one':startSession({mode:'practice',title:'单题重做',ids:[arg],instant:true});break;
    case 'bank-star':toggleStar(arg);render(true);break;
    case 'mark-mas':{const r=S.rec[arg];if(r){r.wb=0;r.mas=1;save();}render(true);break;}
    case 'print-wrong':printWrong();break;
    case 'more':BS.lim+=40;render(true);break;
    // 数据
    case 'export':exportData();break;
    case 'import':$('#fileIn').click();break;
    case 'reset':if(confirm('这会清空所有答题记录、错题本和收藏，且无法恢复。建议先导出备份。确定清空吗？')&&confirm('再确认一次：真的要清空吗？')){const th=S.set;S=defState();S.set=th;saveNow();closeModal();location.hash='#/home';render();toast('已清空');}break;
    case 'theme':S.set.theme=arg;saveNow();applyTheme();openSettings();break;
    case 's-shuffle':S.set.shuffle=!S.set.shuffle;saveNow();openSettings();break;
    case 's-instant':S.set.instant=!S.set.instant;saveNow();openSettings();break;
  }
}
function buildNew(n){
  const cs={};CHS.forEach(c=>cs[c]=chStat(c));
  return shuffle(Q.filter(q=>isNew(q.id)).map(q=>q.id)).sort((a,b)=>cs[BY[a].ch].done/cs[BY[a].ch].n-cs[BY[b].ch].done/cs[BY[b].ch].n).slice(0,n);
}
function toggleStar(id){if(S.stars[id])delete S.stars[id];else S.stars[id]=1;save();}
function syncInputs(q,a){
  if(q.t==='f'){a.v=$$('.blank').map(i=>i.value);}
  else if(isSub(q)){const t=$('#ta');if(t)a.v=t.value;}
}
function syncCur(){if(route!=='run'||!SES)return;const q=curQ();if(!q)return;const a=curA(q);if(q.t==='f'&&!a.chk)syncInputs(q,a);else if(isSub(q))syncInputs(q,a);}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('blank')&&SES){const q=curQ(),a=curA(q);a.v=$$('.blank').map(i=>i.value);clearTimeout(act._t);act._t=setTimeout(persistSession,600);}
  else if(t.id==='ta'&&SES){const q=curQ(),a=curA(q);a.v=t.value;clearTimeout(act._t);act._t=setTimeout(persistSession,600);}
  else if(t.id==='bq'){BS.q=t.value;BS.lim=40;clearTimeout(act._s);act._s=setTimeout(()=>{const pos=t.selectionStart;render(true);const n=$('#bq');if(n){n.focus();n.setSelectionRange(pos,pos);}},180);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='wch'){WS.ch=+t.value;render(true);}
  else if(t.id==='wt'){WS.t=t.value;render(true);}
  else if(t.id==='bch'){BS.ch=+t.value;BS.lim=40;render(true);}
  else if(t.id==='bt'){BS.t=t.value;BS.lim=40;render(true);}
  else if(t.id==='bst'){BS.st=t.value;BS.lim=40;render(true);}
  else if(t.id==='fileIn'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(f);t.value='';}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return;}
  if(route!=='run'||!SES||e.metaKey||e.altKey)return;
  const q=curQ();if(!q)return;const a=curA(q);
  const tg=e.target,typing=tg.tagName==='INPUT'||tg.tagName==='TEXTAREA';
  if(e.key==='Enter'&&!e.shiftKey&&(!typing||tg.tagName==='INPUT'||e.ctrlKey)){
    e.preventDefault();
    if(q.t==='f'){ if(SES.instant&&!a.chk)act('submit');else act(SES.idx<SES.ids.length-1?'next':'finish'); return; }
    if(isSub(q)){ if(SES.instant&&!a.rev)act('reveal'); else act(SES.idx<SES.ids.length-1?'next':'finish'); return; }
    if(SES.instant&&a.chk)act(SES.idx<SES.ids.length-1?'next':'finish');
    else if(!SES.instant)act(SES.idx<SES.ids.length-1?'next':'finish');
    return;
  }
  if(typing)return;
  if(e.ctrlKey)return;
  if(e.key==='ArrowRight'){act('next');return;}
  if(e.key==='ArrowLeft'){act('prev');return;}
  const k=e.key.toLowerCase();
  if(k==='s'){act('star');return;}
  if(q.t==='c'){
    const idx='abcd'.indexOf(k)>=0?'abcd'.indexOf(k):('1234'.indexOf(k));
    if(idx>=0){const ord=ordOf(q,a);act('pick',String(ord[idx]));}
  }else if(q.t==='j'){
    if(k==='t'||k==='y'||k==='1')act('judge','1');else if(k==='f'||k==='n'||k==='2')act('judge','0');
  }else if(isSub(q)&&a.rev){
    const m={'1':1,'2':.7,'3':.4,'4':0}[k];if(m!=null)act('rate',String(m));
  }
});
$('#btnTheme').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||(S.set.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  S.set.theme=dark?'light':'dark';saveNow();applyTheme();
});
$('#btnSet').addEventListener('click',openSettings);

// 结果页自评
document.addEventListener('click',e=>{
  if(route!=='result')return;
  const b=e.target.closest('[data-act="rate"]');if(!b)return;
  e.stopPropagation();
  const host=b.closest('[data-rate]');if(!host)return;
  const id=host.dataset.rate,q=BY[id],a=SES.ans[id]||(SES.ans[id]={});
  a.sc=+b.dataset.arg;a.chk=true;
  if(a.rec)reRecord(q,a,a.sc>=.7);else{a.ok=a.sc>=.7;applyRecord(q,a);}
  const keep=window.scrollY;
  const det=host.closest('details');const wasOpen=det&&det.open;
  render(true);window.scrollTo(0,keep);
  if(SES.mode==='exam'){
    // 保存/更新考试成绩
    const sc=examScore();
    const idx=S.exams.findIndex(x=>x.t===SES.entry.t);
    const rowE={t:SES.entry.t,score:sc.got,full:sc.full,ms:SES.ms,range:(SES.cfg&&SES.cfg.range)||'全部章节'};
    if(idx>=0)S.exams[idx]=rowE;else S.exams.push(rowE);
    save();
  }
},true);

/* ====================== 启动 ====================== */
load();applyTheme();
if(!location.hash)location.hash='#/home';
render();
})();
</script>
